    }
    hits.innerHTML = res.length ? res.map(function (h, i) { return '<button class="ik-hit" data-i="' + i + '"><span class="ik-grow">' + ikEsc(h.label) + "</span><small>" + ikEsc(h.sub) + "</small></button>"; }).join("") :
      '<div class="ik-empty">' + (q.value.trim() ? "Nothing matches. Try a simpler word, or tell " + ikEsc(name) + '.<br><button class="ik-btn soft" data-mkq style="margin-top:10px">✏️ Make “' + ikEsc(q.value.trim().slice(0, 40)) + '” with my own numbers</button>' : "Type to search the food table, your recipes and your foods.") + "</div>";
    var mk = hits.querySelector("[data-mkq]"); if (mk) mk.addEventListener("click", function () { ikOpenFoodEditor({ name: q.value.trim().slice(0, 60), addNow: true }); });
    hits.querySelectorAll("[data-i]").forEach(function (b) { b.addEventListener("click", function () { pick(res[+b.getAttribute("data-i")]); }); });
  }
  function pick(h) {
    var r = ikResolve(h.ref, d); if (!r) return;
    chosen = h; hits.innerHTML = "";
    var servings = !!r.perServing && !r.per100, ms = r.food ? r.food.m : r.recipe && r.recipe.totalG ? [["The whole recipe", r.recipe.totalG]] : [];
    var g0 = h.g || (ms[0] ? ms[0][1] : 100), now = day === ikToday() ? ikNowTime() : "12:00";
    amt.innerHTML = '<div class="ik-item"><b>' + ikEsc(r.label) + "</b>" + (r.typical ? '<span class="ik-small">Typical amounts. For your exact product, snap its label.</span>' : "") +
      (servings ? '<label class="ik-label">Servings</label><input class="ik-input" type="number" inputmode="decimal" min="0.25" step="0.25" value="' + (h.n || 1) + '" data-n style="max-width:140px">' :
        '<label class="ik-label">How much (grams)</label><div class="ik-row"><input class="ik-input" type="number" inputmode="decimal" min="1" step="5" value="' + Math.round(g0) + '" data-gr style="max-width:140px"><span class="ik-small" data-ab></span></div>' +
        (ms.length ? '<div class="ik-chips" style="margin-top:8px">' + ms.map(function (m, i) { return '<button class="ik-chip" data-m="' + i + '">' + ikEsc(ikMeasureLabel(m[0])) + "</button>"; }).join("") + "</div>" : "")) +
      (ikCookable(h.ref) && !servings ? ikMethodSelect("data-meth", "") : "") +
      '<div class="ik-two"><div><label class="ik-label">Time</label><input class="ik-input" type="time" value="' + now + '" data-t></div><div><label class="ik-label">Kind</label><select class="ik-input" data-k>' +
      ["food", "drink", "supplement"].map(function (k) { var def = r.kind === "supplement" || r.type === "supp" ? "supplement" : r.kind === "drink" ? "drink" : "food"; return "<option" + (k === def ? " selected" : "") + ">" + k + "</option>"; }).join("") + "</select></div></div>" +
      '<button class="ik-btn wide" data-add style="margin-top:12px">Add to ' + ikEsc(day === ikToday() ? "today" : ikDayName(day)) + "</button></div>";
    var gr = amt.querySelector("[data-gr]"), ab = amt.querySelector("[data-ab]");
    function about() { if (ab && gr) { var x = ikTotals([{ items: [{ ref: h.ref, g: +gr.value }] }], d).v.kcal; ab.textContent = (r.food ? ikAbout(r.food, +gr.value) + " · " : "") + (ikHideKcal(d) ? "" : ikNum(x, 0) + " kcal"); } }
    if (gr) { gr.addEventListener("input", about); about(); }
    amt.querySelectorAll("[data-m]").forEach(function (b) { b.addEventListener("click", function () { gr.value = Math.round(ms[+b.getAttribute("data-m")][1]); about(); }); });
    amt.querySelector("[data-add]").addEventListener("click", function () {
      var t = amt.querySelector("[data-t]").value || now, kind = amt.querySelector("[data-k]").value;
      var item = { ref: h.ref, name: r.label };
      if (servings) item.n = Math.max(0.25, Number(amt.querySelector("[data-n]").value) || 1); else item.g = Math.max(1, Number(gr.value) || 100);
      var items = [item], meth = amt.querySelector("[data-meth]");
      if (meth && meth.value && item.g) { item.method = meth.value; var oi = ikOilItem(d, ikOilGrams(d, meth.value, item.g)); if (oi) items.push(oi); }   // V4
      var e = { id: dd.ui.uid("e"), day: day, time: t, part: ikPartOf(t), kind: kind, name: "", items: items, src: "typed" };
      dd.update(function (dt) { ikTouch(dt, items); dt.entries.push(e); });
      dd.ui.toast("Added " + r.label + ".");

  }
  q.addEventListener("input", list);

/* "Oh, I forgot to add lunch" (Oran, 2026-10-13): DigiBot asks what and about when, then logs it at that time. */
function ikForgotMeal() {
  if (!dd.helper || !dd.helper.enabled()) return;
  if (!(dd.ai && dd.ai.hasCode())) { dd.setup.needAI("To add a meal by telling " + dd.helper.name() + ", the helper needs a free access code from Google."); return; }
  dd.helper.say("No problem. What did you have? Say it the way you'd tell a friend, like \"half an avocado, two eggs and whole grain toast\". I'll ask about when, then add it at that time.");
}
function ikTellHelper() {
  if (!dd.helper || !dd.helper.enabled()) return;
  dd.helper.say("Tell me what you had, the way you'd say it: \"two eggs and a slice of rye toast with butter\" or \"a large coffee with cream\". I'll add it, and you can undo anything I change.", { chips: ["What should I eat to get more protein?"] });
}

/* ---------- V4: Add again — recent and usual foods, one tap (Oran, 2026-10-13) ----------
   Every past entry is grouped by what was in it and how much (so "250 mL water" and "500 mL water" are separate).
   Recent: newest first. Most often: how many times in the last 60 days. Tapping adds a copy at the current time. */
function ikEntrySig(e) {
  return (e.kind || "food") + "|" + (e.items || []).map(function (i) { return i.ref + "@" + (i.n != null ? "n" + i.n : Math.round(i.g || 0)); }).sort().join(",");
}
function ikUsual(d, mode) {
  return ikMemo("usual:" + mode, function () {
    var by = {}, from = ikAddDays(ikToday(), -60), list = [];
    (d.entries || []).forEach(function (e) {
      if (!(e.items || []).length || !(e.items || []).every(function (i) { return ikResolve(i.ref, d); })) return;   // skip ones whose food was deleted
      var sig = ikEntrySig(e), at = e.day + " " + (e.time || "");
      var u = by[sig] || (by[sig] = { sig: sig, e: e, count: 0, last: "" });
      if (e.day >= from) u.count++;
      if (at > u.last) { u.last = at; u.e = e; }
    });
    Object.keys(by).forEach(function (k) { var u = by[k]; u.name = ikEntryName(u.e, d); list.push(u); });
    if (mode === "common") return list.filter(function (u) { return u.count >= 2; }).sort(function (a, b) { return b.count - a.count || (b.last > a.last ? 1 : -1); }).slice(0, 20);
    return list.sort(function (a, b) { return b.last > a.last ? 1 : -1; }).slice(0, 20);
  });
}
function ikUsualAmount(u, d) {
  return (u.e.items || []).filter(function (i) { return !/for cooking$/.test(i.name || ""); }).map(function (i) {
    var r = ikResolve(i.ref, d), drink = u.e.kind === "drink" || (r && r.kind === "drink");
    return i.n != null ? i.n + " serv." : Math.round(i.g || 0) + (drink ? " mL" : " g");
  }).join(" + ");
}
function ikAddAgain(sig) {
  var d = dd.getData(), u = ikUsual(d, "recent").concat(ikUsual(d, "common")).filter(function (x) { return x.sig === sig; })[0]; if (!u) return;
  var day = IK_UI.day || ikToday(), t = day === ikToday() ? ikNowTime() : (u.e.time || "12:00"), src = u.e;
  var e = { id: dd.ui.uid("e"), day: day, time: t, part: ikPartOf(t), kind: src.kind || "food", name: src.name || "",
            items: JSON.parse(JSON.stringify(src.items)), src: "again" };
  dd.update(function (dt) { ikTouch(dt, e.items); dt.entries.push(e); });
  var fl = ikEntryFlags(e, dd.getData()).filter(function (f) { return f.lvl === "warn"; })[0];
  dd.ui.toast("Added " + ikEntryName(e, dd.getData()) + (day === ikToday() ? "" : " to " + ikDayName(day)) + "." + (fl ? " ⚠ " + fl.short + "." : ""), fl ? 5000 : 2500);
}
function ikOpenAgain() {
  var tab = ikUsual(dd.getData(), "common").length ? "common" : "recent";
  var sh = dd.ui.sheet("", { sticky: false }); sh.classList.add("ik-sheet");
  function paint() {
    var d = dd.getData(), list = ikUsual(d, tab), hide = ikHideKcal(d), day = IK_UI.day || ikToday();
    sh.innerHTML = '<div class="ik-sheettop"><h2>Add again</h2><button class="ik-x" data-close aria-label="Close">✕</button></div>' +
      '<div class="ik-seg" role="tablist" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0 0 12px">' +
        '<button role="tab" data-tab="common" aria-selected="' + (tab === "common") + '">Most often</button><button role="tab" data-tab="recent" aria-selected="' + (tab === "recent") + '">Recent</button></div>' +
      (list.length ? '<div class="ik-hits" style="max-height:60vh">' + list.map(function (u) {
        var icon = u.e.kind === "drink" ? "drink" : u.e.kind === "supplement" ? "supplement" : u.e.part;
        var kcal = ikEntryKcalM(u.e, d);
        return '<button class="ik-hit" data-sig="' + ikEsc(u.sig) + '"><span class="ik-ico ' + icon + '" aria-hidden="true">' + (IK_PART_ICON[icon] || "🍽️") + '</span>' +
          '<span class="ik-grow"><b>' + ikEsc(u.name) + "</b><br><small>" + ikEsc(ikUsualAmount(u, d)) + (hide ? "" : " · " + ikNum(kcal, 0) + " kcal") +
          (tab === "common" ? " · " + u.count + "× lately" : " · " + ikEsc(ikShortDate(u.e.day))) + '</small></span><span class="ik-round" aria-hidden="true">＋</span></button>';
      }).join("") + "</div>"
        : '<div class="ik-empty">' + (tab === "common" ? "Things you have more than once show up here." : "Nothing logged yet.") + "</div>") +
      '<p class="ik-small">Tap to add it to ' + ikEsc(day === ikToday() ? "today, at the time now" : ikDayName(day)) + '. The list stays open, so you can add a few. To change the amount after, tap it in your food list.</p>';
    sh.querySelector("[data-close]").addEventListener("click", dd.ui.closeSheet);
    sh.querySelectorAll("[data-tab]").forEach(function (b) { b.addEventListener("click", function () { tab = b.getAttribute("data-tab"); paint(); }); });
    sh.querySelectorAll("[data-sig]").forEach(function (b) { b.addEventListener("click", function () {
      ikAddAgain(b.getAttribute("data-sig"));
      b.style.background = "var(--ik-fibre-soft)"; setTimeout(function () { if (document.body.contains(b)) b.style.background = ""; }, 600);
    }); });
  }
  paint();
}

/* ---------- V4: my own food or supplement, with my own numbers (Oran, 2026-10-13) ----------
   For anything the table doesn't have or gets wrong (psyllium fibre, a protein powder, a vitamin).
   Numbers are per serving (one scoop, one capsule) or per 100 g. An empty box means "not in it".
   Editing a food changes every day it was had, since the numbers are worked out when shown.
   opts: {id (edit), name, kind, prefill:{perServing|per100}, addNow, swap:{entry, index}, onDone, onCancel} */
var IK_FE_MAIN = ["kcal", "protein", "fibre", "carb", "sugar", "fat", "sat", "na"];
function ikFoodUsed(d, id) { return (d.entries || []).some(function (e) { return (e.items || []).some(function (i) { return i.ref === "c:" + id; }); }); }
function ikOpenFoodEditor(opts) {
  opts = opts || {};
  var d0 = dd.getData(), c = opts.id ? (d0.customFoods || []).filter(function (x) { return x.id === opts.id; })[0] : null;
  var src = c || opts.prefill || {};
  var w = { name: c ? c.name : opts.name || "", kind: c ? c.kind || "food" : opts.kind || "food", sg: c ? c.servingG || null : null };
  var basis = src.perServing ? "serving" : src.per100 ? "100" : "serving";
  var vals = {}; var from = src.perServing || src.per100 || {};
  IK_N.forEach(function (n) { var v = from[n.k]; if (v != null && isFinite(v)) vals[n.k] = +(+v).toPrecision(4); });
  var name = dd.helper ? dd.helper.name() : "DigiBot", saved = false;
  var sh = dd.ui.sheet("", { sticky: true, onClose: function () { if (!saved && opts.onCancel) setTimeout(opts.onCancel, 0); } });
  sh.classList.add("ik-sheet");
  function field(k) {
    var nt = IK_NBY[k], v = vals[k];
    return '<div class="ik-tgt" style="grid-template-columns:minmax(0,1fr) 120px"><span>' + ikEsc(nt.label) + ' <span class="ik-small">' + nt.unit + '</span></span>' +
      '<input type="number" inputmode="decimal" min="0" step="any" data-nk="' + k + '" value="' + (v == null ? "" : v) + '" placeholder="–" aria-label="' + ikEsc(nt.label + " in " + nt.unit) + '"></div>';
  }
  function collect() {
    var nm = sh.querySelector("[data-fname]"); if (nm) w.name = nm.value.trim().slice(0, 60);
    var sg = sh.querySelector("[data-sg]"); if (sg) w.sg = +sg.value > 0 ? +sg.value : null;
    sh.querySelectorAll("[data-nk]").forEach(function (inp) { var k = inp.getAttribute("data-nk"), v = inp.value.trim(); if (v === "") delete vals[k]; else if (isFinite(+v) && +v >= 0) vals[k] = +v; });
  }
  function paint() {
    var d = dd.getData(), used = c && ikFoodUsed(d, c.id), day = IK_UI.day || ikToday(), isSupp = w.kind === "supplement";
    var chip = function (attr, val, on, label) { return '<button class="ik-chip" ' + attr + '="' + val + '" aria-pressed="' + on + '">' + label + "</button>"; };
    var more = IK_N.filter(function (n) { return IK_FE_MAIN.indexOf(n.k) < 0 && n.k !== "water"; }), lastG = "";
    var moreFilled = more.some(function (n) { return vals[n.k] != null; });
    var h = '<div class="ik-sheettop"><h2>' + (c ? "Edit " + ikEsc(c.name) : opts.swap ? "My own numbers" : "My own food or supplement") + '</h2><button class="ik-x" data-close aria-label="Close">✕</button></div>' +
      '<label class="ik-label" style="margin-top:0">Name</label><input class="ik-input" data-fname maxlength="60" placeholder="e.g. Psyllium husk fibre" value="' + ikEsc(w.name) + '">' +
      '<div class="ik-label">It\'s a</div><div class="ik-chips">' + chip("data-kind", "food", w.kind === "food", "🍽️ Food") + chip("data-kind", "drink", w.kind === "drink", "🥤 Drink") + chip("data-kind", "supplement", isSupp, "💊 Supplement") + "</div>" +
      '<div class="ik-label">The numbers are for</div><div class="ik-chips">' + chip("data-basis", "serving", basis === "serving", "One serving") + chip("data-basis", "100", basis === "100", "100 g (or 100 mL)") + "</div>" +
      (basis === "serving" ? '<label class="ik-label">One serving weighs (g or mL, optional)</label><input class="ik-input" type="number" inputmode="decimal" min="0" step="any" data-sg value="' + (w.sg || "") + '" placeholder="e.g. 6" style="max-width:160px">' : "") +
      '<p class="ik-small" style="margin:10px 0 4px">' + (isSupp ? "Copy the numbers from the label for one serving (one capsule, one scoop, one teaspoon). " : "Copy them from the Nutrition Facts label, or type what you know. ") + "Leave a box empty if it isn't in it.</p>" +
      '<div class="ik-card" style="padding:8px 14px">' + IK_FE_MAIN.map(field).join("") + "</div>" +
      '<details class="ik-card ik-more"' + (moreFilled ? " open" : "") + '><summary>More: vitamins, minerals and other fats</summary>' +
        more.map(function (n) { var hd = n.g !== lastG ? '<div class="ik-ngroup" style="margin:10px 0 0">' + ikEsc(n.g) + "</div>" : ""; lastG = n.g; return hd + field(n.k); }).join("") + "</details>" +
      (used ? '<p class="ik-small">Saving changes the numbers on every day you\'ve had ' + ikEsc(c.name) + ".</p>" : "") +
      '<div class="dd-status" data-st></div>' +
      (opts.swap ? '<button class="ik-btn wide" data-save="swap">Save and use these numbers</button><p class="ik-small" style="text-align:center">It\'s saved under My foods for next time, and this meal counts it.</p>'
        : (c ? '<button class="ik-btn wide" data-save="1">Save</button>' : "") +
          '<button class="ik-btn' + (c ? " ghost" : "") + ' wide" data-save="add" style="margin-top:8px">Save and add 1 ' + (basis === "serving" ? "serving" : "× 100 g") + " to " + ikEsc(day === ikToday() ? "today" : ikDayName(day)) + "</button>" +
          (!c ? '<button class="ik-btn ghost wide" data-save="1" style="margin-top:8px">Just save it</button>' : "")) +
      (c && !used ? '<button class="ik-link" data-delfood style="color:var(--ik-high);display:block;margin:10px auto 0">Delete this food</button>' : "") +
      '<p class="ik-small" style="text-align:center">You can also tell ' + ikEsc(name) + ", like \"my psyllium has 5 g fibre a teaspoon\".</p>";
    sh.innerHTML = h;
    var q = function (x) { return sh.querySelector(x); };
    q("[data-close]").addEventListener("click", dd.ui.closeSheet);
    sh.querySelectorAll("[data-kind]").forEach(function (b) { b.addEventListener("click", function () { collect(); w.kind = b.getAttribute("data-kind"); paint(); }); });
    sh.querySelectorAll("[data-basis]").forEach(function (b) { b.addEventListener("click", function () { collect(); basis = b.getAttribute("data-basis"); paint(); }); });
    sh.querySelectorAll("[data-save]").forEach(function (b) { b.addEventListener("click", function () { save(b.getAttribute("data-save")); }); });
    var df = q("[data-delfood]"); if (df) df.addEventListener("click", function () {
      dd.update(function (dt) { dt.customFoods = dt.customFoods.filter(function (x) { return x.id !== c.id; }); });
      saved = true; dd.ui.closeSheet(); dd.ui.toast("Deleted."); if (opts.onDone) setTimeout(opts.onDone, 0);
    });
    if (!w.name && !dd.env.isPhone) q("[data-fname]").focus();
  }
  function save(how) {
    collect();
    var st = sh.querySelector("[data-st]");
    if (!w.name) { dd.ui.status(st, "warn", "Give it a name first."); return; }
    if (!Object.keys(vals).length) { dd.ui.status(st, "warn", "Type at least one number, like the fibre."); return; }
    var per = {}; IK_N.forEach(function (n) { per[n.k] = vals[n.k] != null ? vals[n.k] : null; });
    var food = { id: c ? c.id : dd.ui.uid("c"), name: w.name, kind: w.kind, src: c && c.src === "label" ? "label" : "mine", used: new Date().toISOString() };
    if (basis === "serving") { food.perServing = per; food.servingG = w.sg; } else food.per100 = per;
    var day = IK_UI.day || ikToday(), t = day === ikToday() ? ikNowTime() : "12:00", added = null;
    dd.update(function (dt) {
      if (c) dt.customFoods = dt.customFoods.map(function (x) { return x.id === c.id ? food : x; }); else dt.customFoods.push(food);
      if (how === "swap" && opts.swap) dt.entries.forEach(function (e) {
        if (e.id !== opts.swap.entry || !e.items[opts.swap.index]) return;
        var it = e.items[opts.swap.index], g = it.g, n = it.n;
        var next = { ref: "c:" + food.id, name: food.name };
        if (basis === "serving") next.n = n != null ? n : (g && food.servingG ? +(g / food.servingG).toFixed(2) : 1);
        else next.g = g != null ? g : (n != null ? n * (food.servingG || 100) : 100);
        e.items[opts.swap.index] = next;
      });
      if (how === "add") {
        added = { id: dd.ui.uid("e"), day: day, time: t, part: ikPartOf(t), kind: w.kind, name: "", src: "typed",
                  items: [basis === "serving" ? { ref: "c:" + food.id, n: 1, name: food.name } : { ref: "c:" + food.id, g: 100, name: food.name }] };
        dt.entries.push(added);

    });
    saved = true; dd.ui.closeSheet();
    var dn = dd.getData(), v = added ? ikTotals([added], dn).v : null;
    dd.ui.toast(added ? "Added " + food.name + (v.fibre ? ": " + ikNum(v.fibre, 1) + " g fibre" : "") + "." : "Saved " + food.name + ".", 3000);
    if (opts.onDone) setTimeout(opts.onDone, 0);
  }
  paint();
}

/* A recipe or food just used gets a fresh "used" time: recent ones come first, and an example recipe
   the buyer uses becomes theirs (it's no longer untouched, so it isn't cleared with the examples). */
function ikTouch(dt, items) {
  var now = new Date().toISOString();
  (items || []).forEach(function (x) {
    if (/^r:/.test(x.ref)) (dt.recipes || []).forEach(function (r) { if ("r:" + r.id === x.ref) r.used = now; });
    if (/^c:/.test(x.ref)) (dt.customFoods || []).forEach(function (c) { if ("c:" + c.id === x.ref) c.used = now; });
  });
}

/* ---------- one entry: change amounts, time, or remove it ---------- */
function ikOpenEntry(id) {

/* ---------- example data: two weeks, so every screen has something to show ---------- */
function ikExample() {
  var today = ikToday(), entries = [], rnd = function (seed) { var x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); };
  var B = [[["t:yogurt_greek", 175], ["t:blueberries", 75], ["t:granola", 30]], [["t:oatmeal", 250], ["t:banana", 118], ["t:milk_2", 125]], [["t:egg_scrambled", 120], ["t:bread_rye", 54], ["t:butter", 8]], [["t:cheerios", 30], ["t:milk_2", 250], ["t:strawberries", 80]]];
  var L = [[["t:sandwich_ham", 127], ["t:apple", 182]], [["t:soup_chicken_noodle", 260], ["t:crackers", 20]], [["t:chicken_breast", 110], ["t:rice_brown", 150], ["t:broccoli", 90]], [["t:caesar_salad", 200], ["t:chicken_breast", 90]], [["t:sandwich_tuna", 162], ["t:carrots", 61]]];
  var S = [[["t:apple", 182]], [["t:banana", 118], ["t:peanut_butter", 16]], [["t:yogurt_fruit", 175]], [["t:almonds", 28]], [["t:cheddar", 30], ["t:crackers", 20]], [["t:hummus", 60], ["t:carrots", 61]], [["t:granola_bar", 35]]];
  var D = [[["t:salmon", 140], ["t:potato_baked", 173], ["t:green_beans", 100]], [["t:pasta", 220], ["r:ex-r1", 160], ["t:parmesan", 10]], [["t:pork_chop", 120], ["t:mashed", 200], ["t:peas", 80]], [["t:chili", 300], ["t:bread_ww", 36]], [["t:pizza_pepperoni", 220], ["t:salad_mix", 60], ["t:dressing_italian", 15]], [["t:stir_fry", 340], ["t:rice_white", 158]]];
  for (var i = 13; i >= 0; i--) {
    var day = ikAddDays(today, -i), s = i + 1;
    if (i !== 0 && rnd(s * 7) < 0.12) continue;   // a day or two not logged, like real life
    var b = B[Math.floor(rnd(s) * B.length)], l = L[Math.floor(rnd(s * 3) * L.length)], dn = D[Math.floor(rnd(s * 5) * D.length)];
    var mk = function (k, time, kind, set, nm) { entries.push({ id: "ex-" + i + "-" + k, day: day, time: time, part: ikPartOf(time), kind: kind, name: nm || "", items: set.map(function (x) { return { ref: x[0], g: x[1] }; }), src: "example" }); };
    if (i === 0) {
      mk("b", "08:12", "food", B[0], "Greek yogurt, berries & granola");
      mk("l", "13:40", "food", [["t:pasta", 260], ["r:ex-r1", 190], ["t:parmesan", 10]], "Spaghetti with my meat sauce");
      mk("c", "07:45", "drink", [["t:coffee", 375], ["t:cream_18", 15]], "Coffee with cream");
      entries.push({ id: "ex-0-s", day: day, time: "08:15", part: "morning", kind: "supplement", name: "", items: [{ ref: "s:multi", n: 1 }], src: "example" });
      entries.push({ id: "ex-0-w", day: day, time: "11:00", part: "morning", kind: "drink", name: "Water", items: [{ ref: "t:water", g: 750 }], src: "example" });
      continue;
    }
    if (rnd(s * 11) > 0.2) mk("b", "07:" + (10 + Math.floor(rnd(s * 13) * 40)), "food", b);
    mk("l", "12:" + (10 + Math.floor(rnd(s * 17) * 40)), "food", l);
    mk("d", "18:" + (10 + Math.floor(rnd(s * 19) * 40)), "food", dn.map(function (x) { return [x[0], Math.round(x[1] * 1.25)]; }));
    mk("s1", "15:" + (10 + Math.floor(rnd(s * 43) * 40)), "food", S[Math.floor(rnd(s * 47) * S.length)]);
    if (rnd(s * 53) > 0.5) mk("s2", "20:" + (10 + Math.floor(rnd(s * 59) * 40)), "food", S[Math.floor(rnd(s * 61) * S.length)]);
    mk("c", "07:30", "drink", [["t:coffee", 250 + Math.round(rnd(s * 23) * 2) * 125], ["t:cream_18", 15]], "Coffee with cream");
    mk("w", "15:00", "drink", [["t:water", 500 + Math.round(rnd(s * 29) * 4) * 250]], "Water");
    if (rnd(s * 31) > 0.6) mk("x", "20:30", "drink", [["t:wine_red", 150]]);
    if (rnd(s * 37) > 0.7) mk("y", "15:30", "food", [["t:chips", 40]]);
    if (rnd(s * 41) > 0.4) entries.push({ id: "ex-" + i + "-s", day: day, time: "08:00", part: "morning", kind: "supplement", name: "", items: [{ ref: "s:multi", n: 1 }], src: "example" });
  }
  var sauce = { name: "My meat sauce", ingredients: [{ ref: "t:beef_ground_med", g: 450 }, { ref: "t:pasta_sauce", g: 680 }, { ref: "t:onion_cooked", g: 150 }, { ref: "t:mushrooms_cooked", g: 120 }, { ref: "t:olive_oil", g: 15 }, { ref: "t:garlic", g: 9 }] };
  var rec = ikRecipeFrom(sauce.name, sauce.ingredients, { recipes: [], customFoods: [] });
  return {
    settings: { profile: { age: 52, sex: "m", heightCm: 180, weightKg: 86, activity: "sedentary", goal: "maintain" }, units: "metric", hideCalories: false, plateCm: 26 },
    targets: {},
    entries: entries,
    recipes: [{ id: "ex-r1", name: rec.name, per100: rec.per100, totalG: rec.totalG, ingredients: rec.ingredients, plants: rec.plants, used: today, src: "example" }],
    customFoods: []
  };
}

/* ---------- the program ---------- */
function ikValid(d) {
  if (!d || typeof d !== "object") return false;
  if (!d.settings || typeof d.settings !== "object" || Array.isArray(d.settings)) return false;
  if (!d.targets || typeof d.targets !== "object" || Array.isArray(d.targets)) return false;
  var idList = function (a, check) { return Array.isArray(a) && a.every(function (x) { return x && typeof x === "object" && typeof x.id === "string" && (!check || check(x)); }); };
  return idList(d.entries, function (e) { return typeof e.day === "string" && /^\d{4}-\d\d-\d\d$/.test(e.day) && Array.isArray(e.items) && e.items.every(function (i) { return i && typeof i.ref === "string"; }); }) &&
    idList(d.recipes, function (r) { return typeof r.name === "string"; }) && idList(d.customFoods, function (c) { return typeof c.name === "string"; }) &&
    (d.dayFills == null || idList(d.dayFills, function (f) { return typeof f.day === "string" && /^\d{4}-\d\d-\d\d$/.test(f.day); }));   // V4
}

        if (args.what === "fasting" || args.what === "monthly_fast") { st.fasting = Object.assign({}, st.fasting); st.fasting[args.what === "fasting" ? "track" : "monthly"] = on; said.push((args.what === "fasting" ? "fasting tracking" : "the monthly 3-day fast reminder") + (on ? " on" : " off")); }
        else if (args.what === "pregnancy") { st.profile = Object.assign({}, st.profile, { pregnant: on }); said.push("pregnancy " + (on ? "on" : "off")); }
        else if (IK_CONDS.some(function (c) { return c.k === args.what; })) { st.conditions = Object.assign({}, st.conditions); if (on) st.conditions[args.what] = true; else delete st.conditions[args.what]; said.push(args.what + (on ? " on" : " off")); }
        else if (IK_MEDS.some(function (m) { return m.k === args.what; })) { st.meds = Object.assign({}, st.meds); if (on) st.meds[args.what] = true; else delete st.meds[args.what]; said.push(args.what + (on ? " on" : " off")); }
        if (args.gauge && IK_GBY[args.gauge]) { st.hidden = Object.assign({}, st.hidden); if (on) delete st.hidden[args.gauge]; else st.hidden[args.gauge] = true; said.push("the " + IK_GBY[args.gauge].label.toLowerCase() + " gauge " + (on ? "shown" : "hidden")); }
        if (args.fast_hours >= 12 && args.fast_hours <= 24) { st.fasting = Object.assign({}, st.fasting, { goal: args.fast_hours }); said.push("fasting goal " + args.fast_hours + " h"); }
      });
      return said.length ? { ok: true, message: "Done: " + said.join(", ") + ". It's all in menu → Home screen & health." } : { ok: false, message: "Say what to turn on or off." };
    } },
  { name: "save_my_food", description: "Create, or change the numbers of, the person's own food, drink or supplement (for things the table lacks or gets wrong, e.g. psyllium fibre). Numbers are per serving or per 100 g; leave out what isn't in it. Changing a food changes every day it was had.",
    params: { food: { type: "string", description: "To change one of their own foods: its id (c:...) or name. Leave empty to make a new one.", optional: true },
      name: { type: "string", optional: true }, kind: { type: "string", enum: ["food", "drink", "supplement"], optional: true },
      per: { type: "string", enum: ["serving", "100g"], description: "What the numbers are for", optional: true }, serving_g: { type: "number", description: "Weight of one serving in g or mL", optional: true },
      kcal: { type: "number", optional: true }, protein: { type: "number", optional: true }, fibre: { type: "number", optional: true }, carb: { type: "number", optional: true },
      sugar: { type: "number", optional: true }, fat: { type: "number", optional: true }, sat_fat: { type: "number", optional: true }, sodium_mg: { type: "number", optional: true },
      potassium_mg: { type: "number", optional: true }, calcium_mg: { type: "number", optional: true }, iron_mg: { type: "number", optional: true }, magnesium_mg: { type: "number", optional: true },
      vitamin_d_ug: { type: "number", optional: true }, vitamin_c_mg: { type: "number", optional: true }, b12_ug: { type: "number", optional: true }, folate_ug: { type: "number", optional: true },
      caffeine_mg: { type: "number", optional: true },
      add_now: { type: "boolean", description: "Also log it now", optional: true }, servings: { type: "number", description: "How many servings to log (per serving), or grams (per 100 g)", optional: true } },
    run: function (args, ctx) {
      var d = ctx.data, c = null;
      if (args.food) {
        var key = String(args.food).replace(/^c:/, ""), lw = String(args.food).toLowerCase();
        c = d.customFoods.filter(function (x) { return x.id === key; })[0] || d.customFoods.filter(function (x) { return x.name.toLowerCase() === lw; })[0] ||
            d.customFoods.filter(function (x) { return x.name.toLowerCase().indexOf(lw) >= 0; })[0] || null;
        if (!c) return { ok: false, message: "None of their own foods is called '" + args.food + "'. Leave food empty to make a new one." };
      }
      var map = { kcal: "kcal", protein: "protein", fibre: "fibre", carb: "carb", sugar: "sugar", fat: "fat", sat_fat: "sat", sodium_mg: "na", potassium_mg: "k", calcium_mg: "ca", iron_mg: "fe",
                  magnesium_mg: "mg", vitamin_d_ug: "vitD", vitamin_c_mg: "vitC", b12_ug: "b12", folate_ug: "folate", caffeine_mg: "caffeine" };
      var basis = args.per === "100g" ? "100" : args.per === "serving" ? "serving" : c ? (c.perServing ? "serving" : "100") : "serving";
      var old = c ? (c.perServing || c.per100 || {}) : {}, per = {};
      IK_N.forEach(function (n) { per[n.k] = old[n.k] != null ? old[n.k] : null; });
      var setAny = false;
      Object.keys(map).forEach(function (a) { if (args[a] != null && isFinite(+args[a]) && +args[a] >= 0) { per[map[a]] = +args[a]; setAny = true; } });
      if (!c && !setAny) return { ok: false, message: "Give at least one number, like the fibre." };
      var nm = String(args.name || (c ? c.name : "")).trim().slice(0, 60); if (!nm) return { ok: false, message: "Give it a name." };
      var food = { id: c ? c.id : ctx.ui.uid("c"), name: nm, kind: args.kind || (c ? c.kind : "food") || "food", src: "mine", used: new Date().toISOString() };
      if (basis === "serving") { food.perServing = per; food.servingG = args.serving_g > 0 ? args.serving_g : (c && c.servingG) || null; } else food.per100 = per;
      var e = null;
      if (args.add_now) {
        var t = ikNowTime(), amt = Number(args.servings) > 0 ? Number(args.servings) : (basis === "serving" ? 1 : 100);
        e = { id: ctx.ui.uid("e"), day: ikToday(), time: t, part: ikPartOf(t), kind: food.kind, name: "", src: "helper",
              items: [basis === "serving" ? { ref: "c:" + food.id, n: amt, name: nm } : { ref: "c:" + food.id, g: amt, name: nm }] };
      }
      ctx.update(function (dt) {
        if (c) dt.customFoods = dt.customFoods.map(function (x) { return x.id === c.id ? food : x; }); else dt.customFoods.push(food);
        if (e) dt.entries.push(e);
      });
      var shown = Object.keys(map).filter(function (a) { return per[map[a]] != null; }).map(function (a) { return IK_NBY[map[a]].label + " " + per[map[a]] + " " + IK_NBY[map[a]].unit; });
      return { ok: true, message: (c ? "Changed" : "Saved") + " " + nm + " (id c:" + food.id + "), per " + (basis === "serving" ? "serving" + (food.servingG ? " of " + food.servingG + " g" : "") : "100 g") + ": " + shown.join(", ") + "." +
        (c && ikFoodUsed(dd.getData(), c.id) ? " This changes every day they had it." : "") + (e ? " Also logged it now." : "") };
    } },
  { name: "find_food", description: "Search the food table and the person's recipes and foods by words. Returns ids and usual measures.",
    params: { query: { type: "string" } },
    run: function (args, ctx) {
      var hits = ikSearch(args.query, ctx.data, 8);
      return { ok: true, message: hits.length ? hits.map(function (h) { var r = ikResolve(h.ref, ctx.data); return h.ref + " = " + h.label + (r && r.food && r.food.m[0] ? " (" + ikMeasureLabel(r.food.m[0][0]) + " = " + Math.round(r.food.m[0][1]) + " g)" : ""); }).join("\n") : "Nothing matches '" + args.query + "'." };
    } }
];

/* ---------- wiring (once) ---------- */
function ikMount(ctx) {
  var app = ctx.ui.$("ikApp");
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || !app.contains(b)) return;
    var go = b.getAttribute("data-go"); if (go) { if (dd.helper && dd.helper.isOpen && dd.helper.isOpen()) dd.helper.close(); ikGo(go); return; }
    var act = b.getAttribute("data-act");
    if (act === "photo") ikPickPhoto();
    else if (act === "add") ikOpenAdd();
    else if (act === "supp") ikOpenSupps();
    else if (act === "water") ikAddWater(250);
    else if (act === "drinkphoto") ikPickPhoto({ drink: true });
    else if (act === "forgot") ikForgotMeal();
    else if (act === "again") ikOpenAgain();
    else if (act === "profile") ikOpenProfile();
    else if (act === "cooking") ikOpenCooking();
    else if (act === "cookdefault") { dd.update(function (dt) { dt.settings = Object.assign({}, dt.settings, { cooking: Object.assign({}, dt.settings.cooking || {}, { set: true }) }); }); dd.ui.toast("Set: light salt and a little canola oil. Change it any time in menu → How I cook.", 4000); }
    else if (act === "gauges") ikOpenGauges();
    else if (act === "gauge") ikOpenGauge(b.getAttribute("data-k"));
    else if (act === "nutrients") { var det = document.getElementById("ikAllN"); if (det) { det.open = true; IK_UI.openAll = true; det.scrollIntoView({ behavior: "smooth", block: "start" }); } }
    else if (act === "helper") { if (dd.helper.isOpen && dd.helper.isOpen()) dd.helper.close(); else dd.helper.open(); }
    if (act) return;
    var ent = b.getAttribute("data-entry"); if (ent) { ikOpenEntry(ent); return; }
    var ag = b.getAttribute("data-again"); if (ag) { ikAddAgain(ag); return; }
    var fill = b.getAttribute("data-fill"); if (fill) {   // V4: fill days with nothing logged
      var dd1 = dd.getData(), scope = b.getAttribute("data-scope"), list;
      if (scope === "day") list = [IK_UI.day || ikToday()];
      else { var sd = ikSpanDays(IK_UI.span, IK_UI.spanEnd || ikToday()); list = fill === "clear" ? sd.filter(function (x) { return ikFillMap(dd1)[x]; }) : ikGapDays(dd1, sd); }
      ikFillDays(list, fill === "clear" ? null : fill);
      dd.ui.toast(fill === "clear" ? "Cleared." : (list.length === 1 ? "Done: " : list.length + " days ") + (fill === "fast" ? "marked as fasting." : "filled with your average day."), 3000);
      return;
    }
    var dm = b.getAttribute("data-day"); if (dm) { var nd = ikAddDays(IK_UI.day || ikToday(), +dm); if (nd <= ikToday()) { IK_UI.day = nd; ikRender(ikCtx()); } return; }
    var sp = b.getAttribute("data-span"); if (sp) { IK_UI.span = sp; ikRender(ikCtx()); return; }
    var sm = b.getAttribute("data-spanmove"); if (sm) {
      var step = { day: 1, week: 7, month: 30, year: 365 }[IK_UI.span], ne = ikAddDays(IK_UI.spanEnd || ikToday(), step * +sm);
      IK_UI.spanEnd = ne >= ikToday() ? null : ne; ikRender(ikCtx()); return;
    }
    var ch = b.getAttribute("data-chart"); if (ch) { ikOpenChart(ch); return; }
    var ask = b.getAttribute("data-ask");
    if (ask === "tip") { var k = b.getAttribute("data-k"), nt = IK_NBY[k]; dd.helper.ask("Tell me about my " + (nt ? nt.label.toLowerCase() : "numbers") + " lately: why it matters and easy foods to fix it."); }
    else if (ask === "checkin") dd.helper.ask("Explain my weekly check-in in plain words, and give me two easy ideas for this week.");
  });
  app.addEventListener("toggle", function (e) { if (e.target && e.target.id === "ikAllN") IK_UI.openAll = e.target.open; }, true);
  app.addEventListener("mousemove", ikTooltip);
  app.addEventListener("mouseleave", function () { var tt = document.getElementById("ikTT"); if (tt) tt.remove(); });
  dd.on("helper:open", function (on) { app.querySelectorAll('[data-act="helper"]').forEach(function (b) { b.classList.toggle("on", !!on); }); });
  // a new day while the page is open: keep "Today" meaning today
  dd.on("change", function () { IK_MEMO = {}; });
  /* V3: the "since you last ate" and ketosis gauges move with the clock: redraw Today once a minute,
     unless the person is typing or has a sheet open. */
  setInterval(function () {
    if (IK_UI.view !== "today" || document.hidden || (dd.ui.sheetOpen && dd.ui.sheetOpen())) return;
    var a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    var d = dd.getData(); if (!ikShow(d, "lastmeal") && !ikShow(d, "ketosis") && !ikShow(d, "monthfast")) return;
    var y = window.scrollY; ikRender(ikCtx()); window.scrollTo(0, y);
  }, 60000);
  var lastDay = ikToday();
  setInterval(function () { var t = ikToday(); if (t !== lastDay) { if (IK_UI.day === lastDay) IK_UI.day = t; lastDay = t; ikRender(ikCtx()); } }, 60000);
  window.addEventListener("resize", function () { setTimeout(function () { if (dd.ui.measureHostBars) dd.ui.measureHostBars(); }, 120); });
  setTimeout(function () { if (dd.ui.measureHostBars) dd.ui.measureHostBars(); }, 200);
}

</script>
<script>
dd.start(typeof DD_PROGRAM !== "undefined" ? DD_PROGRAM : null);
</script>
