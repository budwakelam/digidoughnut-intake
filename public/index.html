<!DOCTYPE html>
<!--
  Intake 0.3.0 (working name, was ByteBot) · a DigiDoughnut app · built 2026-10-13
  An AI food tracker: snap a photo, the AI names the foods and guesses the grams, and code works out
  every nutrient from the Canadian Nutrient File (Health Canada). Tracks day, week, month and year
  against the buyer's own targets, with plain advice.
  Built on the DigiDoughnut Platform starter 0.1.0 (from Price Pilot 0.5.0, 2026-10-09).
  Platform changes in this file (approved by Oran 2026-10-13), each marked "PLATFORM CHANGE (2026-10-13)":
    1. dd.ai: photos in a message (image parts), plus chat options forceTool, once, hedge:false.
    2. dd.files: photos read as images and shrunk on the device (about 1024 px).
    3. dd.helper: place "tab" (the app's own tab bar), dd.helper.say(), photos with one message;
       dd.ui: the app's own bottom bar (data-dd-appbar) is cleared by toasts and the helper.
  0.2.0 (V2 handoff, Oran's iPhone test 2026-10-13), each also marked "PLATFORM CHANGE (2026-10-13 …)":
    4. dd.setup: Firebase guide says Product categories → Security → Authentication; the npm / script tag
       choice is explained inside the Add Firebase SDK step; the sync wizard's Send to my phone opens the
       same screen as Settings, and an iPhone note on that screen (open in Safari, then Home Screen).
    5. dd.agent: copying the agent instructions saves straight away; other devices tick step 5 too.
    6. dd.ai: tier "fast" (Flash-Lite first, plain chat) and "full" (Flash first, photos).
    7. dd.helper: dictation is stopped and forgotten when the app goes to the background.
    8. dd.brand: brandPlace "bar" puts the tagline, banner picture and 🎨 in the top bar instead of a banner card.
  0.4.0 (V4 handoff, Oran 2026-10-13): the microphone only ever starts from a real tap (counted in the support
  report, with a one-time iPhone tip about Safari's per-site setting), and sending stops dictation so the box clears.
  Menu → How I cook: salt per food group (heavy / light / low-salt) and cooking oil (type, light / heavy); the photo
  screen and Add by typing ask how a food was cooked and add the oil as its own line. Busy photos (several plates or
  lots of foods) get a "try one plate at a time" nudge instead of a bare error. Past days with nothing logged can be
  marked as fasting or filled with the person's average day (Today on that day, or Trends), so trends stay honest.
  ✏️ My own food or supplement: type exactly what's in it (per serving or per 100 g, any nutrient), from Add by typing,
  Supplement, My recipes & foods, or "Use my own numbers" on any food in a meal. Editing one fixes every day it was had.
  ⚡ Add again: one-tap chips on Today for the things you have most, and a list with Most often / Recent tabs.
  Platform change, marked "PLATFORM CHANGE (2026-10-13 V4)": dd.helper dictation (above).
  0.3.0 (V3 handoff, Oran 2026-10-13): the home screen as an instrument cluster. Menu → Home screen & health turns
  on fasting tracking, a 3-day fast reminder, health conditions and medicines (each adds its own gauges and food
  flags) and hides any gauge. New everyday gauges: time since you last ate, meal balance, blood sugar load.
  Platform change, marked "PLATFORM CHANGE (2026-10-13 V3)":
    9. dd.setup / dd.pair: iPhone Home Screen steps say to leave "Open as Web App" off, and a copy opened as a
       separate web app explains how to fix it.
  To make a new app, change only the parts marked PROGRAM-SPECIFIC (styles, markup, script)
  and the app name in the <head>.
-->

<style>
/* ===== DigiDoughnut Platform · dd.ui.css =====
   The shared look, taken from Profit Coach's clean card UI. Every program uses these tokens;
   programs set only --dd-brand (via DD_PROGRAM.accent) and their own layout. */
:root{
  --dd-bg:#f6f8fc; --dd-card:#fff; --dd-ink:#1e2430; --dd-muted:#6b7280; --dd-line:#e5e7eb;
  --dd-brand:#2563eb; --dd-brand-d:#1d4ed8; --dd-brand-soft:#eef2ff; --dd-brand-soft-d:#e0e7ff;
  --dd-ok:#15803d; --dd-okbg:#f0fdf4; --dd-okline:#bbf7d0;
  --dd-bad:#b91c1c; --dd-badbg:#fef2f2; --dd-badline:#fecaca;
  --dd-warn:#b45309; --dd-warnbg:#fffbeb; --dd-warnline:#fde68a;
  --dd-radius:14px; --dd-shadow:0 1px 3px rgba(16,24,40,.08);
  --dd-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--dd-font);background:var(--dd-bg);color:var(--dd-ink);line-height:1.55;
     padding:0 0 env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}

/* header */
.dd-top{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,var(--dd-brand),var(--dd-accent2));color:#fff;border-bottom:none;
        padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.dd-top h1{color:#fff}
.dd-top .dd-menu-btn{color:#fff}
.dd-top .dd-menu-btn:hover,.dd-top .dd-menu-btn:focus-visible{background:rgba(255,255,255,.16);border-color:transparent}
.dd-top .dd-menu-ico,.dd-top .dd-menu-name{color:#fff}
.dd-top .dd-menu-caret{color:rgba(255,255,255,.7)}
.dd-top h1{font-size:1.15rem;margin:0;line-height:1.2}
.dd-top .dd-tag{font-size:.8rem;color:var(--dd-muted)}
.dd-top .dd-spacer{flex:1}
.dd-top .dd-slot{display:flex;gap:6px;align-items:center}

/* layout + cards */
.dd-wrap{max-width:760px;margin:0 auto;padding:20px 16px}
.dd-card{background:var(--dd-card);border-radius:var(--dd-radius);padding:18px;margin:0 0 14px;box-shadow:var(--dd-shadow)}
.dd-card h2{font-size:1.02rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.dd-note{font-size:.85rem;color:var(--dd-muted)}

/* buttons */
.dd-btn{background:var(--dd-brand);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:.95rem;
        font-weight:600;cursor:pointer;font-family:inherit;min-height:44px}
.dd-btn:hover{background:var(--dd-brand-d)} .dd-btn:disabled{opacity:.55;cursor:default}
.dd-btn.ghost{background:var(--dd-brand-soft);color:var(--dd-brand)} .dd-btn.ghost:hover{background:var(--dd-brand-soft-d)}
.dd-btn.danger{background:var(--dd-bad)}
.dd-btn.small{padding:6px 12px;min-height:34px;font-size:.85rem}
.dd-linkbtn{background:none;border:none;color:var(--dd-brand);font-size:.88rem;cursor:pointer;padding:6px 8px;font-family:inherit}
.dd-btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.dd-input{padding:10px 12px;font-size:1rem;border:2px solid var(--dd-line);border-radius:10px;width:100%;font-family:inherit;background:#fff;color:var(--dd-ink)}
.dd-input:focus{outline:none;border-color:var(--dd-brand)}
:focus-visible{outline:3px solid var(--dd-brand);outline-offset:2px}

/* status boxes: every message to the buyer goes through one of these */
.dd-status{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:.92rem;display:none}
.dd-status.show{display:block}
.dd-status.ok{background:var(--dd-okbg);color:var(--dd-ok);border:1px solid var(--dd-okline)}
.dd-status.err{background:var(--dd-badbg);color:var(--dd-bad);border:1px solid var(--dd-badline)}
.dd-status.warn{background:var(--dd-warnbg);color:var(--dd-warn);border:1px solid var(--dd-warnline)}
.dd-status.info{background:var(--dd-brand-soft);color:var(--dd-ink);border:1px solid var(--dd-brand-soft-d)}

/* notices (top-of-page banners, e.g. "these are example numbers") */
.dd-notice{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--dd-brand-soft);border:1px solid var(--dd-brand-soft-d);
           border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:.92rem}
.dd-notice.warn{background:var(--dd-warnbg);border-color:var(--dd-warnline);color:var(--dd-warn)}
.dd-notice .dd-notice-text{flex:1 1 240px}
.dd-notice .dd-btnrow{margin:0}

/* sheets (modal dialogs) */
.dd-overlay{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.dd-overlay-dark{background:rgba(8,10,16,.85)}
.dd-sheet{background:#fff;border-radius:18px;max-width:520px;width:100%;padding:24px;max-height:92vh;overflow:auto}
.dd-sheet h2{margin:0 0 8px;font-size:1.25rem}
.dd-sheet pre{white-space:pre-wrap;word-break:break-word;font-size:.78rem;background:#f8fafc;border:1px solid var(--dd-line);
              border-radius:10px;padding:10px;max-height:50vh;overflow:auto;margin:8px 0 0}
@media (max-width:520px){ .dd-overlay{align-items:flex-end;padding:0} .dd-sheet{border-radius:18px 18px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom))} }

/* phone pairing QR */
.dd-qr{display:flex;justify-content:center;background:#fff;border:2px solid var(--dd-line);border-radius:12px;padding:8px;margin:6px 0}
.dd-qr svg{display:block;max-width:100%;height:auto}
.dd-qr-timer{text-align:center;font-size:.85rem;color:var(--dd-muted);margin:4px 0 10px}
.dd-qr-expired{padding:40px 10px;text-align:center}
.dd-qr-inline{margin:0;padding:10px}
.dd-qr-inline .dd-qr-expired{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dd-muted)}
.dd-qr-file{margin:0 0 10px}
.dd-check{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;margin:6px 0}
.dd-check input{width:20px;height:20px;margin-top:2px;accent-color:var(--dd-brand)}

/* toast */
.dd-toast{pointer-events:none;position:fixed;left:50%;bottom:calc(24px + var(--dd-host-bottom,0px) + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--dd-ink);color:#fff;
          padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100vw - 32px)}

/* footer: brand line + version; triple-click opens the support diagnostic */
.dd-footer{margin:44px 0 0;color:var(--dd-muted);font-size:.75rem;user-select:none;-webkit-user-select:none}
.dd-foot-body{background:var(--dd-brand-soft);padding:0 0 calc(129px + var(--dd-host-bottom,0px) + env(safe-area-inset-bottom));border-top:8px solid var(--dd-brand);box-shadow:0 -8px 28px var(--dd-brand-soft-d)}
.dd-foot-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px 16px;padding:22px 16px 0}
.dd-foot-left{justify-self:start;color:var(--dd-ink);font-weight:600;white-space:nowrap}
.dd-foot-left .dd-foot-ver{font-weight:400;color:var(--dd-muted)}
.dd-foot-mid{justify-self:center;line-height:0}
.dd-foot-right{justify-self:end;text-align:right;line-height:1.9}
.dd-foot-note{white-space:nowrap}
.dd-footer .dd-foot-link{font-size:inherit;padding:0 2px;text-decoration:underline;color:var(--dd-muted);white-space:nowrap}
@media (max-width:640px){.dd-foot-grid{grid-template-columns:1fr;justify-items:center;text-align:center}
.dd-foot-left,.dd-foot-mid,.dd-foot-right{justify-self:center;text-align:center}
.dd-foot-note{white-space:normal}}
.dd-foot-logo{height:54px;width:auto;vertical-align:middle}

/* ===== Setup Center (dd.setup): steps list + wizard (the home-page card is gone, Oran 2026-10-08) ===== */
.dd-steps{list-style:none;margin:0;padding:0}
.dd-step{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--dd-line)}
.dd-step:first-child{border-top:none}
.dd-tick{flex:0 0 30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;
         background:#f3f4f6;color:var(--dd-muted)}
.dd-step.done .dd-tick{background:var(--dd-okbg);color:var(--dd-ok);border:1px solid var(--dd-okline)}
.dd-step-text{flex:1;min-width:0;display:flex;flex-direction:column}
.dd-step-text span{font-size:.85rem;color:var(--dd-muted)}
.dd-step.done .dd-step-text b{color:var(--dd-muted)}

/* the wizard (a sheet with class dd-wiz) */
.dd-wiz-top{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--dd-muted);margin:0 0 8px}
.dd-wiz-name{font-weight:700;color:var(--dd-brand)}
.dd-wiz-dots{display:flex;gap:6px;margin:0 0 16px}
.dd-wiz-dots i{flex:1;height:6px;border-radius:99px;background:var(--dd-line)}
.dd-wiz-dots i.done{background:var(--dd-ok)} .dd-wiz-dots i.now{background:var(--dd-brand)}
.dd-wiz h2{font-size:1.3rem}
.dd-wiz-body{font-size:1rem}
.dd-wiz-body p{margin:0 0 12px}
.dd-wiz-body ul{margin:0 0 12px;padding-left:20px}
.dd-wiz-body .dd-input{margin:4px 0 6px;font-size:1.05rem}
.dd-facts{list-style:none;padding:0 !important;font-weight:600;color:var(--dd-ok)}
.dd-big-tick{font-size:3rem;text-align:center;color:var(--dd-ok);margin:0 0 6px !important;line-height:1}
.dd-wiz-big{width:100%;min-height:52px;font-size:1.05rem}
.dd-wiz-nav{display:flex;gap:10px;margin-top:16px}
.dd-wiz-nav .dd-btn{flex:1;min-height:48px}
.dd-wiz-help{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px;margin-top:12px;border-top:1px solid var(--dd-line);padding-top:8px}
.dd-wiz-stuck,.dd-wiz-ask{margin-top:10px;background:#f8fafc;border:1px solid var(--dd-line);border-radius:12px;padding:12px;font-size:.92rem}
.dd-wiz-stuck ul{margin:6px 0;padding-left:20px}
.dd-ask-msgs{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto;margin:0 0 8px}
.dd-ask-msg{max-width:88%;padding:8px 11px;border-radius:12px;font-size:.92rem}
.dd-ask-msg.me{align-self:flex-end;background:var(--dd-brand);color:#fff}
.dd-ask-msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--dd-line)}
.dd-ask-msg.live{border-color:var(--dd-brand-soft-d)}
.dd-ask-msg.pending{color:var(--dd-muted);font-style:italic}
.dd-ask-row{display:flex;gap:8px}
.dd-ask-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dd-chip{background:#fff;border:1px solid var(--dd-brand-soft-d);color:var(--dd-brand);border-radius:99px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;min-height:36px}
@media (max-width:520px){ .dd-wiz h2{font-size:1.2rem} .dd-step{align-items:flex-start} }
.dd-filename{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--dd-brand-soft);border-radius:8px;padding:8px 10px;word-break:break-all;font-size:.92rem}
.dd-home-steps{padding-left:22px;margin:8px 0 12px} .dd-home-steps li{margin:0 0 8px}
.dd-choice{display:flex;flex-direction:column;gap:10px;margin:4px 0 12px}
.dd-choice-btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;background:#fff;border:2px solid var(--dd-line);border-radius:12px;
               padding:12px 14px;font:inherit;cursor:pointer;min-height:56px;color:var(--dd-ink)}
.dd-choice-btn:first-child{border-color:var(--dd-brand)}
.dd-choice-btn:hover{background:var(--dd-brand-soft)}
.dd-choice-btn b{font-size:1.05rem;color:var(--dd-brand)} .dd-choice-btn span{font-size:.88rem;color:var(--dd-muted)}
.dd-copyrow{display:flex;gap:8px;align-items:center;margin:6px 0} .dd-copyrow .dd-filename{flex:1;margin:0}

/* ===== wizard extras: close button, nudge, "Your turn", pictures ===== */
.dd-wiz{position:relative}
.dd-wiz-x{position:sticky;top:0;float:right;margin:-10px -10px 0 8px;z-index:3;width:40px;height:40px;border-radius:50%;border:none;background:#f3f4f6;
          color:var(--dd-muted);font-size:1.05rem;cursor:pointer;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.dd-wiz-x:hover{background:var(--dd-line);color:var(--dd-ink)}
.dd-wiz .dd-wiz-top{padding-right:4px}
.dd-nudge{animation:dd-shake .45s}
@keyframes dd-shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.dd-todo{background:#fef9c3;border:2px solid #fde047;border-radius:12px;padding:10px 12px;font-size:1.02rem;margin:0 0 12px}

.dd-pic{margin:2px 0 12px;border-radius:16px;padding:14px;background:linear-gradient(135deg,#fef3c7,#fce7f3 55%,#e0f2fe);overflow:hidden;
        font-size:.85rem;color:#1f2937;user-select:none;-webkit-user-select:none}
.dd-pic-frame{background:#fff;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.12);overflow:hidden;flex:1;min-width:0}
.dd-pic-bar{display:flex;align-items:center;gap:5px;background:#e5e7eb;padding:6px 8px}
.dd-pic-bar i{width:8px;height:8px;border-radius:50%;background:#f87171}.dd-pic-bar i:nth-child(2){background:#fbbf24}.dd-pic-bar i:nth-child(3){background:#34d399}
.dd-pic-bar span{margin-left:6px;background:#fff;border-radius:99px;padding:1px 10px;font-size:.75rem;color:#6b7280;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-pic-page{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.dd-pic-row{display:flex;flex-direction:column;gap:3px}
.dd-pic-inline{flex-direction:row;align-items:center;gap:8px;flex-wrap:wrap}
.dd-pic-end{align-items:flex-end;margin-top:2px}
.dd-pic-label{font-weight:600;font-size:.78rem;color:#374151}
.dd-pic-input{border:2px solid #d1d5db;border-radius:7px;padding:4px 7px;min-height:28px;background:#fff;display:flex;align-items:center}
.dd-pic-typed{display:inline-block;overflow:hidden;white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace;width:0;border-right:2px solid #2563eb;
              animation:dd-type calc(var(--n) * .07s) steps(var(--n)) var(--d) forwards,dd-caret .8s step-end infinite}
@keyframes dd-type{to{width:calc(var(--n) * 1ch + 2px)}}
@keyframes dd-caret{50%{border-color:transparent}}
.dd-pic-lines{display:flex;flex-direction:column;gap:6px}.dd-pic-lines i{height:8px;border-radius:4px;background:#e5e7eb;width:90%}.dd-pic-lines i:nth-child(2){width:70%}.dd-pic-lines i:nth-child(3){width:50%}
.dd-pic-target{position:relative;display:inline-block}
.dd-pic-btn{display:inline-block;background:#16a34a;color:#fff;font-weight:700;border-radius:8px;padding:6px 12px;white-space:nowrap;
            animation:dd-press 2s var(--d) infinite both}
.dd-pic-hand{position:absolute;right:-16px;bottom:-24px;font-size:26px;animation:dd-hand 2s var(--d) infinite both;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
@keyframes dd-hand{0%{opacity:0;transform:translate(26px,26px)}30%{opacity:1;transform:translate(0,0)}40%{transform:translate(0,0) scale(.82)}55%{transform:translate(0,0) scale(1)}85%{opacity:1}100%{opacity:0}}
@keyframes dd-press{0%,36%{transform:scale(1);box-shadow:0 0 0 0 rgba(22,163,74,.55)}42%{transform:scale(.93)}65%{box-shadow:0 0 0 12px rgba(22,163,74,0)}100%{transform:scale(1)}}
.dd-pic-toggle{width:40px;height:22px;border-radius:99px;background:#d1d5db;position:relative;animation:dd-on .3s var(--d) forwards}
.dd-pic-toggle i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;animation:dd-knob .3s var(--d) forwards}
@keyframes dd-on{to{background:#16a34a}}@keyframes dd-knob{to{transform:translateX(18px)}}
.dd-pic-check{width:22px;height:22px;border:2px solid #9ca3af;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:transparent;font-weight:900;
              animation:dd-tick .3s var(--d) forwards}
@keyframes dd-tick{to{background:#2563eb;border-color:#2563eb;color:#fff}}
.dd-pic-select{border:2px solid #d1d5db;border-radius:7px;padding:4px 8px;align-self:flex-start;animation:dd-flash .6s var(--d) both}
@keyframes dd-flash{0%{background:#fff}50%{background:#fde68a;border-color:#f59e0b}100%{background:#fff;border-color:#16a34a}}
.dd-pic-menu{position:relative;align-self:flex-start;border:2px solid #d1d5db;border-radius:7px;padding:4px 8px;font-weight:600}
.dd-pic-menuitem{position:absolute;left:0;top:calc(100% + 4px);background:#fff;border:2px solid #2563eb;border-radius:7px;padding:4px 8px;white-space:nowrap;
                 box-shadow:0 4px 10px rgba(0,0,0,.15);opacity:0;animation:dd-show .3s var(--d) forwards;z-index:2}
@keyframes dd-show{to{opacity:1}}
.dd-pic-file{align-self:flex-start;background:#eef2ff;border-radius:7px;padding:4px 8px;font-weight:600;opacity:0;animation:dd-slide .6s var(--d) forwards;margin-top:24px}
@keyframes dd-slide{from{opacity:0;transform:translate(-30px,14px) rotate(-8deg)}to{opacity:1;transform:none}}
.dd-pic-code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f3f4f6;border-radius:6px;padding:4px 8px}

.dd-orb{position:relative;display:inline-block;width:1.4em;height:1.4em;flex:none;border-radius:50%;
  -webkit-mask:radial-gradient(circle,transparent 0 35%,#000 37%);
  mask:radial-gradient(circle,transparent 0 35%,#000 37%);

  animation:dd-orb-float 6s ease-in-out infinite}

  background:

    conic-gradient(from 20deg,var(--dd-brand),var(--dd-accent2),var(--dd-brand));
  animation:dd-orb-spin 9s linear infinite}
.dd-orb-spark{position:absolute;inset:0;animation:dd-orb-spin 5s linear infinite reverse}
.dd-orb-spark::before{content:"";position:absolute;top:2%;left:50%;width:.24em;height:.24em;margin-left:-.12em;border-radius:50%;
  background:#fff;box-shadow:0 0 .32em .12em rgba(255,255,255,.9)}
@keyframes dd-orb-spin{to{transform:rotate(360deg)}}
@keyframes dd-orb-float{0%,100%{transform:translateY(-.07em)}50%{transform:translateY(.07em)}}

.dd-menu-item:hover .dd-menu-item-go,.dd-menu-item:focus-visible .dd-menu-item-go{color:var(--dd-brand)}
/* bottom trio: the template's own items (Settings, Help, About) — three across, distinct from the app cards */
.dd-menu-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.dd-menu-trio-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;background:var(--dd-brand-soft);border:1px solid var(--dd-line);border-radius:12px;cursor:pointer;color:var(--dd-ink);font:inherit}
.dd-menu-trio-item:hover,.dd-menu-trio-item:focus-visible{background:#fff;border-color:var(--dd-brand-soft-d)}
.dd-menu-trio-ico{font-size:1.4rem;line-height:1}
.dd-menu-trio-label{font-size:.78rem;font-weight:600;text-align:center}
.dd-menu-trio-dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:#ef4444}   /* red, like the menu dot: "needs attention" */

/* ===== where it lives / move (Phase 7.2, 7.3) ===== */
.dd-choice-btn.dd-choice-rec{border-color:var(--dd-brand);background:var(--dd-brand-soft)}
.dd-choice-btn.picked{border-color:var(--dd-brand);box-shadow:0 0 0 3px var(--dd-brand-soft-d)}
.dd-move-detail{border:1px solid var(--dd-line);border-radius:12px;padding:12px 14px;margin:0 0 10px;background:#fafbff}

.dd-status .dd-btnrow{margin-top:8px}
.dd-step-btns{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}

/* ===== Where it lives: every place as a card (Oran, 2026-10-07) ===== */
.dd-sheet.dd-sheet-wide{max-width:640px}
.dd-place{border:2px solid var(--dd-line);border-radius:14px;padding:14px 16px;margin:0 0 12px;background:#fff}
.dd-place.here{border-color:var(--dd-ok);background:var(--dd-okbg);box-shadow:0 0 0 3px var(--dd-okline)}
.dd-place-top{display:flex;align-items:center;gap:10px}
.dd-place-ico{font-size:1.6rem;line-height:1;width:34px;text-align:center;flex:none}
.dd-place-title{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.dd-place-name{font-size:1.05rem}
.dd-place-here,.dd-place-tag{font-style:normal;font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px}
.dd-place-here{background:var(--dd-ok);color:#fff}
.dd-place-tag{background:var(--dd-brand-soft);color:var(--dd-brand)}
.dd-place-what{margin:6px 0 8px;font-size:.92rem}
.dd-place-scales{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.8rem;color:var(--dd-muted);margin:0 0 8px}
.dd-scale-text{white-space:nowrap}
.dd-place-pc{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:.86rem}
@media (max-width:520px){.dd-place-pc{grid-template-columns:1fr}}
.dd-pros,.dd-cons{list-style:none;margin:0;padding:0}
.dd-pros li,.dd-cons li{padding-left:22px;position:relative;margin:2px 0}
.dd-pros li::before{content:"✓";position:absolute;left:2px;color:var(--dd-ok);font-weight:700}
.dd-cons li::before{content:"✗";position:absolute;left:2px;color:var(--dd-bad);font-weight:700}
.dd-place-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.dd-place-msg{margin:10px 0 0}
.dd-bring{display:flex;gap:8px;align-items:flex-start;background:var(--dd-brand-soft);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:.92rem}
.dd-bring input{margin-top:4px;width:18px;height:18px;flex:none}
.dd-step-warn{display:inline-block;font-style:normal;font-size:.76rem;font-weight:600;color:var(--dd-warn);background:var(--dd-warnbg);border:1px solid var(--dd-warnline);border-radius:999px;padding:0 8px;margin-left:2px}

/* ===== menu groups (Oran, 2026-10-08) ===== */
.dd-menu-sep{height:1px;background:var(--dd-line);margin:10px 4px}
.dd-menu-back{padding:4px 0;margin:-6px 0 4px;font-weight:600}
@media print{.dd-top,.dd-footer,#dd-setup,#dd-notices,#dd-helper-home,#dd-helper-fab,.dd-btnrow,.demo-actions{display:none !important}}

/* dd.files: "Add a file" drop areas (first product, 2026-10-08) */
.dd-drop{border:2px dashed var(--dd-brand);border-radius:var(--dd-radius);background:var(--dd-brand-soft);padding:22px 14px;
         display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin:6px 0 10px}
.dd-drop span{color:var(--dd-muted);font-size:.9rem}
.dd-drop-big{font-size:2rem;line-height:1}
.dd-drop-over{background:var(--dd-brand-soft-d);outline:3px solid var(--dd-brand);outline-offset:2px}
.dd-drop-how{font-size:.9rem}
.dd-drop-how ol{padding-left:20px;margin:6px 0}
.dd-helper-clip{padding:0 12px;min-width:44px;font-size:1.1rem}

/* ===== the look (dd.brand): banner, colours, footer logo — 2026-10-08 ===== */
:root{--dd-accent2:#f59e0b;--dd-accent-raw:var(--dd-brand)}
.dd-top.dd-top-hero{border-bottom:0;box-shadow:0 1px 0 var(--dd-line)}
/* (removed: the gradient underline — the whole bar is the gradient now) */
.dd-top.dd-top-hero .dd-tag{display:none}
/* brandPlace "bar" (2026-10-13): tagline under the name, optional banner picture, 🎨 button */
.dd-top.dd-top-bar .dd-tag{color:rgba(255,255,255,.88);font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 0 2px;max-width:100%}
.dd-top.dd-top-bar .dd-tag[hidden]{display:none}
.dd-top.dd-top-img{background:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,.38)),var(--dd-top-img) center / cover no-repeat,linear-gradient(120deg,var(--dd-brand),var(--dd-accent2))}
.dd-top-look{width:36px;height:36px;flex:none;border:0;border-radius:50%;background:rgba(255,255,255,.2);font-size:1.05rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.dd-top-look:hover{background:rgba(255,255,255,.32)}
.dd-brand-topprev{border-radius:14px;overflow:hidden;margin:4px 0 8px;pointer-events:none}
.dd-brand-topprev .dd-top{position:static}
.dd-top-icon{font-size:1.35rem;line-height:1;display:inline-flex;align-items:center;flex:none}
#dd-hero[hidden]{display:none}
.dd-hero{position:relative;overflow:hidden;border-radius:20px;margin:6px 0 16px;min-height:150px;display:flex;align-items:flex-end;
  color:#fff;box-shadow:0 10px 30px -12px var(--dd-accent-raw),0 2px 6px rgba(16,24,40,.08);isolation:isolate}
.dd-hero-plain{background:var(--dd-hero-sprinkles),
  radial-gradient(120% 140% at 0% 0%,var(--dd-accent-raw) 0%,transparent 60%),
  radial-gradient(120% 140% at 100% 100%,var(--dd-accent2) 0%,transparent 55%),
  linear-gradient(120deg,var(--dd-accent-raw),var(--dd-accent2));background-size:128px 136px,auto,auto,auto}
.dd-hero-blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.28;z-index:-1;background:#fff}
.dd-hero-blob.a{width:220px;height:220px;right:-50px;top:-90px}
.dd-hero-blob.b{width:120px;height:120px;right:150px;bottom:-70px;opacity:.18}
.dd-hero-img{background:#111 var(--dd-hero-img) center / cover no-repeat;min-height:clamp(120px,22vw,220px)}
.dd-hero-img::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.55) 100%)}
.dd-hero-img.dd-hero-notext::before{display:none}
.dd-hero-probe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.dd-hero-text{position:relative;z-index:1;display:flex;align-items:center;gap:14px;padding:22px 24px;min-width:0}
.dd-hero-title{font-size:clamp(1.5rem,3.6vw,2.3rem);font-weight:900;line-height:1.05;letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.25);
  overflow-wrap:anywhere}
.dd-hero-sub{font-size:.95rem;font-weight:600;opacity:.95;margin-top:4px;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.dd-hero-mark{width:58px;height:58px;flex:none;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:2rem;
  background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);box-shadow:inset 0 0 0 4px rgba(255,255,255,.1);backdrop-filter:blur(4px)}
.dd-hero-logo{width:64px;height:64px;flex:none;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.25);background:#fff}
.dd-hero-edit{position:absolute;top:12px;right:12px;z-index:2;border:0;border-radius:99px;padding:7px 13px;font:inherit;font-size:.82rem;font-weight:700;
  background:rgba(255,255,255,.9);color:#111827;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);min-height:34px}
.dd-hero-edit:hover{background:#fff}
.dd-hero-editwrap{position:absolute;top:12px;right:12px;z-index:2;display:flex;align-items:center;gap:6px}
.dd-hero-editwrap .dd-hero-edit{position:static}
.dd-hero-x{width:28px;height:28px;flex:none;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:#374151;
  font-size:1.05rem;font-weight:700;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:center;padding:0}
.dd-hero-x:hover{background:#fff}
@media (max-width:520px){ .dd-hero{border-radius:16px;min-height:120px} .dd-hero-text{padding:16px} .dd-hero-mark{width:46px;height:46px;font-size:1.6rem;border-radius:14px}
  .dd-hero-logo{width:50px;height:50px} .dd-hero-sub{font-size:.85rem}
  .dd-hero-text{padding-right:56px} .dd-hero-edit-label,.dd-hero-tag{display:none} .dd-hero-edit{padding:6px 10px;font-size:1rem} }
@media print{ #dd-hero,.dd-hero-edit,.dd-hero-x{display:none !important} }

/* the Look & branding sheet */
.dd-brand-preview .dd-hero{margin:4px 0 6px;min-height:110px}
.dd-brand-preview .dd-hero-title{font-size:1.5rem}
.dd-swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin:6px 0 10px}
.dd-swatch{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--dd-line);background:#fff;border-radius:12px;padding:8px 6px;cursor:pointer;font:inherit;font-size:.76rem;color:var(--dd-ink)}
.dd-swatch i{width:40px;height:40px;border-radius:50%;display:block;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.dd-swatch.on{border-color:var(--dd-brand);box-shadow:0 0 0 3px var(--dd-brand-soft-d)}
.dd-colorrow{display:flex;gap:16px;flex-wrap:wrap}
.dd-colorrow label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem}
.dd-colorrow small{display:block;font-weight:400;color:var(--dd-muted);font-size:.78rem}
.dd-colorrow input[type=color]{width:46px;height:40px;border:1px solid var(--dd-line);border-radius:10px;padding:2px;background:#fff;cursor:pointer}
.dd-brand-field{display:block;margin:0 0 10px}
.dd-brand-field>span{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.dd-brand-field small{font-weight:400;color:var(--dd-muted)}

/* the footer: DigiDoughnut's logo */
/* (retired: the old centered brand footer — now an application status bar, see .dd-footer) */
/* the helper's corner button picks up the two colours */
.dd-helper-fab{background:linear-gradient(135deg,var(--dd-brand),var(--dd-brand-d))}

/* ===== PROGRAM-SPECIFIC styles =====
   Intake (working name): an AI food tracker. Apple-website clean: lots of white space, big bold
   headings, white cards on light grey, bright ring colours. Classes start with "ik-". */
:root{--ik-energy:#ff2d55;--ik-energy-soft:#ffe0e6;--ik-protein:#0a84ff;--ik-protein-soft:#dcecff;--ik-fibre:#30b350;--ik-fibre-soft:#d8f5df;
  --ik-carb:#a05a2c;--ik-carb-soft:#f3e3d6;--ik-fat:#e8890c;--ik-fat-soft:#fdebd2;--ik-sugar:#5856d6;--ik-sugar-soft:#e4e3fa;--ik-sat:#8e6b23;--ik-sat-soft:#f1e8d4;--ik-vit:#ff9f0a;--ik-vit-soft:#fff0d9;--ik-min:#af52de;--ik-min-soft:#f3e5fb;--ik-water:#32ade6;--ik-water-soft:#dff4fb;
  --ik-ink:#1d1d1f;--ik-ink2:#6e6e73;--ik-grey:#f5f5f7;--ik-line:#ececf0;--ik-amber:#a35200;--ik-amberbg:#fff8eb;--ik-amberline:#ffcc80;--ik-high:#c4002f}
body{background:var(--ik-grey)}
.dd-wrap{max-width:1200px}
.ik{color:var(--ik-ink);padding-bottom:12px}
.ik [hidden]{display:none !important}
.ik h1.ik-h1{margin:2px 0 0;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.ik h2.ik-h2{margin:22px 0 10px;font-size:22px;font-weight:800;letter-spacing:-.01em}
.ik-eyebrow{font-size:13px;font-weight:600;color:var(--ik-ink2);text-transform:uppercase;letter-spacing:.04em}
.ik-card{background:#fff;border-radius:22px;padding:18px;margin:0 0 14px}
.ik-muted{color:var(--ik-ink2)}
.ik-small{font-size:13px;color:var(--ik-ink2)}
.ik-row{display:flex;align-items:center;gap:10px}
.ik-grow{flex:1;min-width:0}
.ik-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;background:var(--ik-ink);color:#fff;font:inherit;font-weight:700;
  font-size:16px;min-height:48px;padding:10px 18px;cursor:pointer}
.ik-btn:hover{filter:brightness(1.15)}
.ik-btn.ghost{background:#fff;color:var(--ik-ink);border:1px solid #d2d2d7}
.ik-btn.soft{background:var(--ik-grey);color:var(--ik-ink)}
.ik-btn.wide{width:100%;min-height:54px;font-size:17px}
.ik-btn:disabled{opacity:.5;cursor:default}
.ik-chip{border:0;border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;background:#fff;color:var(--ik-ink);min-height:40px;cursor:pointer;border:1px solid #e5e5ea}
.ik-chip[aria-pressed="true"]{background:var(--ik-ink);color:#fff;border-color:var(--ik-ink)}
.ik-chips{display:flex;gap:8px;flex-wrap:wrap}
.ik-link{background:none;border:0;padding:6px 4px;font:inherit;font-size:14px;font-weight:600;color:#0060c0;cursor:pointer;min-height:36px}
.ik-input{width:100%;font:inherit;font-size:16px;border:2px solid #e5e5ea;border-radius:12px;padding:10px 12px;background:#fff;color:var(--ik-ink);min-height:46px}
.ik-input:focus{outline:none;border-color:var(--ik-ink)}
select.ik-input{padding-right:30px}
.ik-label{display:block;font-size:13px;font-weight:600;color:var(--ik-ink2);margin:10px 0 4px}

/* the views */
.ik-view{display:none}
.ik-view.on{display:block}
.ik-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
/* Oran's iPhone, 2026-10-13: the date and title were squeezed beside the Day/Week/Month/Year control
   (letters stacked, title hidden behind it). The title block now never gets narrower than 200 px, and on
   phones the control drops to its own full-width row under the title. */
.ik-head>.ik-grow{flex:1 1 200px;min-width:0}
.ik-head .ik-eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){ .ik-head>.ik-seg{order:3;flex:1 1 100%;min-width:0} }
.ik-daynav{display:flex;gap:4px}
.ik-daynav button{width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:18px;cursor:pointer;color:var(--ik-ink)}
.ik-daynav button:disabled{opacity:.35;cursor:default}

/* rings */
.ik-rings{display:flex;align-items:center;gap:18px}
/* V2 Today (2026-10-13): big energy ring, a ring + 7-day bars per macro, drinks */
.ik-hero{display:flex;align-items:center;gap:18px;cursor:pointer}
.ik-heroring{position:relative;flex:none;width:168px;height:168px}
.ik-heroring svg{width:100%;height:100%}
.ik-heromid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ik-heronum{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1}
.ik-heroside{flex:1;min-width:0;display:flex;flex-direction:column}
.ik-heroside .ik-k{font-size:14px;font-weight:700}
.ik-heroside .ik-v{font-size:24px;font-weight:800;line-height:1.15}
.ik-heroside .ik-v span{font-size:14px;font-weight:600;color:var(--ik-ink2)}
.ik-heroside .ik-spark{width:100%;max-width:150px;height:34px;color:var(--ik-ink2)}
.ik-macros{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 10px}
.ik-macro{background:#fff;border:0;border-radius:18px;padding:12px;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.ik-macrotop{display:flex;align-items:center;gap:10px;min-width:0}
.ik-macrotop svg{flex:none;width:44px;height:44px}
.ik-macrotx{min-width:0}
.ik-macrotx .ik-t{font-size:13px;font-weight:700;color:var(--ik-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ik-macrotx .ik-n{font-size:19px;font-weight:800;line-height:1.15;white-space:nowrap}
.ik-macrotx .ik-n span{font-size:12px;font-weight:600;color:var(--ik-ink2)}
.ik-spark{display:block;width:100%;height:24px;color:var(--ik-ink2)}
.ik-macronote{font-size:12px}
.ik-water{display:flex;flex-direction:column;gap:10px}
.ik-water .ik-macrotop svg:first-child{width:52px;height:52px}
.ik-water .ik-spark{width:80px;flex:none}
.ik-waterbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ik-waterbtns .ik-btn{min-height:44px;font-size:15px;padding:8px 10px}
.ik-minis.ik-minis2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ik-ok{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid #d2d2d7;background:#fff;color:var(--ik-ink2);font-size:18px;font-weight:800;cursor:pointer}
.ik-ok.on{background:var(--ik-fibre);border-color:var(--ik-fibre);color:#fff}
@media (max-width:420px){ .ik-heroring{width:140px;height:140px} .ik-heronum{font-size:32px} .ik-heroside .ik-v{font-size:20px} .ik-hero{gap:12px} }
.ik-rings svg{flex:none;width:160px;height:160px}
.ik-ringlegend{display:flex;flex-direction:column;gap:12px;min-width:0}
.ik-ringlegend .ik-k{font-size:13px;font-weight:700}
.ik-ringlegend .ik-v{font-size:22px;font-weight:800;line-height:1.15}
.ik-ringlegend .ik-v span{font-size:14px;font-weight:600;color:var(--ik-ink2)}
.ik-k.energy{color:#d70040}.ik-k.protein{color:#0060c0}.ik-k.fibre{color:#1f7a36}.ik-k.water{color:#0b6e98}
.ik-done{font-size:12px;font-weight:700;color:#1f7a36;margin-left:4px}

.ik-minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 14px}
.ik-mini{background:#fff;border-radius:18px;padding:12px;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:44px}
.ik-mini .ik-t{font-size:12px;font-weight:600;color:var(--ik-ink2)}
.ik-mini .ik-n{font-size:20px;font-weight:800}
.ik-mini .ik-n span{font-size:13px;color:var(--ik-ink2)}
.ik-bar{height:6px;border-radius:3px;margin-top:6px;overflow:hidden}
.ik-bar i{display:block;height:6px;border-radius:3px}

/* food list */
.ik-list{background:#fff;border-radius:22px;padding:4px 16px;margin:0 0 14px}
.ik-group{font-size:13px;font-weight:700;color:var(--ik-ink2);padding:14px 0 2px;text-transform:uppercase;letter-spacing:.03em}
.ik-entry{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ik-line);width:100%;background:none;border-left:0;border-right:0;border-top:0;
  font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:56px}
.ik-entry:last-child{border-bottom:0}
.ik-entry:hover .ik-ename{text-decoration:underline}
.ik-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;font-size:20px}
.ik-ico.morning{background:#fff4e5}.ik-ico.afternoon{background:#e8f2ff}.ik-ico.evening{background:#efeafd}.ik-ico.drink{background:var(--ik-water-soft)}.ik-ico.supplement{background:#f2f2f7}
.ik-ewhen{font-size:12px;color:var(--ik-ink2);font-weight:600}
.ik-ename{font-weight:650;overflow-wrap:anywhere}
.ik-enote{font-size:12px;font-weight:600;color:#1f7a36}
.ik-est{font-size:11px;font-weight:700;color:var(--ik-amber);background:var(--ik-amberbg);border-radius:99px;padding:1px 8px;margin-left:4px;white-space:nowrap}
.ik-ekcal{font-weight:700;white-space:nowrap}
.ik-ekcal span{font-size:12px;color:var(--ik-ink2)}
.ik-empty{text-align:center;padding:22px 8px;color:var(--ik-ink2)}
.ik-quick{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}

/* tip / check-in */
.ik-tip{background:var(--ik-ink);color:#fff;border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;margin:0 0 14px}
.ik-tip b{color:#fff}
.ik-tip .ik-tiptext{font-size:15px;line-height:1.45;flex:1;min-width:0}
.ik-tip .ik-link{color:#7cc4ff;padding-left:0}
.ik-tipring{flex:none}

/* setup card */
.ik-setup{border:2px dashed #d2d2d7;background:#fff}

/* nutrient table */
.ik-nlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 28px}
.ik-nrow{padding:8px 0;border-bottom:1px solid var(--ik-line)}
.ik-nrow .ik-row{justify-content:space-between;font-size:14px}
.ik-nrow b{font-weight:700}
.ik-nrow .ik-bar{background:#f2f2f7}
.ik-ngroup{grid-column:1/-1;font-weight:800;font-size:15px;margin:12px 0 0}
.ik-low{color:var(--ik-amber);font-weight:700}
.ik-hi{color:var(--ik-high);font-weight:700}
.ik-nm{color:var(--ik-ink2);font-style:italic;font-weight:500}
details.ik-more summary{cursor:pointer;font-weight:700;padding:6px 0;min-height:36px;list-style-position:inside}

/* trends */
.ik-seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#e3e3e8;border-radius:12px;padding:3px;min-width:min(320px,100%)}
.ik-seg button{border:0;background:none;font:inherit;font-size:14px;font-weight:600;padding:8px 10px;border-radius:9px;min-height:38px;cursor:pointer;color:var(--ik-ink)}
.ik-seg button[aria-selected="true"]{background:#fff;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ik-dayrings{display:grid;gap:4px;text-align:center;font-size:12px;font-weight:600;color:var(--ik-ink2)}
.ik-dayrings svg{width:100%;max-width:40px;height:auto}
.ik-avgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;border-top:1px solid var(--ik-line);padding-top:12px}
.ik-avgs .ik-n{font-size:20px;font-weight:800}
.ik-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px;margin:0 0 16px}
.ik-chart{text-align:left;border:0;background:#fff;border-radius:22px;padding:20px;font:inherit;color:inherit;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0;position:relative}
.ik-chart:hover{box-shadow:0 4px 18px rgba(0,0,0,.08)}
.ik-chart .ik-ct{display:flex;align-items:baseline;gap:8px;width:100%}
.ik-chart .ik-ct b{font-size:17px;flex:1}
.ik-big{font-size:30px;font-weight:800}
.ik-big span{font-size:14px;font-weight:600;color:var(--ik-ink2)}
.ik-svg{width:100%;height:auto;display:block;overflow:visible}
.ik-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:600}
.ik-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.ik-wide{grid-column:1/-1}
.ik-tt{position:fixed;z-index:70;pointer-events:none;background:var(--ik-ink);color:#fff;border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.35;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.ik-tbl{width:100%;border-collapse:collapse;font-size:14px}
.ik-tbl th,.ik-tbl td{padding:7px 8px;border-bottom:1px solid var(--ik-line);text-align:right;white-space:nowrap}
.ik-tbl th:first-child,.ik-tbl td:first-child{text-align:left}
.ik-tblwrap{overflow-x:auto;margin-top:10px}

/* advice */
.ik-adv{padding:12px 0;border-bottom:1px solid var(--ik-line)}
.ik-adv:last-child{border-bottom:0}
.ik-adv .ik-row{justify-content:space-between;font-weight:700}
.ik-adv p{margin:4px 0 0;font-size:14px;color:var(--ik-ink2)}

/* bottom tab bar (phones) */
.ik-tabbar{position:fixed;left:0;right:0;bottom:var(--dd-hostbar-bottom,0px);z-index:25;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid #e5e5ea;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.ik-tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ik-ink2);background:none;border:0;font:inherit;font-size:11px;font-weight:600;min-height:48px;cursor:pointer;padding:4px 0}
.ik-tab svg{width:24px;height:24px}
.ik-tab[aria-current="page"],.ik-tab.on{color:var(--ik-energy)}
.ik-cam{justify-self:center;margin-top:-24px;width:64px;height:64px;border-radius:50%;background:var(--ik-ink);border:4px solid #fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(0,0,0,.25);cursor:pointer}
.ik-cam svg{width:30px;height:30px}
/* top nav (computers) */
.ik-topnav{display:none;align-items:center;gap:10px;margin:0 0 6px;flex-wrap:wrap}
.ik-topnav .ik-seg{grid-template-columns:repeat(3,minmax(0,1fr));min-width:330px}
@media (min-width:900px){
  .ik-tabbar{display:none}
  .ik-topnav{display:flex}
  .ik h1.ik-h1{font-size:40px}
  .ik-todaygrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;align-items:start}
}
@media (max-width:899px){ .dd-foot-body{padding-bottom:calc(90px + var(--dd-host-bottom,0px) + env(safe-area-inset-bottom))} }
@media (max-width:420px){ .ik-rings svg{width:132px;height:132px} .ik-ringlegend .ik-v{font-size:19px} .ik h1.ik-h1{font-size:30px} .ik-rings{gap:12px} }

/* sheets the app opens */
.dd-sheet.ik-sheet{max-width:560px;background:var(--ik-grey);padding:18px}
.dd-sheet.ik-sheet.ik-sheet-wide{max-width:980px}
.ik-sheettop{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.ik-sheettop h2{margin:0;font-size:22px;font-weight:800;flex:1}
.ik-photo{position:relative;border-radius:22px;overflow:hidden;background:#2c2c2e;margin:0 0 12px}
.ik-photo img{display:block;width:100%;max-height:300px;object-fit:contain}
.ik-tag{position:absolute;transform:translate(-50%,-50%);background:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25);max-width:45%;overflow:hidden;text-overflow:ellipsis}
.ik-tag.q{background:var(--ik-vit)}
.ik-item{background:#fff;border-radius:18px;padding:12px 14px;margin:0 0 10px;display:flex;flex-direction:column;gap:8px}
.ik-item.ask{background:var(--ik-amberbg);border:2px solid var(--ik-amberline)}
.ik-conf{font-size:12px;font-weight:600;white-space:nowrap}
.ik-conf.sure{color:#1f7a36}.ik-conf.likely{color:#0060c0}.ik-conf.guess{color:var(--ik-amber)}
.ik-grams{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ik-ink2)}
.ik-grams input[type=range]{flex:1;accent-color:var(--ik-ink);min-height:32px}
.ik-gnum{width:78px;font:inherit;font-weight:700;font-size:15px;border:1px solid #d2d2d7;border-radius:10px;padding:6px 8px;text-align:right}
.ik-x{background:none;border:0;font-size:20px;color:var(--ik-ink2);cursor:pointer;width:36px;height:36px;border-radius:50%}
.ik-x:hover{background:var(--ik-grey)}
.ik-say{font-size:15px;line-height:1.4}
.ik-askrow{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #e5e5ea;border-radius:22px;padding:4px 4px 4px 12px}
.ik-askrow input{flex:1;min-width:0;border:0;font:inherit;font-size:16px;outline:none;background:transparent;min-height:36px}
.ik-round{width:38px;height:38px;border-radius:50%;border:0;background:var(--ik-ink);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-size:16px}
.ik-round.soft{background:#f2f2f7;color:var(--ik-ink)}
.ik-working{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:14px;margin:0 0 10px}
.ik-spin{width:22px;height:22px;border-radius:50%;border:3px solid #e5e5ea;border-top-color:var(--ik-energy);animation:ik-spin .9s linear infinite;flex:none}
@keyframes ik-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ik-spin{animation:none}}
.ik-results{display:flex;flex-direction:column}
.ik-search{position:relative}
.ik-hits{background:#fff;border-radius:16px;margin-top:8px;max-height:46vh;overflow:auto}
.ik-hit{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--ik-line);background:none;font:inherit;text-align:left;padding:11px 14px;cursor:pointer;min-height:48px;color:inherit}
.ik-hit:last-child{border-bottom:0}
.ik-hit:hover{background:var(--ik-grey)}
.ik-hit small{color:var(--ik-ink2);font-weight:500}
.ik-warn{background:var(--ik-amberbg);border:1px solid var(--ik-amberline);color:#7a3d00;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.ik-tgt{display:grid;grid-template-columns:minmax(0,1fr) 92px 86px;gap:6px 8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ik-line);font-size:14px}
.ik-tgt input{width:100%;font:inherit;font-size:15px;border:1px solid #d2d2d7;border-radius:10px;padding:6px 8px;text-align:right;min-height:38px}
.ik-tgt .ik-rec{color:var(--ik-ink2);text-align:right;font-size:13px}
.ik-two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ik-about p{margin:0 0 10px}
.ik-photo-pick{display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:26px 14px;text-align:center;margin:0 0 12px}

/* V3 (2026-10-13): gauges, flags, Home screen & health switches */
.ik-tileico{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ik-grey);display:flex;align-items:center;justify-content:center;font-size:20px}
.ik-macro.ik-tilewarn{background:var(--ik-amberbg);box-shadow:inset 0 0 0 2px var(--ik-amberline)}
.ik-sechead{font-size:13px;font-weight:700;color:var(--ik-ink2);text-transform:uppercase;letter-spacing:.03em;margin:6px 2px 8px}
.ik-alerts{border-left:5px solid var(--ik-vit);padding-top:12px;padding-bottom:8px}
.ik-alert{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ik-line);padding:8px 0;font:inherit;font-size:14px;line-height:1.4;color:inherit;cursor:pointer}
.ik-alert:last-of-type{border-bottom:0}
.ik-alert.warn b{color:var(--ik-high)}
.ik-eflag{display:inline-block;font-size:12px;font-weight:600;color:var(--ik-amber)}
.ik-bal{display:inline-block;font-size:11px;font-weight:700;color:#1f7a36;background:var(--ik-fibre-soft);border-radius:99px;padding:1px 8px;white-space:nowrap}
.ik-bal.mid{color:var(--ik-amber);background:var(--ik-amberbg)}
.ik-bal.low{color:var(--ik-high);background:#ffe9ee}
.ik-warn.soft{background:#f5f7ff;border-color:#dfe5ff;color:var(--ik-ink)}
.ik-tog{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ik-line);cursor:pointer}
.ik-tog:last-child{border-bottom:0}
.ik-tog .ik-grow b{display:block;font-size:15px}
.ik-sw{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:99px;background:#d2d2d7;position:relative;cursor:pointer;margin:0;transition:background .2s}
.ik-sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.ik-sw:checked{background:var(--ik-fibre)}
.ik-sw:checked::after{transform:translateX(18px)}
.ik-sw:focus-visible{outline:3px solid var(--ik-ink);outline-offset:2px}
.ik-customize{display:block;margin:0 auto 14px}
@media (prefers-reduced-motion:reduce){.ik-sw,.ik-sw::after{transition:none}}

</style>

      var loaded = dd.store.loadData(program);
      data = loaded.data; meta = loaded.meta;
      if (loaded.notice) dd.ui.notice("load", loaded.notice, "warn");
      if (program.mount) program.mount(ctx());
      if (dd.menu) dd.menu.fromProgram(program);   // the program's own menu items, at the top
      render();
      if (dd.brand) dd.brand.start(program);
      // Sync listens for changes and for pairing links, so it starts before the link is read.
      if (dd.agent) dd.agent.attach(program);   // before sync: an agent link picks the ledger
      if (dd.sync) dd.sync.attach(program);
      if (dd.pair) {
        // The program's numbers can ride along in the QR while they're small. Example numbers don't.
        dd.pair.register({
          key: "d", label: "numbers", optional: true,
          // With live sync on, the phone gets the numbers from the database instead.
          give: function () { return (program.pairData === false || meta.example || (dd.sync && dd.sync.isOn())) ? undefined : [program.schemaVersion, data]; },
          take: function (v) {
            if (!Array.isArray(v) || v.length !== 2) return false;
            var body = v[1];
            if (v[0] < program.schemaVersion) body = dd.migrateData(program, body, v[0]);
            if (!program.validateData(body)) return false;
            // Rule 15: a copy that receives data asks before replacing the buyer's own.
            if (dd.move) return dd.move.receiveData(body, "pair");
            return dd.replaceData(body, { example: false, source: "pair" });
          }
        });
        dd.pair.receive();
      }
      paintExampleNotice();
      if (dd.setup && program.setup !== false) dd.setup.start(program);
      if (dd.helper) dd.helper.start(program);
      dd.diag.attach();
      if (dd.notes) dd.notes.start();
      dd.emit("ready", { source: loaded.source });
    } catch (e) { bootFailed(e); }
  };

  function bootFailed(why) {
    if (dd.errors) dd.errors.record("boot", why);
    var box = document.getElementById("dd-app");
    if (box) box.innerHTML = '<div class="dd-card"><h2>This page didn\'t start properly</h2>' +
      '<p>Please reload the page. If it keeps happening, contact DigiDoughnut and we\'ll sort it out.</p></div>';
    try { dd.diag.attach(); } catch (e) {}
  }
})();

/* ---- dd.store.js ---- */
/* ===== DigiDoughnut Platform · dd.store =====
   Everything saved in the browser goes through here.

   Storage names (plan, "Template architecture"):
     shared by every program on the same web address:  dd_<thing>_v1           e.g. dd_ai_connections_v1
     belonging to one program:                          dd_<program>_<thing>_v1 e.g. dd_profitcoach_data_v1

   Program data is saved inside an envelope so we always know which program and which schema
   version wrote it:
     { dd:1, program:"profitcoach", schemaVersion:1, savedAt:"2026-10-06T…", example:false, data:{…} }
   Data saved without an envelope (the Profit Coach POC) is read as schema version 0 and handed
   to the program's migrate(). Nothing is ever thrown away: anything we can't read is copied to
   dd_<program>_data_recovery_v1 first. */
(function () {
  "use strict";
  var dd = window.dd = window.dd || {};
  var store = dd.store = {};

  store.sharedKey = function (thing) { return "dd_" + thing + "_v1"; };
  store.programKey = function (programId, thing) { return "dd_" + programId + "_" + thing + "_v1"; };

  /* ---------- safe access: browsers can block or fill storage ---------- */
  function ls() { try { return window.localStorage; } catch (e) { return null; } }

  store.available = function () {
    var s = ls(); if (!s) return false;
    try { s.setItem("dd__probe", "1"); s.removeItem("dd__probe"); return true; } catch (e) { return false; }
  };
  store.get = function (key) { var s = ls(); if (!s) return null; try { return s.getItem(key); } catch (e) { return null; } };
  /* returns {ok:true} or {ok:false, reason:"storage_full"|"storage_blocked"} */
  store.set = function (key, value) {
    var s = ls(); if (!s) return { ok: false, reason: "storage_blocked" };
    try { s.setItem(key, value); return { ok: true }; }
    catch (e) {
      var full = e && (e.name === "QuotaExceededError" || e.code === 22 || e.code === 1014);
      dd.errors.record("store.set", e);
      return { ok: false, reason: full ? "storage_full" : "storage_blocked" };
    }
  };
  store.remove = function (key) { var s = ls(); if (s) try { s.removeItem(key); } catch (e) {} };
  store.getJSON = function (key) { var t = store.get(key); if (t == null) return null; try { return JSON.parse(t); } catch (e) { return undefined; } };
  store.setJSON = function (key, value) { return store.set(key, JSON.stringify(value)); };

  /* ---------- program data ---------- */
  function keepForRecovery(programId, raw, why) {
    dd.errors.record("store.recovery", why);
    store.set(store.programKey(programId, "data_recovery"), typeof raw === "string" ? raw : JSON.stringify(raw));
  }

  /* Load this program's data. Returns {data, meta:{example}, source, notice?}
     source: "example" (first visit), "saved", "migrated", "recovered" */
  store.loadData = function (program) {
    var key = store.programKey(program.id, "data");
    var rawText = store.get(key);

    if (rawText == null) {
      return { data: program.exampleData(), meta: { example: true }, source: "example" };
    }

    var raw; try { raw = JSON.parse(rawText); } catch (e) { raw = undefined; }
    var isEnvelope = raw && raw.dd === 1 && "data" in raw;
    var fromVersion = isEnvelope ? (raw.schemaVersion | 0) : 0;
    var body = isEnvelope ? raw.data : raw;
    var example = isEnvelope ? !!raw.example : false;
    var source = "saved";

    try {
      // Text that isn't readable data must never reach migrate(): a lenient migrate could
      // turn it into an empty list and the original would be overwritten on the next save.
      if (raw === undefined || raw === null || typeof raw !== "object") throw new Error("saved data is not readable");
      if (isEnvelope && raw.program && raw.program !== program.id) throw new Error("saved by program " + raw.program);
      if (fromVersion > program.schemaVersion) {
        // Saved by a NEWER version of this program. Keep a copy, then try to carry on.
        keepForRecovery(program.id, rawText, "newer schema " + fromVersion);
      } else if (fromVersion < program.schemaVersion) {
        body = dd.migrateData(program, body, fromVersion);
        source = "migrated";
      }
      if (!program.validateData(body)) throw new Error("validateData said no (from v" + fromVersion + ")");
    } catch (e) {
      keepForRecovery(program.id, rawText, e);
      return {
        data: program.emptyData(), meta: { example: false }, source: "recovered",
        notice: "We couldn't read your saved numbers, so we've started a fresh page. Your old numbers are kept safe on this device. Contact DigiDoughnut and we'll help you get them back."
      };
    }

    if (source === "migrated") store.saveData(program, body, { example: example });
    return { data: body, meta: { example: example }, source: source };
  };

  store.saveData = function (program, data, meta) {
    var res = store.setJSON(store.programKey(program.id, "data"), {
      dd: 1, program: program.id, schemaVersion: program.schemaVersion,
      savedAt: new Date().toISOString(), example: !!(meta && meta.example), data: data
    });
    if (res.ok) { askToKeepStorage(program); store.checkRoom(); }
    return res;
  };

  store.dataBytes = function (programId) { var t = store.get(store.programKey(programId, "data")); return t ? t.length : 0; };

  /* Everything this web address keeps in the browser, in characters (browsers allow about 5 million
     per address). Live sync keeps a second copy of the data, so a program uses about 3x its data. */
  store.LIMIT = 5000000;
  store.usedChars = function () {
    var s = ls(), n = 0; if (!s) return 0;
    try { for (var i = 0; i < s.length; i++) { var k = s.key(i), v = s.getItem(k); n += k.length + (v ? v.length : 0); } } catch (e) {}
    return n;
  };
  /* Nearly full (over 80%): warn once per visit, before a save actually fails. */
  var warnedFull = false;
  store.checkRoom = function () {
    if (warnedFull || store.usedChars() < store.LIMIT * 0.8) return;
    warnedFull = true;
    dd.errors.record("store", "browser storage over 80% full: " + store.usedChars() + " characters");
    if (dd.ui) dd.ui.notice("storage", "This browser's storage for this web address is nearly full. Download a backup now (menu → ⚙️ Settings → 💾 Backup & new versions), and contact DigiDoughnut if this keeps showing.", "warn");
  };

  /* ---------- ask the browser to keep our storage ----------
     Asked once, after the buyer's first real save, so browsers that show a prompt
     (Firefox) show it at a moment that makes sense. Chrome and Safari decide silently. */
  store.persisted = "not asked";
  // On load, report what the browser already decided (from an earlier visit), so the
  // diagnostic doesn't say "not asked" just because nothing was saved on this visit yet.
  try {
    if (navigator.storage && navigator.storage.persisted) {
      navigator.storage.persisted().then(function (already) {
        if (store.persisted === "not asked") store.persisted = already ? "yes" : "not yet";
      }, function () {});
    } else { store.persisted = "unsupported"; }
  } catch (e) {}
  function askToKeepStorage(program) {
    if (store.persisted === "not yet") store.persisted = "not asked";
    if (store.persisted !== "not asked") return;
    if (!(navigator.storage && navigator.storage.persist)) { store.persisted = "unsupported"; return; }
    store.persisted = "asking";
    navigator.storage.persisted().then(function (already) {
      return already || navigator.storage.persist();
    }).then(function (granted) { store.persisted = granted ? "yes" : "no"; })
      .catch(function (e) { store.persisted = "error"; dd.errors.record("store.persist", e); });
  }
})();

/* ---- dd.errors.js ---- */
/* ===== DigiDoughnut Platform · dd.errors =====
   Every failure the buyer could see is one of a few named types with one friendly message.
   Raw technical detail is recorded for the support diagnostic only, with codes masked.
   RULE: buyer-facing text never contains provider wording, JSON, status codes or jargon. */
(function () {
  "use strict";
  var dd = window.dd = window.dd || {};
  var errors = dd.errors = {};

  /* {company} is filled in with the AI company's friendly name, e.g. "Google". */
  var TYPES = {
    // the seven AI error types (plan, "AI connections")
    offline:       ["You're not connected to the internet.", "Check your Wi-Fi or data, then try again."],
    // The website hosting the page forbids talking to other websites (e.g. Neocities' free plan).
    host_blocked:  ["The website hosting this page won't let the helper reach {company}.", "Open the program from a different web address (see setup step 3, Where it lives), or contact DigiDoughnut and we'll help."],
    bad_code:      ["That code didn't work.", "It may have a typo or a missing piece. Copy it fresh from {company} and paste it again."],
    not_allowed:   ["That code isn't allowed to do this.", "Make a new code on {company}'s site and paste it here."],
    out_of_share:  ["You've used today's free share.", "It refills on its own. Try again later or tomorrow."],
    busy:          ["{company}'s servers are having a busy moment.", "Wait a minute and try again. This usually clears on its own."],
    timeout:       ["That took too long, so we stopped waiting.", "Tap Try again. If it keeps happening, check your internet."],
    unexpected:    ["Something unexpected happened.", "Wait a moment and try again."],
    // platform types
    storage_full:    ["This browser's storage is full, so your last change wasn't saved.", "Make a backup, then clear some space or old data."],
    storage_blocked: ["This browser isn't letting the program save.", "Private or incognito windows often block saving. Open the program in a normal window."],
    // live sync (Phase 5): the buyer's own Firebase project
    sync_config:   ["That Firebase setup code didn't work.", "Copy the whole firebaseConfig box again from Firebase (Project settings, Your apps) and paste it in."],
    sync_auth:     ["Firebase didn't let this program sign in.", "In Firebase, open Authentication, then Sign-in method, and switch on Anonymous. Then try again."],
    sync_rules:    ["Your Firebase database said no.", "Open the sync setup again and redo the step where you paste the rules, then tap Publish."],
    sync_offline:  ["Can't reach your Firebase database right now.", "Check your internet. Your changes are kept on this device and go across when it's back."],
    sync_newer:    ["Your other device has a newer version of this program.", "Put the newer file on this device too, then open it from the same address."],
    sync_moved:    ["This device's live sync address was retired on your other device.", "Open the program on that device and use Send to my phone again to sync it."],
    sync_file:     ["Live sync needs the program to be online.", "Put it online first (setup step 3, Where it lives), then open it from its web address and turn on sync there."],
    backup_bad:    ["That file didn't look like a backup from this program.", "Choose a file that ends in .json and was made with the Download a backup button."]
  };

  errors.types = Object.keys(TYPES);

  /* -> {type, title, help} in plain words */
  errors.friendly = function (type, vars) {
    var t = TYPES[type] || TYPES.unexpected;
    var company = (vars && vars.company) || "the AI company";
    function fill(s) { return s.replace(/\{company\}/g, company).replace(/^the AI company's/, "The AI company's"); }
    return { type: TYPES[type] ? type : "unexpected", title: fill(t[0]), help: fill(t[1]) };
  };

  /* Generic first guess from an HTTP status or a thrown error. AI adapters (Phase 2) refine
     this with the provider's own error reason. A 400 is NOT "bad code": it usually means a bug
     on our side, so it maps to "unexpected" (fixes POC problem #6). */
  errors.classify = function (info) {
    info = info || {};
    var name = info.name || (info.error && info.error.name);
    if (name === "AbortError" || name === "TimeoutError") return "timeout";
    if (navigator.onLine === false) return "offline";
    var s = info.status;
    if (s === 0 || name === "TypeError") return "offline";      // fetch() network failure
    if (s === 401) return "bad_code";
    if (s === 403) return "not_allowed";
    if (s === 429) return "out_of_share";
    if (s >= 500 && s <= 599) return "busy";
    return "unexpected";
  };

  /* Show a friendly message in a status box. kind defaults to "err". */
  errors.show = function (el, type, vars, kind) {
    var f = errors.friendly(type, vars);
    dd.ui.status(el, kind || "err", f.title, f.help);
    return f;
  };

  /* ---------- raw detail for support only ---------- */
  var log = [];
  /* Anything that looks like a code or secret is masked before it's stored or shown.
     Three layers, so it never depends on one company's code format:
       1. the buyer's actual saved codes, wherever they appear (modules register them below);
       2. any long run of letters and digits that mixes upper case, lower case and digits:
          real codes from every company look like that, while model names, dates, addresses
          and messages don't;
       3. known code formats and the usual places codes travel (key=, Bearer, x-api-key,
          the "k" piece of a phone-pairing link), as a backstop. */
  var secretSources = [];
  errors.addSecrets = function (fn) { secretSources.push(fn); };
  function knownSecrets() {
    var out = [];
    secretSources.forEach(function (fn) { try { (fn() || []).forEach(function (s) { if (s && String(s).length >= 8) out.push(String(s)); }); } catch (e) {} });
    return out.sort(function (a, b) { return b.length - a.length; });
  }
  function keep4(m) { return m.slice(0, 4) + "…[hidden]"; }
  function scrub(s) {
    s = String(s);
    knownSecrets().forEach(function (code) { s = s.split(code).join(keep4(code)); });
    return s
      .replace(/([?&](?:key|api_?key|token|access_token)=)[^&\s"']+/gi, "$1[hidden]")
      .replace(/(Bearer\s+)[^\s"',;]{8,}/gi, "$1[hidden]")
      .replace(/((?:x-api-key|x-goog-api-key|api_?key|apikey)["']?\s*[:=]\s*["']?)[^\s"',;]{8,}/gi, "$1[hidden]")
      .replace(/([#&~]dd=1~[^~\s]*~[^~\s]*(?:~[^~\s]*)*?~k)[^~\s"']+/g, "$1[hidden]")
      .replace(/\b(?:AQ\.|AIza|sk-|gsk_|xai-|pk-|or-)[0-9A-Za-z_.\-]{12,}/g, keep4)
      .replace(/[0-9A-Za-z_.\-]{24,}/g, function (m) {
        return /[a-z]/.test(m) && /[A-Z]/.test(m) && /[0-9]/.test(m) ? keep4(m) : m;
      });
  }
  errors.scrub = scrub;

  errors.record = function (where, detail) {
    var text = detail instanceof Error ? (detail.name + ": " + detail.message) :
               (typeof detail === "object" && detail !== null) ? safeJson(detail) : String(detail);
    log.unshift({ when: new Date().toLocaleTimeString(), where: String(where), detail: scrub(text).slice(0, 600) });
    if (log.length > 10) log.length = 10;
  };
  errors.recent = function () { return log.slice(); };
  function safeJson(o) { try { return JSON.stringify(o); } catch (e) { return String(o); } }

  /* Pages can be blocked from talking to other websites by the site that hosts them (a
     "content security policy"). The browser then reports it like a dropped connection, so we
     listen for the browser's own notice and tell the two apart. */
  var violations = [];
  errors.blockedRecently = function (url, withinMs) {
    var origin; try { origin = new URL(url).origin; } catch (e) { return false; }
    var since = Date.now() - (withinMs || 5000);
    return violations.some(function (v) { return v.at >= since && v.origin === origin; });
  };
  errors.blockedList = function () { return violations.slice(0, 5); };
  document.addEventListener("securitypolicyviolation", function (e) {
    var origin = ""; try { origin = new URL(e.blockedURI).origin; } catch (x) { origin = String(e.blockedURI || ""); }
    violations.unshift({ at: Date.now(), origin: origin, directive: e.effectiveDirective || e.violatedDirective || "" });
    if (violations.length > 20) violations.length = 20;
    errors.record("page security rule", "this website blocks " + origin + " (" + (e.effectiveDirective || "") + ")");
  });

  // Catch anything that slips through so support can see it. The buyer sees nothing scary.
  window.addEventListener("error", function (e) { errors.record("page", (e && e.message) || "error"); });
  window.addEventListener("unhandledrejection", function (e) { errors.record("promise", (e && e.reason) || "rejected"); });
})();

/* ---- dd.ui.js ---- */
/* ===== DigiDoughnut Platform · dd.ui =====
   Page frame (header, footer), status boxes, top-of-page notices, sheets, toasts and a
   friendly confirm(). Programs use these instead of alert()/confirm() so every program
   looks and behaves the same. */
(function () {
  "use strict";
  var dd = window.dd = window.dd || {};
  var ui = dd.ui = {};

  ui.$ = function (id) { return document.getElementById(id); };
  ui.esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  /* ---------- frame ---------- */
  ui.mount = function (program) {
    if (program.accent) ui.setAccent(program.accent);
    ui.$("dd-top").innerHTML =
      '<div><h1>' + ui.esc(program.name) + '</h1>' + (program.tagline ? '<div class="dd-tag">' + ui.esc(program.tagline) + '</div>' : "") + '</div>' +
      '<div class="dd-spacer"></div><div class="dd-slot" id="dd-top-slot"></div>';
    ui.$("dd-footer").innerHTML =
      '<div class="dd-foot-body"><div class="dd-foot-grid">' +
      '<span class="dd-foot-left"><b>' + ui.esc(program.name) + '</b> <span class="dd-foot-ver">' + ui.esc(program.version) + '</span></span>' +
      '<span class="dd-foot-mid">' + (dd.brand ? dd.brand.footerLogo() : "<b>DigiDoughnut</b>") + '</span>' +
      '<span class="dd-foot-right"><span class="dd-foot-note">Your ' + ui.esc(program.dataLabel || "numbers") + ' ' + (program.dataLabel && !/s$/.test(program.dataLabel) ? "is" : "are") + ' stored on this device.</span><br>' +
      (dd.backup ? '<button class="dd-linkbtn dd-foot-link" id="dd-data-link">💾 Backup &amp; new versions</button> · ' : "") +
      '<button class="dd-linkbtn dd-foot-link" id="dd-privacy-link">Privacy</button></span></div></div>';
    var link = ui.$("dd-privacy-link");
    link.addEventListener("click", function (e) { e.stopPropagation(); ui.privacy(); });
    var data = ui.$("dd-data-link");
    if (data) data.addEventListener("click", function (e) { e.stopPropagation(); dd.backup.open(); });
    if (dd.menu) dd.menu.mount(program);   // the name becomes the menu button (Phase 7.1)
  };

  /* "What this program connects to": every outside connection, in plain words.
     Oran's rule: no silent phone-home, so the noticeboard check is spelled out here. */
  ui.privacy = function () {
    var p = dd.getProgram ? dd.getProgram() : null, name = p ? p.name : "This program";
    var ai = dd.ai && dd.ai.providers && dd.ai.providers.google;
    var sh = ui.sheet(dd.menu.headHtml({ title: "Privacy", icon: "🔒", sub: null }) +
      '<p><b>Your numbers</b> are stored in this browser, on this device. DigiDoughnut never sees them.</p>' +
      '<p><b>The helper.</b> When you use an AI feature, your question and the numbers it needs go to Google, using your own free access code. ' +
        (ai ? ui.esc(ai.privacyNote) : "") + '</p>' +
      (dd.helper && dd.helper.enabled() ? '<p><b>Your chats with ' + ui.esc(dd.helper.name()) + '</b> are kept in this browser, on this device, so you can pick up where you left off. "New chat" clears them. They are never sent to your phone or synced.</p>' : "") +
      '<p><b>Live sync</b> (only if you turn it on) keeps a copy in your own Firebase database, in your own Google account. DigiDoughnut never sees it. ' +
        'Each program\'s copy sits at a long secret address that only your devices know, and the program signs in to your database before it reads or writes.</p>' +
      (dd.agent && dd.agent.available() ? '<p><b>Your AI agent</b> (only if you connect one, setup step 5) reads and changes your ' + ui.esc(p && p.dataLabel || "numbers") +
        ' through your own Firebase database. Whatever it reads also goes to the company that runs it, for example Meta for Muse.</p>' : "") +
      '<p><b>Backups</b> are files you download and keep yourself. Nothing is sent anywhere.</p>' +
      '<p><b>The DigiDoughnut noticeboard.</b> Once a week, ' + ui.esc(name) + ' checks the DigiDoughnut noticeboard for updated help links and notices. ' +
        'It only downloads a small file. Your numbers, your code and anything you type are never sent.</p>' +
      '<div class="dd-btnrow"><button class="dd-btn" data-close>Close</button></div>');
    sh.querySelector("[data-close]").addEventListener("click", ui.closeSheet);
  };

  /* Set the program's accent colour, with a darker shade for hover. */
  ui.setAccent = function (hex) {
    if (!/^#[0-9a-f]{6}$/i.test(hex)) return;
    var r = document.documentElement.style;
    r.setProperty("--dd-brand", hex);
    r.setProperty("--dd-brand-d", shade(hex, -0.15));
    r.setProperty("--dd-brand-soft", mix(hex, 0.9));
    r.setProperty("--dd-brand-soft-d", mix(hex, 0.82));
  };
  function rgb(hex) { return [1, 3, 5].map(function (i) { return parseInt(hex.substr(i, 2), 16); }); }
  function toHex(a) { return "#" + a.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return (v < 16 ? "0" : "") + v.toString(16); }).join(""); }
  function shade(hex, f) { return toHex(rgb(hex).map(function (v) { return v * (1 + f); })); }
  function mix(hex, towardWhite) { return toHex(rgb(hex).map(function (v) { return v + (255 - v) * towardWhite; })); }

  /* ---------- status box: kind = ok | err | warn | info ---------- */
  ui.status = function (el, kind, title, help) {
    if (typeof el === "string") el = ui.$(el);
    if (!el) return;
    el.className = "dd-status show " + kind;
    el.setAttribute("role", kind === "err" ? "alert" : "status");
    el.innerHTML = help ? "<b>" + ui.esc(title) + "</b><br>" + ui.esc(help) : ui.esc(title);
  };
  ui.clearStatus = function (el) { if (typeof el === "string") el = ui.$(el); if (el) { el.className = "dd-status"; el.textContent = ""; } };

  /* ---------- notices: one per id, shown at the top of the page ---------- */
  ui.notice = function (id, text, kind, buttons) {
    var host = ui.$("dd-notices"); if (!host) return;
    var box = ui.$("dd-notice-" + id);
    if (!box) { box = document.createElement("div"); box.id = "dd-notice-" + id; host.appendChild(box); }
    box.className = "dd-notice " + (kind || "info");

/* ---- dd.menu.js ---- */
/* ===== DigiDoughnut Platform · dd.menu — the program menu (Phase 7.1) =====
   The program's name in the header is a button, "☰ <name> ▾", top-left, in the same place in
   every product (Oran, 2026-10-07). Top-right holds the sync chip and, on computers, DigiBot's
   column; bottom-right holds DigiBot's phone button and is where hosts lay their bars.

   It opens the program's own items first, then ⚙️ Settings › (the platform's items), then Help and
   About. Each module adds its own:
     dd.menu.add({id, icon, label, order, show(), run(), note()})
       order   10 Setup & connections · 20 Where it lives · 30 Send to my phone ·
               40 Backup & new versions · 50 Privacy · 60 Help & support details · 70 About

      '<span class="dd-menu-ico" aria-hidden="true">☰</span>' +
      '<span class="dd-top-icon" id="dd-top-icon" aria-hidden="true">' + esc(program.icon || "🍩") + '</span>' +
      '<span class="dd-menu-name">' + esc(program.name) + '</span>' +
      '<span class="dd-menu-dot" id="dd-menu-dot" hidden></span></button>';

    menu.refreshDot();

/* ===== DigiDoughnut Platform · dd.diag =====
   Hidden support tool. Triple-click (or triple-tap) the footer to open a report that support

             " · platform " + (b.platform || "dev") + " · built " + (b.built || "-") + " " + (b.commit || ""));
    out.push("--- Page ---");
    out.push((e.isFile ? "Opened from a file on this computer" : "Hosted at " + location.host) +
             (e.isStandalone ? " · Home Screen app" : " · browser tab"));
    out.push("--- Device ---");
    out.push((e.isIOS ? "iPhone/iPad" : e.isAndroid ? "Android" : e.isPhone ? "phone" : "computer") +
             " · screen " + screen.width + "×" + screen.height + " · " + (navigator.onLine ? "online" : "offline"));
    out.push(navigator.userAgent);
    out.push("--- Storage ---");
    out.push("Saving works: " + (dd.store.available() ? "yes" : "NO") +
             " · keep-storage request: " + dd.store.persisted +
             (p ? " · data " + dd.store.dataBytes(p.id) + " bytes" + (dd.isExample() ? " (example)" : "") : "") +
             " · browser storage used " + Math.round(dd.store.usedChars() / 1000) + " of about " + Math.round(dd.store.LIMIT / 1000) + " thousand characters");
    if (p && dd.store.get(dd.store.programKey(p.id, "data_recovery")) != null) out.push("A recovery copy of older data is saved on this device.");
    var blocked = dd.errors.blockedList ? dd.errors.blockedList() : [];
    if (blocked.length) out.push("This website BLOCKS outside connections: " + blocked.map(function (v) { return v.origin; }).filter(function (o, i, a) { return a.indexOf(o) === i; }).join(", "));
    out.push("--- Last problems (newest first) ---");
    var log = dd.errors.recent();

    return out;
  }

    var lines = core();
    sections.forEach(function (s) {

    });

  };

      '<pre id="dd-diag-text"></pre>' +

      ta.remove(); return ok;
    }

    note: function () { return "If DigiDoughnut support asks for them"; }, run: function () { diag.open(); } });

/* ===== DigiDoughnut Platform · dd.pair — send setup to your phone by QR =====
