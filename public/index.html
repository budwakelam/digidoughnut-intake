   (not even tiiny.host). The phone unpacks it once and forgets the link.

   What can travel (each module adds its own piece with dd.pair.register):
     k  the AI code            (dd.ai; on by default, with a switch to leave it out)
     d  the program's numbers  (dd.core; only while small enough to keep the QR simple)
     s/f sync details          (Phase 5, dd.sync)
   Packing, as short as possible so the QR stays simple and scans fast:
     #dd=1~<time>~<id>~k<code>~d*<base64url of JSON>
   Plain text pieces (like the code) travel as-is; anything else as base64url JSON marked "*".
   Safety: every QR has a time stamp and a one-time ID. It stops working after 10 minutes,
   and each one can be used once. Pairing from a file on the computer is refused kindly:
   the phone can't open a file that lives on the computer. */
(function () {
  "use strict";
  var dd = window.dd = window.dd || {};
  var pair = dd.pair = {};
  var USED_KEY = "dd_pair_used_v1", LIFE_S = 600, SKEW_S = 300;
  var MAX_LINK = 900;          // above this the QR gets dense; numbers are left out instead
  var pieces = [];             // {key, label, give(opts) -> value|undefined, take(value, ctx)}
  var last = { made: null, received: null };

  pair.register = function (piece) { pieces.push(piece); };

  /* ---------- packing ---------- */
  function b64urlEncode(str) {
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function b64urlDecode(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function newId() {   // 6 random base-36 characters (about 2 billion possibilities)
    var b = new Uint32Array(1); crypto.getRandomValues(b);
    return ("00000" + (b[0] % 2176782336).toString(36)).slice(-6);
  }
  var PLAIN = /^[A-Za-z0-9_.:\-]+$/;   // safe after "#" without escaping, and contains no "~"
  function pack(payload) {
    var out = ["1", payload.t, payload.i];
    Object.keys(payload).forEach(function (k) {
      if (k === "v" || k === "t" || k === "i") return;
      var v = payload[k];
      out.push(k + (typeof v === "string" && PLAIN.test(v) ? v : "*" + b64urlEncode(JSON.stringify(v))));
    });
    return out.join("~");
  }
  function unpack(s) {
    var parts = s.split("~");
    if (parts[0] !== "1" || parts.length < 3) return null;
    var payload = { v: 1, t: parts[1], i: parts[2] };
    parts.slice(3).forEach(function (piece) {
      var k = piece.charAt(0), rest = piece.slice(1);
      payload[k] = rest.charAt(0) === "*" ? JSON.parse(b64urlDecode(rest.slice(1))) : rest;
    });
    return payload;
  }
  pair._unpack = unpack;
  function baseUrl() { return location.href.split("#")[0]; }

  /* Build the link. opts = {includeCode:true, base:"https://…" (default: this page),
     maxLink: characters (default: small enough for a simple QR)}.
     Returns {link, included:[keys], left:[labels]}. The Setup Center uses base + a large
     maxLink to carry everything from the file on the computer to its new web address. */
  pair.makeLink = function (opts) {
    opts = opts || {};
    var base = (opts.base || baseUrl()).split("#")[0], max = opts.maxLink || MAX_LINK;
    function link(payload) { return base + "#dd=" + pack(payload); }
    var payload = { v: 1, t: Math.floor(Date.now() / 1000).toString(36), i: newId() };
    var included = [], left = [];
    // Small, essential pieces first; the program's numbers last (they're the optional extra).
    // bare: open the other copy carrying nothing ("Bring my … along" switched off)
    if (!opts.bare) pieces.slice().sort(function (a, b) { return (a.optional ? 1 : 0) - (b.optional ? 1 : 0); }).forEach(function (p) {
      var v; try { v = p.give(opts); } catch (e) { dd.errors.record("pair.give:" + p.key, e); }
      if (v === undefined || v === null) return;
      payload[p.key] = v;
      if (p.optional && link(payload).length > max) { delete payload[p.key]; left.push(p.label); return; }
      included.push(p.key);
    });
    var out = link(payload);
    last.made = { at: new Date().toLocaleTimeString(), size: out.length, parts: included.join(",") || "none" };
    return { link: out, included: included, left: left, expiresAt: (parseInt(payload.t, 36) + LIFE_S) * 1000 };
  };

  /* ---------- QR drawing (vendored qrcode-generator, fixed cell size: never scalable:true) ---------- */
  pair.qrSvg = function (text, maxPx) {
    // Medium error correction while the QR stays small; otherwise Low, which keeps it simpler
    // (screens don't get scratched, so Low scans fine).
    var qr = qrcode(0, "M"); qr.addData(text, "Byte"); qr.make();
    if (qr.getModuleCount() > 41) { qr = qrcode(0, "L"); qr.addData(text, "Byte"); qr.make(); }
    var n = qr.getModuleCount();
    var cell = Math.max(3, Math.min(8, Math.floor((maxPx || 280) / (n + 8))));
    return { svg: qr.createSvgTag({ cellSize: cell, margin: cell * 4 }), modules: n };
  };

  /* ---------- the "Send to my phone" sheet ---------- */
  var timer = null;
  pair.open = function () {
    if (dd.env.isFile) {
      var s1 = dd.ui.sheet(dd.menu.headHtml({ title: "Send to my phone", icon: "📲" }) +
        '<p>Your phone can\'t open a file that lives on this computer. Put the program online first (setup step 3, Where it lives), then open it from its web address and tap this again.</p>' +
        '<div class="dd-btnrow"><button class="dd-btn" data-close>OK</button></div>');
      s1.querySelector("[data-close]").addEventListener("click", dd.ui.closeSheet);
      return;
    }
    var hasCode = dd.ai && dd.ai.hasCode();
    var sh = dd.ui.sheet(dd.menu.headHtml({ title: "Send to my phone", icon: "📲" }) +
      '<p class="dd-note" style="margin-top:0">Open your phone\'s camera and point it at this square. Tap the link that appears.</p>' +
      /* PLATFORM CHANGE (2026-10-13): on iPhone, a Home Screen icon keeps its own saved things, apart from Safari.
         So the order matters: scan, let it open in Safari, then add it to the Home Screen from there. */
      /* PLATFORM CHANGE (2026-10-13 V3): leave "Open as Web App" off, or the icon gets its own empty storage. */
      '<p class="dd-note">iPhone: let the link open in Safari, then add it to your Home Screen from there, and leave <b>Open as Web App</b> switched off. An icon you added earlier won\'t see what this square brings.</p>' +
      '<div class="dd-qr" id="dd-qr"></div>' +
      '<p class="dd-qr-timer" id="dd-qr-timer"></p>' +
      (hasCode ? '<label class="dd-check"><input type="checkbox" id="dd-qr-code" checked> Include my free access code, so the phone is ready to use</label>' +
                 '<p class="dd-note" id="dd-qr-warn">This square contains your access code. Only scan it with your own phone, and close this when you\'re done.</p>' : "") +
      '<p class="dd-note" id="dd-qr-left"></p>' +
      '<div class="dd-btnrow"><button class="dd-btn ghost" data-new>Make a new code</button><button class="dd-btn" data-close>Done</button></div>',
      { onClose: function () { clearInterval(timer); } });
    sh.querySelector("[data-close]").addEventListener("click", dd.ui.closeSheet);
    sh.querySelector("[data-new]").addEventListener("click", draw);
    var box = sh.querySelector("#dd-qr-code");
    if (box) box.addEventListener("change", draw);
    draw();

    function draw() {
      var include = box ? box.checked : false;
      var made = pair.makeLink({ includeCode: include });
      var q = pair.qrSvg(made.link, Math.min(300, window.innerWidth - 80));
      sh.querySelector("#dd-qr").innerHTML = q.svg;
      var warn = sh.querySelector("#dd-qr-warn"); if (warn) warn.style.display = include ? "" : "none";
      sh.querySelector("#dd-qr-left").textContent = pair.whatTravels(made);
      clearInterval(timer);
      var tick = function () {
        var s = Math.round((made.expiresAt - Date.now()) / 1000), el = sh.querySelector("#dd-qr-timer");
        if (!el) { clearInterval(timer); return; }
        if (s <= 0) {
          clearInterval(timer);
          sh.querySelector("#dd-qr").innerHTML = '<p class="dd-qr-expired">This code expired. Tap <b>Make a new code</b>.</p>';
          el.textContent = "";
          return;
        }
        el.textContent = "Works for " + Math.floor(s / 60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60) + " more. Scan it with your own phone.";
      };
      tick(); timer = setInterval(tick, 1000);
    }
  };

  /* ---------- the same QR, drawn right on the page (audit 2026-10-08, #4) ----------
     pair.inline(el, {size}) fills `el` with a big QR, its timer and the access-code switch. The code
     is only made once the box is on screen, a used-up code is replaced the next time it scrolls into
     view, and a change to the data makes a fresh one (the old square would carry old numbers).
     Programs never call this on a phone: scanning your own screen makes no sense. */
  pair.inline = function (el, opts) {
    opts = opts || {};
    if (!el) return null;
    if (dd.env.isFile) {
      el.innerHTML = '<p class="dd-qr-file">Your phone can\'t open a file that lives on this computer. Put the program online first, then open it from its web address: the code to scan shows up right here.</p>' +
        (dd.move ? '<button class="dd-btn small" data-where>🏠 Put it online</button>' : "");
      var w = el.querySelector("[data-where]"); if (w) w.addEventListener("click", function () { dd.move.where(); });
      return null;
    }
    var hasCode = dd.ai && dd.ai.hasCode(), made = null, t = null, again = null, seen = false;
    el.innerHTML = '<div class="dd-qr dd-qr-inline" data-qr></div><p class="dd-qr-timer" data-timer></p>' +
      (hasCode ? '<label class="dd-check"><input type="checkbox" data-code checked> Include my free access code</label>' : "") +
      '<p class="dd-note" data-left></p>';
    var q = function (s) { return el.querySelector(s); }, box = q("[data-code]");
    function draw() {
      if (!document.body.contains(el)) { clearInterval(t); return; }
      var include = box ? box.checked : false;
      made = pair.makeLink({ includeCode: include });
      q("[data-qr]").innerHTML = pair.qrSvg(made.link, opts.size || 260).svg;
      q("[data-left]").textContent = pair.whatTravels(made) + (include ? " The square holds your access code: only scan it with your own phone." : "");
      clearInterval(t);
      var tick = function () {
        if (!document.body.contains(el)) { clearInterval(t); return; }
        var s = Math.round((made.expiresAt - Date.now()) / 1000);
        if (s <= 0) {
          clearInterval(t); made = null;
          q("[data-qr]").innerHTML = '<div class="dd-qr-expired">This code timed out.<br><button class="dd-btn small" data-again>Show a new code</button></div>';
          q("[data-qr] [data-again]").addEventListener("click", draw);
          q("[data-timer]").textContent = "";
          return;
        }
        q("[data-timer]").textContent = "Works for " + Math.floor(s / 60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60) + " more.";
      };
      tick(); t = setInterval(tick, 1000);
    }
    if (box) box.addEventListener("change", draw);
    function show() { seen = true; if (!made) draw(); }

      io.observe(el);
    } else show();
    if (!seen) q("[data-qr]").innerHTML = '<div class="dd-qr-expired">…</div>';
    dd.on("change", function (ev) {
      if (!made || !document.body.contains(el) || (ev && ev.source === "sync")) return;
      clearTimeout(again); again = setTimeout(draw, 1200);
    });

  };

  /* One plain sentence: what this square carries, and what stays behind and why.
     Oran (2026-10-07): buyers expect their numbers to come along, so always say. */
  pair.whatTravels = function (made) {
    var p = dd.getProgram && dd.getProgram(), thing = (p && p.dataLabel) || "numbers";
    var parts = [], code = made.included.indexOf("k") >= 0, data = made.included.indexOf("d") >= 0;
    var synced = made.included.indexOf("s") >= 0;
    if (code) parts.push("your access code");
    if (data) parts.push("your " + thing);
    if (synced) parts.push("live sync");
    var says = parts.length ? "This brings " + parts.join(" and ") + " to your phone. " : "";
    if (synced && !(dd.isExample && dd.isExample())) says += "Your " + thing + " comes across through live sync, and stays synced from then on.";
    else if (!data && dd.isExample && dd.isExample()) says += "Example data doesn't travel: once you start your own " + thing + ", it will come along too.";
    else if (made.left.length) says += "Your " + thing + " can't fit in one square, so it will stay on this computer for now. Live sync (setup step 4) will move it.";
    else if (!data) says += "Your " + thing + " will stay on this computer.";
    return says.trim();
  };

  /* ---------- the phone side: unpack once, then forget the link ---------- */
  pair.receive = function () {
    var m = location.hash.match(/[#&]dd=([^&]+)/);
    if (!m) return null;
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}   // never leave the code in the address bar
    var payload;
    try { payload = unpack(decodeURIComponent(m[1])); if (!payload) throw new Error("bad"); } catch (e) {
      dd.errors.record("pair.receive", "unreadable pairing link");
      dd.ui.notice("pair", "That pairing link didn't come through completely. Make a new code on your computer and scan it again.", "warn");
      return { ok: false, why: "unreadable" };
    }
    if (!payload || payload.v !== 1) return { ok: false, why: "version" };
    var made = parseInt(payload.t, 36), now = Date.now() / 1000;
    if (!(made > 0) || now - made > LIFE_S || made - now > SKEW_S) {
      dd.ui.notice("pair", "This pairing code expired. Make a new one on your computer and scan again.", "warn");
      last.received = { at: new Date().toLocaleTimeString(), result: "expired" };
      return { ok: false, why: "expired" };
    }
    var used = dd.store.getJSON(USED_KEY) || [];
    if (used.indexOf(payload.i) >= 0) {
      dd.ui.notice("pair", "This pairing code was already used on this phone. Make a new one on your computer if you need to send again.", "warn");
      last.received = { at: new Date().toLocaleTimeString(), result: "already used" };
      return { ok: false, why: "used" };
    }
    dd.store.setJSON(USED_KEY, used.concat(payload.i).slice(-30));
    var got = [];
    pieces.forEach(function (p) {
      if (!(p.key in payload)) return;
      try { if (p.take(payload[p.key]) !== false && !p.hidden) got.push(p.label); } catch (e) { dd.errors.record("pair.take:" + p.key, e); }
    });
    last.received = { at: new Date().toLocaleTimeString(), result: got.length ? "got " + got.join(", ") : "nothing new" };
    dd.ui.clearNotice("pair");
    if (got.length) dd.ui.toast("Your " + got.join(" and ") + " came across from your computer.", 4000);
    dd.emit("pair:received", { got: got });
    return { ok: true, got: got };
  };

  // Scanning again while the program is already open in that tab only changes the part after
  // "#", which doesn't reload the page: catch that too.
  window.addEventListener("hashchange", function () { if (/[#&]dd=/.test(location.hash) && dd.getProgram && dd.getProgram()) pair.receive(); });

  if (dd.menu) dd.menu.add({ id: "phone", icon: "📲", label: "Send to my phone", order: 30,
    show: function () { return !dd.env.isPhone; },
    note: function () { return dd.env.isFile ? "Needs it online first (Where it lives)" : "Scan a square with your phone's camera"; },
    run: function () { pair.open(); } });

  if (dd.diag) dd.diag.addSection("Phone pairing", function () {
    return ["Last code made: " + (last.made ? last.made.at + " · " + last.made.size + " characters · carried " + last.made.parts : "none this visit"),
            "Last code received: " + (last.received ? last.received.at + " · " + last.received.result : "none this visit")];
  });
})();

/* ---- dd.ai.js ---- */
/* ===== DigiDoughnut Platform · dd.ai =====
   The AI connection layer. Programs never call an AI company directly: they call
   dd.ai.chat() / dd.ai.connect(), and this module picks the code, the model and the adapter.

   - Provider registry: each company is a small data entry. Launch lineup: Google only
     (Oran, 2026-10-06). Adding a company later = a registry entry (+ an adapter if it speaks
     a new dialect). API addresses live HERE, in the program, never in the noticeboard file.
   - Neutral tools: programs declare tools once ({name, description, params}); the adapter
     writes the company's schema. Nobody hand-writes Gemini schemas, so the old
     "required goes inside parameters" bug can't come back.
   - Hard limits: 30 s per request, 90 s and 5 tool rounds per turn, Stop at any time.
     The endless "thinking…" can't happen.
   - Every failure maps to one of dd.errors' seven friendly types.

   Facts below were checked against Google's docs on 2026-10-06 (models, free tier, errors).
   The buyer never sees a model name; the diagnostic does. */
(function () {
  "use strict";
  var dd = window.dd = window.dd || {};
  var ai = dd.ai = {};

  // request: one model, when it's the last one left · perModel: one model while others remain
  // turn: everything the helper does for one message · rounds: tool round-trips per message
  // hedge: a model silent this long while others remain gets company: the next model is asked
  // too, and whichever answers first wins (Oran's phone, 2026-10-07: three silent models in a
  // row cost 36 s at 12 s each; now each costs about 6 s, and a slow-but-working one still counts).
  ai.limits = { request: 30000, perModel: 12000, hedge: 6000, turn: 90000, rounds: 5 };   // tests shrink these
  var CONN_KEY = "dd_ai_connections_v1", MODELS_KEY = "dd_ai_models_v1", LEGACY_KEY = "dd_gemini_key_v1";
  var RECHECK_MS = 7 * 24 * 3600 * 1000;
  var BUSY_MS = 10 * 60 * 1000;   // a model that just failed is tried last for 10 minutes

  /* ---------- provider registry ---------- */
  ai.providers = {
    google: {
      id: "google", label: "Google", adapter: "gemini",
      // Only a HINT for which company a pasted code belongs to: Google decides whether it works.
      // "AQ." = auth keys (all AI Studio has made since 2026-05-28); "AIza" = older keys being
      // retired. Anything else still goes to the default company, never refused on its looks.
      codePattern: /^(AQ\.|AIza)/,
      getCodeUrl: "https://aistudio.google.com/apikey",   // overridable via noticeboard helpLinks.getCode_google
      base: "https://generativelanguage.googleapis.com/v1beta",
      free: true,
      // Model picking hints: never shown to the buyer.
      exclude: /(tts|live|audio|transcri|image|banana|embed|robotics|veo|lyria|imagen|research|aqa|gemma|computer|learnlm|thinking-exp|antigravity|customtools)/i,
      privacyNote: "Google may use what you send through its free plan to improve its products, and people at Google may read it. Don't put anything private in your messages to the helper."
    }
  };

  ai.defaultProvider = "google";   // launch lineup: Google only

  /* The "get a free code" page for a company (noticeboard can update it). */
  ai.getCodeLink = function (id) {
    var p = ai.providers[id || "google"];
    return dd.notes ? dd.notes.link("getCode_" + p.id, p.getCodeUrl) : p.getCodeUrl;
  };

  /* Which company does a pasted code belong to? Returns a provider id or null. */
  ai.detectProvider = function (code) {
    code = String(code || "").trim();
    var hints = (dd.notes && dd.notes.get("codePatterns")) || {};
    for (var id in ai.providers) {
      var p = ai.providers[id];
      var re = p.codePattern;
      if (hints[id]) try { re = new RegExp(hints[id]); } catch (e) {}
      if (re.test(code)) return id;
    }
    return null;
  };

  /* Tidy what people paste: stray spaces, quotes, "key=" prefixes, line breaks. */
  ai.cleanCode = function (raw) {
    return String(raw || "").replace(/[\s​-‍﻿]+/g, "").replace(/^["'`]+|["'`]+$/g, "").replace(/^(?:key|api_?key)=/i, "");
  };

  /* ---------- saved connections ----------
     dd_ai_connections_v1 = { main: {provider, code, savedAt}, backup: null }
     Shared by every program on the same web address. The code sits in this browser's storage,
     which is NOT encrypted; we never claim it is. */
  function loadConns() {
    var c = dd.store.getJSON(CONN_KEY);
    if (!c || typeof c !== "object") c = { main: null, backup: null };
    // Profit Coach POC kept a bare Gemini key: move it across once.
    if (!c.main) {
      var legacy = dd.store.get(LEGACY_KEY);
      if (legacy) {
        c.main = { provider: "google", code: legacy, savedAt: new Date().toISOString(), migrated: true };
        if (dd.store.setJSON(CONN_KEY, c).ok) { dd.store.remove(LEGACY_KEY); dd.store.remove("dd_gemini_model_v1"); }
      }
    }
    return c;
  }
  /* Every code this browser knows about is hidden from the support report, whatever its format. */
  var pendingCode = null;   // the code being checked by connect(), before it's saved
  dd.errors.addSecrets(function () {
    var c = dd.store.getJSON(CONN_KEY) || {}, out = [pendingCode, dd.store.get(LEGACY_KEY)];
    ["main", "backup"].forEach(function (k) { if (c[k] && c[k].code) out.push(c[k].code); });
    return out;
  });
  ai.hasCode = function () { var c = loadConns(); return !!(c.main && c.main.code); };
  ai.connection = function () { var c = loadConns().main; return c ? { provider: c.provider, label: ai.providers[c.provider] ? ai.providers[c.provider].label : c.provider, hint: mask(c.code) } : null; };
  ai.forget = function () {
    dd.store.remove(CONN_KEY); dd.store.remove(MODELS_KEY); dd.store.remove(LEGACY_KEY);
    dd.emit("ai:changed", { connected: false });
  };
  function mask(code) { return code && code.length > 4 ? "…" + code.slice(-4) : ""; }

  /* ---------- model cache ---------- */
  function models() { return dd.store.getJSON(MODELS_KEY) || {}; }
  function saveModels(m) { dd.store.setJSON(MODELS_KEY, m); }

  /* Rank model ids: stable Flash first, newest first, then Flash-Lite, then previews; Pro last
     (no free tier as of 2026-10-06). Noticeboard hints can prefer or avoid specific ids. */
  ai.rankModels = function (provider, ids) {
    var p = ai.providers[provider];
    var hints = (dd.notes && dd.notes.get("modelHints") || {})[provider] || {};
    var avoid = hints.avoid || [], prefer = hints.prefer || [];
    function ver(id) { var m = id.match(/(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; }
    function score(id) {
      var s = 0;
      if (prefer.indexOf(id) >= 0) s += 1000;
      if (/flash/i.test(id) && !/lite/i.test(id)) s += 300;
      else if (/flash-?lite/i.test(id)) s += 200;
      else if (/pro/i.test(id)) s += 50;
      if (/preview|exp|latest/i.test(id)) s -= 150;
      return s + ver(id);
    }
    var ranked = ids.filter(function (id) { return !p.exclude.test(id) && avoid.indexOf(id) < 0; })
                    .sort(function (a, b) { return score(b) - score(a); });
    // Alternate Flash and Flash-Lite. When Google overloads one family ("high demand", seen
    // on 3.6-3.8 Flash in Sept-Oct 2026) the other usually still answers, so the fallback
    // after the first busy model should be a Flash-Lite, not the next Flash.
    var flash = ranked.filter(function (id) { return /flash/i.test(id) && !/lite/i.test(id) && prefer.indexOf(id) < 0; });
    var lite = ranked.filter(function (id) { return /flash-?lite/i.test(id) && prefer.indexOf(id) < 0; });
    var head = ranked.filter(function (id) { return prefer.indexOf(id) >= 0; });
    var rest = ranked.filter(function (id) { return head.indexOf(id) < 0 && flash.indexOf(id) < 0 && lite.indexOf(id) < 0; });
    var mixed = head.slice();
    for (var i = 0; i < Math.max(flash.length, lite.length); i++) {
      if (flash[i]) mixed.push(flash[i]);
      if (lite[i]) mixed.push(lite[i]);
    }
    return mixed.concat(rest);
  };

  /* ---------- low-level request with timeout + Stop ---------- */
  var current = null;   // the AbortController of the newest request in flight
  var inflight = [];    // every request in flight (two models can be asked at once)
  ai.stop = function () { stopped = true; inflight.slice().forEach(function (c) { try { c.abort(); } catch (e) {} }); };
  var stopped = false;

  /* Test drills (AI test page only): while ai.drill is set, every request behaves as if
     Google ran out of free share, went silent, or the internet dropped. The page clears it. */
  ai.drill = null;
  function drilled(ms, ctl) {
    var d = ai.drill;
    if (d === "offline") return Promise.resolve({ status: 0, network: true, error: "drill: offline" });
    if (d === "out_of_share") return Promise.resolve({ status: 429, ok: false, text: "", body: { error: { code: 429, status: "RESOURCE_EXHAUSTED",
      message: "drill: quota exceeded", details: [{ "@type": "type.googleapis.com/google.rpc.QuotaFailure", violations: [{ quotaId: "GenerateRequestsPerDayPerProjectPerModel-FreeTier" }] }] } } });
    if (d === "timeout") return new Promise(function (resolve) {
      var t = setTimeout(function () { resolve({ status: -1, timeout: true }); }, ms);
      ctl.signal.addEventListener("abort", function () { clearTimeout(t); resolve({ status: -1, stopped: true }); });
    });
    return null;
  }

  /* Timing log for support: the last 8 requests, newest first. No codes, no content. */
  var reqLog = [];
  ai.requestLog = function () { return reqLog.slice(); };
  function logStart(url) {
    var what = /\/models\?/.test(url) || /\/models$/.test(url.split("?")[0]) ? "list" : "send";
    var m = url.match(/\/models\/([^:?]+):/);
    var entry = { at: new Date().toLocaleTimeString(), what: what, model: m ? decodeURIComponent(m[1]) : "", secs: "…", outcome: "waiting for Google" };
    reqLog.unshift(entry);
    if (reqLog.length > 8) reqLog.length = 8;
    return entry;
  }
  function logRequest(url, started, r, entry) {
    var m = url.match(/\/models\/([^:?]+):/), what = entry.what;
    entry.outcome = r.timeout ? "TIMED OUT" : r.stopped ? "stopped" : r.network ? "no connection" : String(r.status);
    entry.secs = ((Date.now() - started) / 1000).toFixed(1);
    if (r.timeout) dd.errors.record("ai " + what + (m ? " " + decodeURIComponent(m[1]) : ""), "no answer within " + ((Date.now() - started) / 1000).toFixed(0) + " s");
  }

  function request(url, opts, ms, holder) {
    var started = Date.now(), entry = logStart(url);
    var ctl = new AbortController(); current = ctl; inflight.push(ctl);
    if (holder) holder.ctl = ctl;
    var gone = function () { inflight = inflight.filter(function (c) { return c !== ctl; }); };
    var d = ai.drill && drilled(ms, ctl);
    if (d) return d.then(function (r) { logRequest(url, started, r, entry); return r; }).finally(function () { gone(); if (current === ctl) current = null; });
    var timer = setTimeout(function () { ctl.timedOut = true; ctl.abort(); }, ms);
    opts.signal = ctl.signal;
    return fetch(url, opts).then(function (res) {
      return res.text().then(function (t) {
        var body = null; try { body = JSON.parse(t); } catch (e) {}
        return { status: res.status, ok: res.ok, body: body, text: t, headers: res.headers };
      });
    }).catch(function (e) {
      if (ctl.timedOut) return { status: -1, timeout: true };
      if (e && e.name === "AbortError") return { status: -1, stopped: true };
      // Blocked by the hosting website, or really offline? The browser's notice can arrive a
      // moment after the failure, so give it a beat before deciding.
      return new Promise(function (res) { setTimeout(res, 150); }).then(function () {
        if (dd.errors.blockedRecently(url)) return { status: 0, network: true, blocked: true, error: "blocked by this website's security rule" };
        return { status: 0, network: true, error: String(e && e.message || e) };
      });
    }).then(function (r) { logRequest(url, started, r, entry); return r; })
      .finally(function () { gone(); clearTimeout(timer); if (current === ctl) current = null; });
  }

  /* ---------- the Gemini adapter ---------- */
  var adapters = ai.adapters = {};
  adapters.gemini = {
    headers: function (code) { return { "Content-Type": "application/json", "x-goog-api-key": code }; },

    listModels: function (p, code) {
      var all = [];
      function page(token) {
        var url = p.base + "/models?pageSize=200" + (token ? "&pageToken=" + encodeURIComponent(token) : "");
        return request(url, { method: "GET", headers: adapters.gemini.headers(code) }, ai.limits.request).then(function (r) {
          if (!r.ok) throw adapters.gemini.problem(r, "list");
          ((r.body && r.body.models) || []).forEach(function (m) {
            if ((m.supportedGenerationMethods || []).indexOf("generateContent") >= 0) all.push(String(m.name).replace(/^models\//, ""));
          });
          var next = r.body && r.body.nextPageToken;
          return next && all.length < 2000 ? page(next) : all;
        });
      }
      return page(null);
    },

    /* Neutral tools -> Gemini functionDeclarations. `required` goes INSIDE `parameters`. */
    tools: function (tools) {
      if (!tools || !tools.length) return undefined;
      return [{ functionDeclarations: tools.map(function (t) {
        var props = {}, required = [];
        Object.keys(t.params || {}).forEach(function (k) {
          var s = t.params[k], o = { type: s.type || "string" };
          if (s.description) o.description = s.description;
          if (s.enum) o.enum = s.enum;
          if (s.type === "array") o.items = s.items || { type: "string" };
          if (s.type === "object" && s.properties) o.properties = s.properties;
          props[k] = o;
          if (!s.optional) required.push(k);
        });
        var decl = { name: t.name, description: t.description || t.name, parameters: { type: "object", properties: props } };
        if (required.length) decl.parameters.required = required;
        return decl;
      }) }];
    },

    /* Neutral history -> Gemini contents. Model turns are sent back exactly as Google sent
       them (raw parts), which carries any thought signatures newer models require. */
    contents: function (history) {
      var out = [];
      history.forEach(function (h) {
        /* PLATFORM CHANGE (2026-10-13, approved by Oran): a user turn can carry photos
           (h.images = [{mime, data(base64)}]). They go with this request only; nothing here saves them. */
        if (h.role === "user") out.push({ role: "user", parts: [{ text: h.text || "" }].concat((h.images || []).filter(function (im) { return im && im.data; }).map(function (im) {
          return { inlineData: { mimeType: im.mime || "image/jpeg", data: im.data } };
        })) });
        else if (h.role === "model") out.push({ role: "model", parts: (h.raw && h.raw.provider === "gemini") ? h.raw.parts : [{ text: h.text || "" }] });
        else if (h.role === "tool") out.push({ role: "user", parts: h.results.map(function (r) {
          var fr = { name: r.name, response: { result: r.result } };
          if (r.id) fr.id = r.id;   // newer models tag each call with an id; echo it back
          return { functionResponse: fr };
        }) });
      });
      return out;
    },

    send: function (p, code, model, req) {
      var body = { contents: adapters.gemini.contents(req.history) };
      if (req.system) body.systemInstruction = { parts: [{ text: req.system }] };
      var tools = adapters.gemini.tools(req.tools);
      if (tools) body.tools = tools;
      if (req.forceTool) body.toolConfig = { functionCallingConfig: { mode: "ANY", allowedFunctionNames: [req.forceTool] } };
      return request(p.base + "/models/" + encodeURIComponent(model) + ":generateContent",
        { method: "POST", headers: adapters.gemini.headers(code), body: JSON.stringify(body) }, req.ms, req.holder).then(function (r) {
        if (!r.ok) throw adapters.gemini.problem(r, "send");
        var cand = r.body && r.body.candidates && r.body.candidates[0];
        var parts = (cand && cand.content && cand.content.parts) || [];
        var text = "", calls = [];
        parts.forEach(function (pt, i) {
          if (pt.text && !pt.thought) text += pt.text;
          if (pt.functionCall) calls.push({ id: pt.functionCall.id || null, name: pt.functionCall.name, args: pt.functionCall.args || {} });
        });
        if (!parts.length && r.body && r.body.promptFeedback && r.body.promptFeedback.blockReason) text = "";
        return { text: text.trim(), calls: calls, raw: { provider: "gemini", parts: parts.length ? parts : [{ text: "" }] },
                 finish: cand && cand.finishReason };
      });
    },

    /* Turn a failed response into {type, retry, wait, rediscover}. Only a real bad-key reason
       says "bad code" (fixes POC problem #6). */
    problem: function (r, where) {
      if (r.stopped) return { type: "stopped" };
      if (r.timeout) return { type: "timeout" };
      if (r.blocked) return { type: "host_blocked", raw: r.error };
      if (r.network) return { type: "offline", raw: r.error };
      var err = (r.body && r.body.error) || {};
      var msg = String(err.message || r.text || "");
      var status = String(err.status || "");
      var details = JSON.stringify(err.details || "");
      var raw = "HTTP " + r.status + " " + status + " " + msg.slice(0, 300) + " " + details.slice(0, 200);
      var out = { raw: raw, status: r.status };
      var badKey = /API_KEY_INVALID|API key not valid|API key expired|key is missing, invalid|invalid api key/i.test(msg + details);
      if (r.status === 401 || badKey) out.type = "bad_code";
      else if (r.status === 404 || /no longer available|is not found|not supported for generateContent|model_not_found/i.test(msg)) { out.type = "unexpected"; out.rediscover = true; }
      else if (r.status === 403 || /PERMISSION_DENIED|reported as leaked|SERVICE_DISABLED|API_KEY_SERVICE_BLOCKED/i.test(status + msg + details)) out.type = "not_allowed";
      else if (/location is not supported|FAILED_PRECONDITION/i.test(msg + status)) { out.type = "not_allowed"; out.region = true; }
      else if (r.status === 429 || r.status === 402) {
        out.type = "out_of_share";
        // A per-minute limit clears in seconds: wait and retry once. A daily one doesn't.
        var perMinute = /PerMinute|per minute|requests per min/i.test(details + msg) && !/PerDay|per day/i.test(details + msg);
        var m = details.match(/"retryDelay":"(\d+(?:\.\d+)?)s"/);
        if (perMinute) { out.retry = true; out.wait = Math.min(m ? parseFloat(m[1]) * 1000 : 5000, 15000); }
      }
      else if (r.status >= 500 || r.status === 499) { out.type = "busy"; out.retry = true; out.wait = 2500; }
      else out.type = "unexpected";
      return out;
    }
  };

  /* ---------- model choice ---------- */
  function pickModel(conn, force) {
    var p = ai.providers[conn.provider], ad = adapters[p.adapter];
    var all = models(), m = all[conn.provider];
    var stale = !m || !m.checkedAt || Date.now() - m.checkedAt > RECHECK_MS;
    if (m && m.model && !force && !stale && m.order >= 2) return Promise.resolve(m.model);
    return ad.listModels(p, conn.code).then(function (ids) {
      var ranked = ai.rankModels(conn.provider, ids);
      if (!ranked.length) throw { type: "unexpected", raw: "no usable models in list of " + ids.length };
      // Weekly re-check moves to the best model on the list. If it misbehaves, the next
      // call falls back down the candidate list on its own.
      var keep = ranked[0];
      all[conn.provider] = { model: keep, candidates: ranked, checkedAt: Date.now(), order: 3, busy: (m && m.busy) || {} };
      saveModels(all);
      return keep;
    }).catch(function (e) {
      // Quiet weekly re-check failed but we still have a model: keep using it.
      if (m && m.model && !force && !(e && e.type === "bad_code")) return m.model;
      throw e;
    });
  }
  /* Busy models: Google sometimes refuses a model for a while ("high demand", 503) while its
     sister models work fine. We remember a busy model for 10 minutes and use the next one. */
  function firstNotBusy(m) {
    var busy = m.busy || {}, now = Date.now();
    var list = [m.model].concat((m.candidates || []).filter(function (id) { return id !== m.model; }));
    for (var i = 0; i < list.length; i++) if (!(busy[list[i]] > now)) return list[i];
    return m.model;   // everything busy: try the main one anyway
  }
  function markBusy(provider, id) {
    if (ai.drill) return null;   // pretend failures from the test page leave no trace
    var all = models(), m = all[provider]; if (!m) return null;
    m.busy = m.busy || {}; m.busy[id] = Date.now() + BUSY_MS;
    saveModels(all);
    var next = firstNotBusy(m);
    return next !== id ? next : null;
  }
  ai._markBusy = markBusy;

  function nextCandidate(provider, failed) {
    var all = models(), m = all[provider]; if (!m) return null;
    m.candidates = (m.candidates || []).filter(function (id) { return id !== failed; });
    m.model = m.candidates[0] || null; saveModels(all);
    return m.model;
  }

  /* ---------- connect: test a pasted code with ONE REAL TOOL CALL ----------
     (fixes POC problem #7: a code could pass "say ok" and then fail when DigiBot used tools)
     Resolves {ok:true, provider, label} or {ok:false, type, title, help}. */
  ai.connect = function (rawCode, providerId) {
    var code = ai.cleanCode(rawCode);
    if (!code) return Promise.resolve(fail({ type: "bad_code" }, null, "Paste your code first."));
    // Patterns are only a hint for WHICH company. Google decides whether a code is valid:
    // codes change format over time, and we must never refuse a real code on a guess.
    var provider = providerId || ai.detectProvider(code) || ai.defaultProvider;
    if (code.length < 10) {
      dd.errors.record("ai.connect", "pasted text not code-shaped: " + code.length + " characters, starts " + JSON.stringify(code.slice(0, 2)));
      return Promise.resolve(fail({ type: "bad_code" }, null));
    }
    if (!ai.detectProvider(code)) dd.errors.record("ai.connect", "unfamiliar code format (" + code.length + " characters, starts " + JSON.stringify(code.slice(0, 2)) + "), asking " + provider);
    var p = ai.providers[provider], ad = adapters[p.adapter];
    var conn = { provider: provider, code: code };
    pendingCode = code;
    stopped = false;
    var ranked = [], lastProblem = null, started = Date.now(), failed = {};
    return ad.listModels(p, code).then(function (ids) {
      ranked = ai.rankModels(provider, ids);
      if (!ranked.length) throw { type: "unexpected", raw: "no usable models" };
      return tryModels(ranked, 0);
    }).then(function (model) {
      var c = loadConns(); c.main = { provider: provider, code: code, savedAt: new Date().toISOString() };
      var saved = dd.store.setJSON(CONN_KEY, c);
      if (!saved.ok) return fail({ type: saved.reason }, provider);
      dd.store.remove(LEGACY_KEY);
      var all = models(); all[provider] = { model: model, candidates: [model].concat(ranked.filter(function (id) { return id !== model; })), checkedAt: Date.now(), order: 3, busy: failed }; saveModels(all);
      dd.emit("ai:changed", { connected: true, provider: provider });
      return { ok: true, provider: provider, label: p.label };
    }).catch(function (e) { return fail(e, provider); });

    function tryModels(list, i) {
      var left = ai.limits.turn - (Date.now() - started);
      if (i >= list.length || left < 3000) throw lastProblem || { type: "unexpected", raw: "no model passed the tool test" };
      var model = list[i];
      return ad.send(p, code, model, {
        system: "You are a connection test.", ms: Math.min(i < list.length - 1 ? ai.limits.perModel : ai.limits.request, left), forceTool: "confirm_ready",
        history: [{ role: "user", text: "Call confirm_ready with word set to ready." }],
        tools: [{ name: "confirm_ready", description: "Confirms the connection works.", params: { word: { type: "string", description: "Always 'ready'" } } }]
      }).then(function (res) {
        if (res.calls.some(function (c) { return c.name === "confirm_ready"; })) return model;
        lastProblem = { type: "unexpected", raw: model + " answered without using the tool" };
        failed[model] = Date.now() + BUSY_MS;
        return tryModels(list, i + 1);
      }, function (e) {
        // A bad code, no internet or Stop won't get better with another model: stop here.
        if (e.type === "bad_code" || e.type === "offline" || e.type === "host_blocked" || e.type === "stopped" || e.type === "not_allowed" && !e.rediscover) throw e;
        lastProblem = e; failed[model] = Date.now() + BUSY_MS;
        dd.errors.record("ai.connect", model + " " + describe(e) + (list[i + 1] ? ", trying " + list[i + 1] : ""));
        return tryModels(list, i + 1);
      });
    }
  };

  function fail(e, provider, title) {
    if (e && e.raw) dd.errors.record("ai", e.raw);
    var type = (e && e.type) || "unexpected";
    var f = dd.errors.friendly(type === "stopped" ? "unexpected" : type, { company: provider && ai.providers[provider] ? ai.providers[provider].label : undefined });
    if (title) f.title = title;
    if (e && e.region) f.help = "Google's free plan doesn't work in your country yet.";
    if (type === "bad_code" && !provider && !title) f.help = "That doesn't look like a code from Google. Copy it again with Google's Copy button and paste it here.";
    return { ok: false, type: type, stopped: type === "stopped", title: f.title, help: f.help };
  }

  /* ---------- chat: one helper turn, running tools as the model asks ----------
     req = { system, history:[neutral turns], tools:[neutral tools with run(args) ],
             onStatus(fn), onToolCall(call),
             forceTool: "name" (first round must call it), once: true (stop after running the first
             round's tools), hedge: false (never ask a second model while the first is still working) }
     A user turn may carry images: {role:"user", text, images:[{mime, data}]} (2026-10-13).
     Every function call in a reply is run, in order (fixes POC problem #2).
     Resolves { ok, text, history (new turns appended), calls:[...] } or { ok:false, ... }. */
  ai.chat = function (req) {
    var conns = loadConns();
    if (!conns.main) return Promise.resolve(fail({ type: "bad_code" }, null, "The helper needs your free access code first."));
    var conn = conns.main, p = ai.providers[conn.provider], ad = adapters[p.adapter];
    var history = (req.history || []).slice();
    var started = Date.now(), rounds = 0, ran = [], queue = [], tried = {}, lastProblem = null, refreshed = false;
    var status = req.onStatus || function () {};
    stopped = false;

    function left() { return ai.limits.turn - (Date.now() - started); }
    function untried() { return queue.filter(function (id) { return !tried[id]; }); }

    function fatal(e) { return e.type === "stopped" || e.type === "bad_code" || e.type === "offline" || e.type === "host_blocked" || (e.type === "not_allowed" && !e.rediscover); }

    /* Ask `first`; if it stays silent, ask the next model as well (up to 3 at once). The first
       answer wins and the others are cancelled. A model that fails hands over to the next. */
    function race(first) {
      return new Promise(function (resolve, reject) {
        var live = 0, done = false, holders = [], hedge = null;
        var hedgeMs = Math.min(ai.limits.hedge, ai.limits.perModel);
        function finish(fn, v, keep) {
          done = true; clearInterval(hedge);
          holders.forEach(function (h) { if (h !== keep && h.ctl) try { h.ctl.abort(); } catch (e) {} });
          fn(v);
        }
        function go(m) {
          tried[m] = true; live++;
          var h = {}; holders.push(h);
          ad.send(p, conn.code, m, { system: req.system, history: history, tools: req.tools, ms: Math.min(ai.limits.request, left()), model: m, holder: h,
                                     forceTool: rounds === 0 ? req.forceTool : null })
            .then(function (res) { live--; if (!done) finish(resolve, { model: m, res: res }, h); },
                  function (e) {
                    live--; if (done) return;
                    if (fatal(e)) return finish(reject, e);
                    // busy, silent, retired, out of share, refused: note it, hand over
                    lastProblem = e; markBusy(conn.provider, m);
                    var next = untried()[0];
                    if (next && left() > 3000) {
                      status("retrying");
                      dd.errors.record("ai.switch", m + " " + describe(e) + ", trying " + next);
                      go(next);
                    } else if (!live) finish(reject, e);
                  });
        }
        go(first);
        hedge = setInterval(function () {
          if (done || stopped || req.hedge === false) return;   // hedge:false (photos): one model at a time, so a slow answer doesn't cost two requests
          var next = untried()[0];
          if (live < 3 && next && left() > 3000) {
            status("retrying");
            dd.errors.record("ai.switch", "no answer yet after " + (hedgeMs / 1000) + " s, also asking " + next);
            go(next);
          }
        }, hedgeMs);
      });
    }

    function step(model) {
      if (stopped) return Promise.reject({ type: "stopped" });
      if (left() <= 1000) return Promise.reject(lastProblem || { type: "timeout", raw: "turn budget used up" });
      status(rounds ? "working" : "thinking");
      return race(model).then(function (win) {
        var res = win.res; model = win.model;
        history.push({ role: "model", text: res.text, calls: res.calls, raw: res.raw });
        if (!res.calls.length) { rememberWorking(conn.provider, model); return { ok: true, text: res.text, history: history, calls: ran, model: model }; }
        /* PLATFORM CHANGE (2026-10-13): req.once runs the tools the model asked for and stops there, without
           sending the results back: one request instead of two (the free daily share is small). */
        var stopAfter = !!req.once;
        if (++rounds > ai.limits.rounds) { rememberWorking(conn.provider, model); return { ok: true, text: res.text || "", history: history, calls: ran, model: model, cappedRounds: true }; }
        // Run every call in order, collect every result, send them back together.
        var results = [];
        return res.calls.reduce(function (chain, call) {
          return chain.then(function () {
            if (stopped) throw { type: "stopped" };
            var tool = (req.tools || []).filter(function (t) { return t.name === call.name; })[0];
            if (req.onToolCall) try { req.onToolCall(call); } catch (e) {}
            return Promise.resolve(tool ? tool.run(call.args || {}, call) : { ok: false, message: "No tool called " + call.name })
              .catch(function (e) { dd.errors.record("tool:" + call.name, e); return { ok: false, message: "That didn't work." }; })
              .then(function (result) { results.push({ id: call.id, name: call.name, result: result }); ran.push({ name: call.name, args: call.args, result: result }); });
          });
        }, Promise.resolve()).then(function () {
          history.push({ role: "tool", results: results });
          if (stopAfter) { rememberWorking(conn.provider, model); return { ok: true, text: res.text || "", history: history, calls: ran, model: model }; }
          // The next round goes to the model that just answered (it holds the thread), but it
          // may be raced too: tried[] only limits which OTHER models can join.
          tried[model] = false;
          return step(model);
        });
      }, function (e) {
        if (fatal(e)) throw e;
        // Every model we knew about failed. Google may have added new ones: look once.
        if (!refreshed && left() > 5000) {
          refreshed = true;
          return pickModel(conn, true).then(function () {
            queue = modelQueue(conn.provider, req.tier);
            var fresh = untried()[0];
            if (!fresh) throw e;
            dd.errors.record("ai.switch", "all known models failed; new model found: " + fresh);
            return step(fresh);
          });
        }
        throw e;
      });
    }

    return pickModel(conn).then(function () {
      queue = modelQueue(conn.provider, req.tier);
      return step(queue[0]);
    }).catch(function (e) {
      var out = fail(e, conn.provider);
      out.history = history; out.calls = ran; out.tried = Object.keys(tried);
      return out;
    });
  };

  function describe(e) {
    return { busy: "busy", timeout: "no answer", out_of_share: "used up its free share", unexpected: e.rediscover ? "retired" : "refused" }[e.type] || e.type;
  }

  /* Every usable model, in order: the one that last worked first, then the rest by rank,
     with models that recently failed moved to the end (still tried, never skipped). */
  /* PLATFORM CHANGE (2026-10-13, Oran: "DigiBot is slow"): tier "fast" puts the quick Flash-Lite models first
     (plain chat), tier "full" puts the stronger Flash models first (photos). No tier: the order as before.
     Both still fall back to every other model, so a busy family never stops the helper. */
  function modelQueue(provider, tier) {

/* ===== DigiDoughnut Platform · dd.notes — the DigiDoughnut noticeboard =====

   up to date. It can only carry:

     labels      corrected button wording for setup screens        (plain text, short)
     notice      one short message for buyers                      (plain text)
     modelHints  AI models to prefer or avoid                      (model ids)
     codePatterns how to recognise an AI company's code            (pattern text)
   It can NEVER change where codes, numbers or messages are sent: those addresses are built
   into the program. Nothing is sent with the request: no codes, numbers, ids or settings.
   If the file can't be reached, the program works exactly the same with its built-in values.
   The buyer can read this in plain words under "Privacy" in the footer (Oran, 2026-10-06). */

    var wiz = cur.wiz, sc = wiz.screens[cur.at], total = wiz.screens.length;
    remember();
    // A wizard reached from a chooser (wiz.parent) counts the chooser as its step 1.
    var parent = wiz.parent && !hostChoice() ? wiz.parent : null;
    var off = parent ? 1 : 0, shownAt = cur.at + off, shownTotal = total + off;
    var dots = Array.apply(null, Array(shownTotal)).map(function (_, i) { return '<i class="' + (i < shownAt ? "done" : i === shownAt ? "now" : "") + '"></i>'; }).join("");
    var canBack = cur.at > 0 || !!parent;
    var body = typeof sc.body === "function" ? sc.body() : sc.body;
    var html =
      '<div class="dd-wiz-main">' +
      '<button class="dd-wiz-x" data-later aria-label="Close. Your place is saved.">✕</button>' +
      '<div class="dd-wiz-top"><span class="dd-wiz-name"><span class="dd-wiz-icon" aria-hidden="true">' + wizIcon(cur.id) + '</span>' + esc(wiz.title.split(" · ")[0]) +
        (wiz.title.indexOf(" · ") > 0 ? ' <span class="dd-wiz-tag">' + esc(wiz.title.split(" · ")[1]) + '</span>' : "") + '</span>' +
        '<span class="dd-wiz-progress">' + (shownTotal > 1 ? 'Step ' + (shownAt + 1) + ' of ' + shownTotal : '') + '</span></div>' +
      '<div class="dd-wiz-dots">' + dots + '</div>' +
      (cur.context && cur.at === 0 ? '<p class="dd-status show info">' + esc(cur.context) + '</p>' : "") +
      dd.menu.headHtml({ title: (typeof sc.title === "function" ? sc.title() : sc.title) }) +
      (sc.pic ? setup.pic(typeof sc.pic === "function" ? sc.pic() : sc.pic) : "") +
      (sc.todo ? '<p class="dd-todo"><span aria-hidden="true">👉</span> <b>Your turn:</b> ' + (typeof sc.todo === "function" ? sc.todo() : esc(sc.todo)) + '</p>' : "") +
      '<div class="dd-wiz-body">' + body + '</div>' +
      (sc.action ? '<div class="dd-btnrow"><button class="dd-btn dd-wiz-big" data-action data-autofocus>' + esc(sc.action.label) + '</button></div>' : "") +
      '<div class="dd-status" id="dd-wiz-status"></div>' +
      '<div class="dd-wiz-nav">' +
        (canBack ? '<button class="dd-btn ghost" data-back>Back</button>' : "") +
        (sc.next !== false ? '<button class="dd-btn" data-next' + (sc.action ? '' : ' data-autofocus') + '>' + esc(sc.nextLabel || "Next") + '</button>' : "") +
      '</div>' +
      '<div class="dd-wiz-help">' +
        '<button class="dd-linkbtn" data-stuck>I\'m stuck</button>' +
        (canBack ? '<button class="dd-linkbtn" data-over>Start over</button>' : "") +
        '<button class="dd-linkbtn" data-later>Finish later</button>' +
      '</div>' +
      '<div class="dd-wiz-stuck" id="dd-wiz-stuck" hidden></div>' +
      '</div>' +
      // The helper chat: a column beside the steps on computers; on phones a 💬 Ask button opens it.
      '<aside class="dd-wiz-ask' + (chatOpen ? " open" : "") + '" id="dd-wiz-ask" aria-label="Helper chat"></aside>' +
      '<button class="dd-ask-fab" data-askfab aria-label="Ask the helper a question"><span aria-hidden="true">💬</span> Ask</button>';
    // Setup no longer lives on the page, so the way back is always the menu (audit 2026-10-09).
    var later = function () {
      dd.ui.closeSheet();
      dd.ui.toast("Saved. To pick up here: menu (" + program.name + ", top left) → ⚙️ Settings → Setup & connections.", 4500);
    };
    var sh = dd.ui.sheet(html, { sticky: true, onClose: function () { setup.paint(); }, onEscape: later,
      onOutside: function () { dd.ui.toast("To close this, tap Finish later or ✕. Your place is saved."); } });
    sh.classList.add("dd-wiz");

    var q = function (sel) { return sh.querySelector(sel); };
    if (q("[data-back]")) q("[data-back]").addEventListener("click", function () { if (cur.at > 0) { cur.at--; draw(); } else toParent(); });
    if (q("[data-over]")) q("[data-over]").addEventListener("click", function () { if (parent) toParent(); else { cur.at = 0; draw(); } });
    sh.querySelectorAll("[data-later]").forEach(function (b) { b.addEventListener("click", later); });
    if (q("[data-action]")) q("[data-action]").addEventListener("click", function () { sc.action.run(ctxFor(sh)); });
    if (q("[data-next]")) q("[data-next]").addEventListener("click", function () { next(sh); });
    q("[data-stuck]").addEventListener("click", function () { toggleStuck(sh, sc); });
    mountChat(sh);
    var fab = sh.querySelector("[data-askfab]"), aside = sh.querySelector("#dd-wiz-ask");
    fab.addEventListener("click", function () {
      chatOpen = !aside.classList.contains("open"); aside.classList.toggle("open", chatOpen);
      if (chatOpen) { var i = aside.querySelector("#dd-ask-in"); if (i) i.focus(); }
    });
    if (sc.mount) sc.mount(ctxFor(sh));
  }

  /* Leave a sub-wizard for its chooser (e.g. pick a different service). Its place is forgotten. */
  function toParent() {
    var s = state(), parent = cur.wiz.parent; delete s.wizards[cur.id]; s.hostWith = null; saveState(s);
    setup.open(parent);
  }

  /* The same icon as the step's row in Setup & connections, so it's always clear which step you're in. */
  function wizIcon(id) { var st = setup.steps.filter(function (x) { return x.wizard === id || (x.wizard === "host" && /^host/.test(id)); })[0]; return st ? st.icon : "✨"; }

  function ctxFor(sh) {
    return {
      el: sh, status: function (kind, title, help) { dd.ui.status(sh.querySelector("#dd-wiz-status"), kind, title, help); },
      next: function () { next(sh, true); }, open: function (url) { window.open(url, "_blank", "noopener"); }
    };
  }

  function next(sh, skipCheck) {
    var sc = cur.wiz.screens[cur.at];
    var go = function () {
      if (cur.at < cur.wiz.screens.length - 1) { cur.at++; draw(); }
      else { finish(); dd.ui.closeSheet(); setup.paint(); if (cur.wiz.onDone) cur.wiz.onDone(); }
    };
    if (skipCheck || !sc.check) return go();
    var c = ctxFor(sh);
    var btn = sh.querySelector("[data-next]"); if (btn) btn.disabled = true;
    Promise.resolve(sc.check(c)).then(function (ok) { if (btn) btn.disabled = false; if (ok) go(); });
  }

  /* "I'm stuck": common fixes for THIS screen, plus a link to the picture guide. */
  function toggleStuck(sh, sc) {
    var box = sh.querySelector("#dd-wiz-stuck");
    box.hidden = !box.hidden;
    if (box.hidden) return;
    var fixes = (sc.stuck || []).concat(["Close this and tap Continue later. Your place is saved.", "Nothing you do here can break the program. Every step can be done again."]);
    var guide = sc.guide ? link("guide_" + sc.guide, null) : null;
    box.innerHTML = "<b>Things that usually help:</b><ul>" + fixes.map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("") + "</ul>" +
      (guide ? '<p><a href="' + esc(guide) + '" target="_blank" rel="noopener">See this step with pictures</a></p>' : "");
  }

  /* ---------- "Ask a question": scripted guide first, live AI once the code works ---------- */
  /* The helper chat sits at the bottom of every setup screen, always open (Oran, 2026-10-07):
     ready-made answers before the code works, the live AI after. The conversation carries on
     from screen to screen while the page is open. */
  var chatLog = [], chatOpen = false;
  function mountChat(sh) {
    var box = sh.querySelector("#dd-wiz-ask"), live = dd.ai && dd.ai.hasCode();
    box.innerHTML = '<button class="dd-chat-hide" data-chathide aria-label="Hide the chat">Hide</button>' +
      '<div class="dd-chat-head"><span aria-hidden="true">💬</span> <b>' + (live ? "Ask " + (dd.helper && dd.helper.enabled() ? dd.helper.name() : "the helper") : "Questions? Ask the setup guide") + '</b>' +
        '<span class="dd-note">' + (live ? " The AI helper answers." : " Ready-made answers; the AI helper takes over once your code is connected.") + '</span></div>' +
      '<div class="dd-ask-msgs" id="dd-ask-msgs"></div>' +
      '<div class="dd-ask-row"><input class="dd-input" id="dd-ask-in" placeholder="' + (live ? "Ask anything about this step…" : "e.g. Is it really free?") + '" autocomplete="off"><button class="dd-btn small" id="dd-ask-go">Ask</button></div>' +
      (chatLog.length ? "" : '<div class="dd-ask-chips">' + setup.suggestQuestions(cur.id).map(function (t) { return '<button class="dd-chip">' + esc(t) + '</button>'; }).join("") + '</div>');
    chatLog.slice(-6).forEach(function (m) { say(box, m.who, m.text, true); });
    box.querySelector("[data-chathide]").addEventListener("click", function () { chatOpen = false; box.classList.remove("open"); });
    var input = box.querySelector("#dd-ask-in"), go = box.querySelector("#dd-ask-go");
    var send = function (text) {
      text = (text || input.value).trim(); if (!text || go.disabled) return;
      input.value = "";
      var chips = box.querySelector(".dd-ask-chips"); if (chips) chips.remove();
      say(box, "me", text);
      var wait = (dd.ai && dd.ai.hasCode()) ? say(box, "bot pending", "The helper is thinking…", "pending") : null;
      go.disabled = true;
      setup.answer(text, cur).then(function (a) {
        if (wait) wait.remove();
        go.disabled = false;
        say(box, a.live ? "bot live" : "bot", a.text);
      });
    };
    go.addEventListener("click", function () { send(); });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });
    box.querySelectorAll(".dd-chip").forEach(function (c) { c.addEventListener("click", function () { send(c.textContent); }); });
  }
  function say(box, who, text, noLog) {
    if (!noLog) { chatLog.push({ who: who, text: text }); if (chatLog.length > 30) chatLog.shift(); }
    var m = document.createElement("div"); m.className = "dd-ask-msg " + who;
    m.textContent = text; box.querySelector("#dd-ask-msgs").appendChild(m);
    if (noLog !== true) m.scrollIntoView({ block: "nearest" });   // not when restoring the chat on a new screen
    return m;
  }

  /* Returns Promise<{text, live}>. Live AI when a code works; otherwise (or if the AI fails)
     the scripted answer. The scripted guide never pretends to be the AI. */
  setup.answer = function (question, where) {
    var scripted = setup.scriptedAnswer(question, where && where.id);
    if (!(dd.ai && dd.ai.hasCode())) return Promise.resolve({ text: scripted || setup.noMatch, live: false });
    var wiz = where && where.wiz, sc = wiz && wiz.screens[where.at];
    var context = "The buyer is in the '" + (wiz ? wiz.title : "setup") + "' wizard, on step " + (where ? where.at + 1 : "?") +

    return dd.ai.chat({ system: setup.helperPrompt() + "\n\n" + context, history: [{ role: "user", text: question }], tier: "fast" }).then(function (r) {
      if (r.ok && r.text) return { text: r.text, live: true };
      return { text: scripted || "The helper can't answer right now (" + r.title.replace(/\.$/, "") + "). " + setup.noMatch, live: false };
    });

      (cur && /^host/.test(cur.id) ? " Hosting facts: the program is ONE self-contained HTML file. It must be uploaded unchanged, keeping its file name, to an https address, " +

  setup.suggestQuestions = function (wizardId) {

    if (/^host/.test(wizardId || "")) return ["Is it really free?", "Do I need the free trial?", "How long does it stay online?"];
    return wizardId === "sync" ? ["Which region?", "Locked or test mode?", "Where's the setup code?"]
                               : ["Is it really free?", "Do I need a credit card?", "What if I make a mistake?"];
  };
  /* Best keyword match. Answers written for one wizard ("for") win inside it and lose elsewhere. */
  setup.scriptedAnswer = function (q, wizardId) {
    var wid = wizardId || (cur && cur.id) || "";
    var t = " " + String(q).toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ") + " ";
    var best = null, bestScore = 0;
    setup.bank.forEach(function (e) {
      var score = 0;
      e.keys.forEach(function (k) { if (t.indexOf(" " + k + " ") >= 0 || (k.length > 4 && t.indexOf(k) >= 0)) score += k.split(" ").length; });
      if (score > 0 && e.for) score += e.for.test(wid) ? 2 : -100;
      if (score > bestScore) { bestScore = score; best = e; }
    });
    if (!best) return null;
    return best.a.replace("My Program", "My " + (program ? program.name : "Program"));
  };

  /* ---------- pictures: a tiny moving drawing on every wizard screen ----------
     Oran (2026-10-07): "think of this like a children's book". Each screen can show a little
     mock of the page the buyer is about to see, with the thing to do highlighted and a
     pointing hand that taps it, a box that types itself, a code that gets copied, and so on.
     Pure HTML + CSS (no images), labels from the same wording as the text, so they never
     disagree. Motion stops for people who ask their device to reduce motion.
       spec = { kind, site, items:[…], btn, … }  (see each kind below) */
  function hand() { return '<span class="dd-pic-hand" aria-hidden="true">👆</span>'; }
  function tapBtn(label, delay) {
    return '<span class="dd-pic-target" style="--d:' + (delay || 0) + 's"><span class="dd-pic-btn">' + esc(label) + '</span>' + hand() + '</span>';
  }
  function frame(site, inner) {
    return '<div class="dd-pic-frame"><div class="dd-pic-bar"><i></i><i></i><i></i><span>' + esc(site || "") + '</span></div><div class="dd-pic-page">' + inner + '</div></div>';
  }
  function item(it, i) {
    var d = (0.5 + i * 0.6).toFixed(1) + "s";

  /* ---------- "Put it on your phone": the buyer's own copy ----------
     The program file has to be online before a phone can open it. Offered (checked with Oran
     2026-10-07): GitHub Pages (recommended), tiiny.host (1 project per free account, small banner,
     log in every 3 months, a "Start your free trial" popup whose way out is "Skip"; "Upload file",
     "Update"), or the buyer's own host. Each wizard's last steps carry the code + numbers from the
     file to the new address in one link (dd.pair), then bookmark it (the page title is the
     bookmark name). */
  function fileName() {
    try { return decodeURIComponent(location.pathname.split("/").pop()) || "the program file"; } catch (e) { return "the program file"; }
  }
  function hostState(v) { var s = state(); if (v !== undefined) { s.hostUrl = v; saveState(s); } return s.hostUrl || ""; }

  setup.hostInProgress = function (svc) { return !!state().wizards["host_" + svc]; };
  setup.startHost = function (svc) { var s = state(); s.hostWith = svc; saveState(s); setup.open("host_" + svc); };
  setup.fileName = fileName;   // the buyer's own copy, remembered from the host wizards (or pasted in Move)
  /* Tidy a pasted address. Returns a full https address, or null if it isn't one. */
  setup.cleanAddress = function (raw) {
    var t = String(raw || "").trim().replace(/^["'<]+|["'>]+$/g, "");
    if (!t) return null;
    if (!/^[a-z]+:\/\//i.test(t)) t = "https://" + t;
    try {
      var u = new URL(t);
      if (u.protocol !== "https:" && u.protocol !== "http:") return null;
      if (!/\./.test(u.hostname) || /\s/.test(t)) return null;
      u.hash = "";
      return u.href;
    } catch (e) { return null; }
  };

     from a branch" > main > Save; live within ~10 minutes. Logged-out sign-up screens NOT yet
     seen: labels go through L() so the noticeboard can correct them. */
  function ghUser() { return (state().ghUser || "").toLowerCase(); }
  /* A GitHub username (or a pasted github.io address) -> where this file will be.
     Repository name: "digidoughnut" by default, so the address is
     https://<user>.github.io/digidoughnut/<file>. (A repository named exactly <user>.github.io
     would drop the folder, but buyers find that name confusing: Oran named his "etsy".) Any
     repository on the same account shares one web address, so programs still share the code. */
  setup.ghDefaultRepo = "digidoughnut";
  setup.githubAddress = function (user, repo) {
    var raw = String(user || "").trim();
    var m = raw.match(/^(?:https?:\/\/)?([a-z0-9-]+)\.github\.io\/?([^\/?#]*)/i);
    if (m) { user = m[1]; repo = repo || m[2] || (m[1] + ".github.io"); }
    else user = raw.toLowerCase().replace(/^@/, "").replace(/^https?:\/\//, "").replace(/^github\.com\//, "").replace(/\/.*$/, "");
    user = String(user).toLowerCase();
    if (!/^[a-z0-9](?:[a-z0-9]|-(?=[a-z0-9])){0,38}$/.test(user)) return null;
    repo = String(repo || state().ghRepo || setup.ghDefaultRepo).replace(/^\/+|\/+$/g, "");
    var root = repo.toLowerCase() === user + ".github.io";
    return { user: user, repo: repo, url: "https://" + user + ".github.io/" + (root ? "" : encodeURIComponent(repo) + "/") + encodeURIComponent(fileName()) };

  /* true = answers, false = not there yet (404), null = couldn't tell. GitHub Pages lets other
     pages read its answers, so a plain request shows whether the file is online yet. */
  setup.isLive = function (url) {
    var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, 8000);
    return fetch(url, { method: "GET", cache: "no-store", credentials: "omit", signal: ctl.signal })
      .then(function (r) { return r.ok ? true : (r.status === 404 ? false : null); }, function () { return null; })
      .finally(function () { clearTimeout(t); });
  };

/* ===== DigiDoughnut Platform · dd.files — "Add a file" (first product, 2026-10-08) =====
   The first real product (the Etsy pricing tool) needed to read a seller's Etsy downloads, so
   every program can now take a file in, three ways, all handled here:
     1. Menu → "📂 Add a file" (a sheet with a big drop area and the program's how-to)
     2. The 📎 button in the helper's chat, or dropping a file onto the chat
     3. The program's own drop area: dd.files.dropZone(el)
   Files are read on this device only. Nothing is uploaded: the program keeps what it needs and the
   file itself is never stored.

   Program contract (optional):
     files: {
       accept:  ".csv"                       what the file picker offers
       label:   "your Etsy download"          used in wording ("Add your Etsy download")
       howTo:   "<p>…</p>"                     short HTML shown in the Add a file sheet

     }

   September."). A file over MAX_BYTES is refused with a friendly line, never read.
   Photos (2026-10-13): files.images: true hands pictures to take(file, image, ctx) as a shrunk JPEG
   ({dataUrl, mime, data, width, height}); imageSize sets the longest side (default 1024 px).
   take() may answer {ok, message, quiet: true}: the helper then doesn't follow up with "What stands out?".

   Helpers for programs: dd.files.parseCSV(text) -> rows (arrays), dd.files.table(text) ->
   [{header: value}], dd.files.number("CA$1,234.50") -> 1234.5. */

  // a byte-order mark at the start. Also takes ; or tab when the first line clearly uses them.

    var sep = ",";
    if (first.indexOf(",") < 0) { if (first.indexOf("\t") >= 0) sep = "\t"; else if (first.indexOf(";") >= 0) sep = ";"; }
    var rows = [], row = [], field = "", q = false, i = 0, n = text.length, c;
    while (i < n) {
      c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i += 2; continue; } q = false; i++; continue; }
        field += c; i++; continue;
      }
      if (c === '"' && field === "") { q = true; i++; continue; }
      if (c === sep) { row.push(field); field = ""; i++; continue; }
      if (c === "\r") { i++; continue; }
      if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
      field += c; i++;

    if (field !== "" || row.length) { row.push(field); rows.push(row); }

  };

/* ===== DigiDoughnut Platform · dd.brand — the look: banner, colours, logo (2026-10-08) =====
   Oran: "the top banner looks sterile… let the customer pick the accent colours to match their
   branding, and link their store banner image and use it in the app's banner."

   - A banner at the top of every program (#dd-hero). Out of the box it's DigiDoughnut's own
     placeholder look: the program's colours, sprinkles, the program's name. The buyer can make it
     theirs: their Etsy shop banner (a link, "Copy image address"), their shop icon, their shop name,
     and two colours (main + second) picked from presets or any colour.
   - The DigiDoughnut logo sits in the footer (embedded at build time as DD_LOGO, no outside image).
   - The look is saved INSIDE the program's data as data.brand, so it syncs to the buyer's other
     devices, travels with Send to my phone and goes into backups. Programs never see it: their
     validateData ignores keys they don't know, and dd.migrateData carries it through upgrades.
     Changing the look never ends "example mode" (it uses replaceData with the same example flag).
   - Every value is checked before use: colours are #rrggbb, pictures are https links only. A
     picture is only ever shown as a picture (CSS background or <img>), never run.
   - The main colour is darkened if needed so white text on buttons stays readable (4.5:1). */
(function () {
  "use strict";
  var dd = window.dd = window.dd || {};
  var brand = dd.brand = {};
  var program = null;
  var esc = function (s) { return dd.ui.esc(s); };

  /* Ready-made colour pairs: [name, main, second]. The first is filled in with the program's own. */
  brand.PRESETS = [
    ["Sprinkle pink", "#db2777", "#f59e0b"],
    ["Terracotta", "#c2410c", "#f59e0b"],
    ["Berry", "#9d174d", "#7c3aed"],
    ["Lavender", "#6d28d9", "#ec4899"],
    ["Ocean", "#0369a1", "#06b6d4"],
    ["Sage", "#3f6212", "#84cc16"],
    ["Forest", "#166534", "#ca8a04"],
    ["Sunny", "#b45309", "#facc15"],
    ["Charcoal", "#374151", "#9ca3af"],
    ["Midnight", "#1e3a8a", "#f472b6"]

  /* ---------- colour helpers ---------- */
  var HEX = /^#[0-9a-f]{6}$/i;
  function rgb(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
  function hex(a) { return "#" + a.map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return (v < 16 ? "0" : "") + v.toString(16); }).join(""); }

    var c = rgb(h).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];

    var out = h, i = 0;
    while (brand.contrast(out, "#ffffff") < 4.5 && i++ < 40) out = hex(rgb(out).map(function (v) { return v * 0.92; }));
    return out;
  };

  /* ---------- what's saved ---------- */
  function httpsLink(v) {

  }
  brand.httpsLink = httpsLink;
  /* A clean copy of a saved look: anything unexpected is dropped. */
  brand.clean = function (b) {
    b = b && typeof b === "object" ? b : {};
    var out = {};
    if (typeof b.shop === "string") out.shop = b.shop.trim().slice(0, 60);
    ["banner", "logo"].forEach(function (k) { var u = httpsLink(b[k]); if (u) out[k] = u; });
    ["accent", "accent2"].forEach(function (k) { if (HEX.test(b[k] || "")) out[k] = b[k].toLowerCase(); });
    if (typeof b.text === "boolean") out.text = b.text;
    if (typeof b.hidden === "boolean") out.hidden = b.hidden;
    if (typeof b.hideEdit === "boolean") out.hideEdit = b.hideEdit;

  };
  brand.get = function () { var d = dd.getData && dd.getData(); return brand.clean(d && d.brand); };

/* ---- dd.sync.js ---- */
/* ===== DigiDoughnut Platform · dd.sync — live sync between devices =====
   Phase 5 (Oran, 2026-10-07). Live sync through the buyer's OWN free Firebase project.

   Decisions:
   - Firebase Realtime Database + Firebase Authentication "Anonymous" sign-in (Oran chose this
     over open rules: open rules make Google email the buyer an "insecure rules" warning).
     The real lock is still the long secret ledger id; signing in keeps the scanners quiet and
     turns away drive-by visitors.
   - The setup code (firebaseConfig) is SHARED by every program on the same web address
     (dd_firebase_config_v1): one Firebase project holds all of a buyer's programs. Each program
     keeps its own ledger: /sync/<program>/<ledger id>, ledger id = 128-bit random (32 hex).
   - Each item travels as ONE sealed piece of text (its JSON). Firebase drops empty values and
     mangles lists; a sealed item comes back exactly as it went in, and comparing two versions
     of an item is a plain text comparison.

   What's stored (one ledger):
     meta/v = 1, meta/schema = program.schemaVersion
     lists/<name>/order        "o:" + item ids joined by ","   (never empty, so empty lists survive)
     lists/<name>/items/<id>   JSON text of one item
     fields/<key>              JSON text of any other top-level value
   By default every top-level array whose items all have a string `id` is a list; everything
   else is a field (last change wins). Programs with odd data can give sync: {toParts, fromParts}
   or sync: false.

   How changes move (the POC engine, made three-way):
   - base = what we believe the database holds, kept on this device (dd_<id>_sync_base_v1), so a
     change made offline survives a reload.
   - A local change: 700 ms later, push only the paths that differ from base.
   - A remote snapshot: for each path, if this device didn't change it since base, take the
     remote one; if it did, keep ours (and push it). First join (no base yet): union by id,
     the database wins on the same id.
   - Echoes of our own pushes match what we have, so nothing happens. Example data never travels.
*/
(function () {
  "use strict";
  var dd = window.dd = window.dd || {};
  var sync = dd.sync = {};

  sync.sdkVersion = "12.19.0";   // 13.0.0 came out 2026-10-07; stay on the last 12.x until it settles
  sync.sdkBase = function () { return "https://www.gstatic.com/firebasejs/" + sync.sdkVersion + "/"; };
  sync.limits = { debounce: 700, connect: 20000 };   // tests may shrink these

  var CONFIG_KEY = "dd_firebase_config_v1";

  /* The rules the buyer pastes into Firebase (Realtime Database, Rules tab). Only a signed-in copy
     of a program may read or write, and only inside /sync/<program>/<32-character ledger>. Nothing
     else in the database can be read. Kept short on purpose (Oran, 2026-10-07): buyers paste it,
     and the program checks the data's shape itself (validateData) before using anything. */
  sync.rules = JSON.stringify({ rules: { sync: { "$program": { "$ledger": {
    ".read": "auth != null && $ledger.length == 32",
    ".write": "auth != null && $ledger.length == 32"
  } } } } }, null, 2);
  var program = null, fb = null, app = null, db = null;
  var ledgerRef = null, unsubs = [], pushTimer = null, starting = null;
  var base = null, pend = {}, stamps = {}, timeOffset = 0, needFresh = false, pendSeq = 0, events = 0, connectedNow = false, resumeAfterPair = false;
  var state = "off";   // off | connecting | on | problem | newer
