      // Offline: DON'T hand Firebase a write to send blindly on reconnect (it would overwrite a newer
      // edit from the other device). Keep the change here; on reconnect we read the database first,
      // merge by edit time, then send what's left.
      Object.keys(u).forEach(function (p) { stamp(p, local[p]); pend[p] = "held"; });
      saveBase(); paint();
      return;
    }
    var seq = ++pendSeq;
    Object.keys(u).forEach(function (p) {
      pend[p] = seq; stamp(p, local[p]);
      u["times/" + tkey(p)] = stamps[p].t;
    });
    base = local; saveBase();
    diag.pushes++;
    fb.D.update(ledgerRef, u).then(function () {
      Object.keys(u).forEach(function (p) { if (pend[p] === seq) delete pend[p]; });
      saveBase(); diag.acked++; diag.lastPush = now(); paint();
    }, function (e) { var t = fail("saving", e); setProblem(t); if (t === "sync_rules") sync.start(); });   // pend keeps the change, so it's sent again
    paint();
  }

  /* Read the ledger from the database now (after reconnecting), then merge and send. */
  function refresh() {
    if (!ledgerRef || !fb.D.get) return;
    needFresh = true;
    var r = ledgerRef, at = events + ":" + pendSeq;
    // Ignore the answer if anything moved meanwhile (a live update came in, or we sent something):
    // it would be older than what we already have, and would undo our own change here.
    fb.D.get(r).then(function (snap) { if (r === ledgerRef && at === events + ":" + pendSeq) { diag.remote++; diag.lastRemote = now(); onRemote(snap.val()); paint(); } },
      function (e) { fail("re-reading", e); });
  }

  /* ---------- the QR: the phone joins on scan ---------- */
  var arrived = null;
  if (dd.pair) {
    dd.pair.register({
      key: "s", label: "live sync",
      give: function () { return sync.isOn() && ledger() ? ledger() : undefined; },
      take: function (v) {
        if (!/^[0-9a-f]{32}$/.test(String(v))) return false;
        arrived = arrived || {}; arrived.ledger = v; return true;
      }
    });
    dd.pair.register({
      key: "f", label: "sync setup", hidden: true,
      give: function () { var c = sync.config(); return sync.isOn() && c ? strip(c) : undefined; },
      take: function (v) {
        var c = v && typeof v === "object" ? sync.parseConfig(JSON.stringify(v)) : null;
        if (!c) return false;
        arrived = arrived || {}; arrived.config = c; return true;
      }
    });
  }
  function joinFromPair() {
    var a = arrived; arrived = null;
    if (!a || !a.ledger || !a.config || !program) {
      if (resumeAfterPair) { resumeAfterPair = false; if (wasOn() && sync.config()) { diag.resumed = "yes"; sync.start(); } }
      return;
    }
    resumeAfterPair = false;
    sync.join(a.ledger, a.config).then(function (r) {
      if (r.ok) dd.ui.toast("Live sync is on. This phone and your computer are synced.", 4000);
      else dd.ui.notice("sync", r.title + " " + r.help, "warn");
    });
  }

  /* ---------- the little status chip in the header ---------- */
  function paint() {
    var slot = document.getElementById("dd-top-slot"); if (!slot) return;
    var chip = document.getElementById("dd-sync-chip");
    // Always shown, "Sync off" too (audit 2026-10-08, #17): the off state is a fact the buyer
    // should see, and tapping it explains sync and offers to set it up.
    if (!chip) {
      chip = document.createElement("button"); chip.id = "dd-sync-chip"; chip.className = "dd-sync-chip";
      chip.addEventListener("click", function () { sync.openSheet(); });
      slot.appendChild(chip);
    }
    var pending = !!pushTimer, s = sync.status();
    chip.className = "dd-sync-chip " + s.kind + (pending ? " busy" : "");
    chip.innerHTML = '<i aria-hidden="true"></i>' + dd.ui.esc(s.short);
    chip.title = s.long;
  }
  /* {kind: ok|wait|bad|off, short, long} in plain words */
  sync.status = function () {
    if (state === "connecting") return { kind: "wait", short: "Connecting…", long: "Connecting to your Firebase database." };
    if (state === "on" && connectedNow) return { kind: "ok", short: "Synced", long: "Live sync is on. Changes go to your other devices straight away." };
    if (state === "on") return { kind: "wait", short: "Offline", long: "Can't reach your database right now. Your changes are kept here and go across when you're back online." };
    if (state === "newer") { var n = dd.errors.friendly("sync_newer"); return { kind: "bad", short: "Update needed", long: n.title + " " + n.help }; }
    if (state === "problem") { var f = dd.errors.friendly(problem, { company: "Firebase" }); return { kind: "bad", short: "Not syncing", long: f.title + " " + f.help }; }
    return { kind: "off", short: "Sync off", long: "Live sync is off, so changes made here stay on this device. Tap to set it up." };
  };

  /* The sheet behind the chip (also Setup step 4's "Change"). */
  sync.openSheet = function () {
    var s = sync.status(), on = sync.isOn(), cfg = sync.config();
    var sh = dd.ui.sheet(dd.menu.headHtml({ title: "Live sync", icon: "🔄" }) +
      '<p class="dd-status show ' + (s.kind === "ok" ? "ok" : s.kind === "bad" ? "err" : "info") + '">' + dd.ui.esc(s.long) + '</p>' +
      (cfg ? '<p class="dd-note">Your database: <b>' + dd.ui.esc(cfg.projectId) + '</b></p>' : "") +
      (on ? '<p class="dd-note">☁️ <b>Backed up to the cloud.</b> Your ' + dd.ui.esc(program.dataLabel || "numbers") + ' are kept in your own Firebase database too, so clearing the browser or losing a device doesn\'t lose them. It\'s a live copy: a deletion is deleted there too, so keep a backup file now and then for a dated copy.</p>' : "") +
      '<div class="dd-btnrow">' +
        (on && dd.pair && !dd.env.isPhone ? '<button class="dd-btn" data-phone>📲 Add my phone</button>' : "") +
        (on ? (s.kind !== "ok" ? '<button class="dd-btn ghost" data-retry>Try again now</button>' : "") + '<button class="dd-btn ghost" data-off>Turn off on this device</button>'
            : (cfg ? '<button class="dd-btn" data-on>Turn it on</button>' : '<button class="dd-btn" data-setup>Set it up</button>')) +
        (dd.backup ? '<button class="dd-btn ghost" data-backup>💾 Backup &amp; new versions</button>' : "") +
        '<button class="dd-btn ghost" data-close>Close</button></div>' +
      '<p class="dd-note">Turning it off keeps everything on this device. Your other devices carry on as before.' +
        (on ? ' While it\'s on, your own database holds a live copy, so a new version of the program picks everything up by itself.' : "") + '</p>');
    var q = function (s) { return sh.querySelector(s); };
    q("[data-close]").addEventListener("click", dd.ui.closeSheet);
    if (q("[data-backup]")) q("[data-backup]").addEventListener("click", function () { dd.ui.closeSheet(); dd.backup.open(); });
    if (q("[data-phone]")) q("[data-phone]").addEventListener("click", function () { dd.ui.closeSheet(); dd.pair.open(); });
    if (q("[data-off]")) q("[data-off]").addEventListener("click", function () { sync.stop(); dd.ui.closeSheet(); dd.ui.toast("Live sync is off on this device."); });
    if (q("[data-retry]")) q("[data-retry]").addEventListener("click", function () { dd.ui.closeSheet(); sync.start(); });
    if (q("[data-on]")) q("[data-on]").addEventListener("click", function () { dd.ui.closeSheet(); sync.start().then(function (r) { if (!r.ok) dd.ui.notice("sync", r.title + " " + r.help, "warn"); }); });
    if (q("[data-setup]")) q("[data-setup]").addEventListener("click", function () { dd.ui.closeSheet(); dd.setup.open("sync"); });
  };

  /* ---------- start with the program ---------- */
  sync.attach = function (p) {
    program = p;
    if (p.sync === false) return;
    dd.on("change", function (ev) {
      if (!ev || ev.source === "sync") return;
      if (state === "on") { schedulePush(); paint(); }
    });
    dd.on("pair:received", joinFromPair);
    // Phones pause pages in the background. Coming back: reconnect at once rather than waiting for
    // Firebase's own retry, and restart if it had given up.
    function back() {
      if (document.visibilityState && document.visibilityState !== "visible") return;
      if (state === "on" && db && fb && fb.D.goOnline) try { fb.D.goOnline(db); } catch (e) {}
      else if (state === "problem" && wasOn() && sync.config()) sync.start();
    }
    document.addEventListener("visibilitychange", back);
    window.addEventListener("pageshow", function (e) { if (e.persisted) back(); });
    window.addEventListener("online", function () { if (wasOn() && state === "problem" && problem === "sync_offline") sync.start(); });
    // An AI agent's link joins its ledger straight away (dd.agent reads it, never expires).
    var al = dd.agent && dd.agent.readLink ? dd.agent.readLink() : null;
    if (al) { sync.join(al.s, al.f).then(function (r) { if (!r.ok) dd.ui.notice("sync", r.title + " " + r.help, "warn"); }); return; }
    // A pairing link in the address is read just after this; it may bring a different ledger.
    if (/[#&]dd=/.test(location.hash)) { resumeAfterPair = true; paint(); }
    else if (wasOn() && sync.config()) { diag.resumed = "yes"; sync.start(); }
    else paint();
  };

  if (dd.diag) dd.diag.addSection("Sync", function () {
    if (!program) return ["-"];
    var cfg = sync.config(), id = ledger();
    return [
      "State: " + state + (problem ? " (" + problem + ")" : "") + " · remembered on: " + (wasOn() ? "yes" : "no") + " · resumed on load: " + diag.resumed,
      "Database: " + (cfg ? cfg.projectId + " · " + String(cfg.databaseURL).replace(/^https:\/\//, "") + (cfg.guessedURL ? " (address guessed)" : "") : "none") +
        " · SDK " + sync.sdkVersion + " · signed in: " + diag.signedIn + (diag.reauths ? " (signed in again " + diag.reauths + "x)" : "") + " · connected: " + (connectedNow ? "yes" : "no"),
      "Ledger: " + (id ? id.slice(0, 6) + "…" : "-") + " · joined: " + diag.joined + " · base kept: " + (base ? Object.keys(base).length + " paths" : "none"),
      "Pushes sent / confirmed: " + diag.pushes + " / " + diag.acked + " · last confirmed: " + diag.lastPush + (pushTimer ? " · a change is waiting to go" : "") +
        " · unconfirmed: " + Object.keys(pend).length,
      "Remote updates: " + diag.remote + " · applied: " + diag.applied + " · last: " + diag.lastRemote,
      "Last sync problem: " + diag.lastError
    ];
  });
})();

/* ---- dd.backup.js ---- */
/* ===== DigiDoughnut Platform · dd.backup — download a backup, restore from one =====
   Spec 3.5 (Oran, 2026-10-07: "build it in this phase; it's the safety net if sync ever mangles
   data"). Browsers can't quietly save files, so a backup is a download the buyer keeps:
     <program>-backup-YYYY-MM-DD.json
   It uses the same envelope as saved data, marked as a backup:
     { dd:1, kind:"backup", program, name, schemaVersion, savedAt, data }
   Restore reads a file, checks it belongs to this program, upgrades older data with the program's
   migrate(), checks it with validateData(), asks first, and offers Undo. A restore is an ordinary
   dd.replaceData, so live sync carries it to the other devices.
   Example data is never put in a backup. */
(function () {
  "use strict";
  var dd = window.dd = window.dd || {};
  var backup = dd.backup = {};
  var esc = function (s) { return dd.ui.esc(s); };
  var last = { made: "-", restored: "-" };

  backup.fileName = function () {
    var p = dd.getProgram();
    return p.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-backup-" + dd.ui.isoDate() + ".json";
  };
  /* With live sync on, the backup also carries this program's sync address and the setup code
     (audit 2026-10-08), so restoring it on a cleared or new device reconnects to the buyer's own
     database. That makes the file a key to the data: the Backup sheet says to keep it private. */
  function syncPart() {
    if (!(dd.sync && dd.sync.isOn && dd.sync.isOn())) return null;
    var led = dd.sync.ledger && dd.sync.ledger(), cfg = dd.sync.config && dd.sync.config();
    return led && cfg ? { ledger: led, config: dd.sync.strip(cfg) } : null;
  }
  backup.make = function () {
    var p = dd.getProgram(), out = { dd: 1, kind: "backup", program: p.id, name: p.name, schemaVersion: p.schemaVersion,
                                     savedAt: new Date().toISOString(), data: dd.getData() };
    var sp = syncPart(); if (sp) out.sync = sp;
    return JSON.stringify(out, null, 1);
  };

  /* Download the file. Returns false (and says why) when there's nothing of the buyer's to keep. */
  backup.download = function () {
    if (dd.isExample()) { dd.ui.toast("These are example numbers, so there's nothing of yours to back up yet."); return false; }
    var blob = new Blob([backup.make()], { type: "application/json" }), url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = backup.fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    last.made = new Date().toLocaleTimeString();
    dd.store.set(lastKey(), new Date().toISOString());
    dd.store.set(dd.store.programKey(dd.getProgram().id, "backup_nudge"), String(Date.now()));
    dd.ui.clearNotice("backup");
    dd.ui.toast("Backup downloaded. Keep it somewhere safe.", 3500);
    return true;
  };

  /* Read a backup's text. Returns {ok, data, savedAt} or {ok:false, type, title, help}. */
  backup.read = function (text) {
    var p = dd.getProgram(), raw = null, bad = function () { var f = dd.errors.friendly("backup_bad"); return { ok: false, type: "backup_bad", title: f.title, help: f.help }; };
    try { raw = JSON.parse(String(text || "")); } catch (e) { return bad(); }
    if (!raw || typeof raw !== "object" || raw.dd !== 1 || !("data" in raw)) return bad();
    if (raw.program && raw.program !== p.id) {
      var f = dd.errors.friendly("backup_bad");
      return { ok: false, type: "backup_other", title: "That's a backup from " + (raw.name || "a different program") + ", not " + p.name + ".", help: f.help };
    }
    var v = raw.schemaVersion | 0, body = raw.data;
    if (v > p.schemaVersion) return { ok: false, type: "backup_newer", title: "That backup was made by a newer version of " + p.name + ".", help: "Open it in the newer version instead, or contact DigiDoughnut and we'll help." };
    try { if (v < p.schemaVersion) body = dd.migrateData(p, body, v); } catch (e) { dd.errors.record("backup.migrate", e); return bad(); }
    if (!p.validateData(body)) return bad();
    var sync = null;
    if (raw.sync && typeof raw.sync === "object" && /^[0-9a-f]{32}$/.test(String(raw.sync.ledger)) && dd.sync) {
      var cfg = raw.sync.config && typeof raw.sync.config === "object" ? dd.sync.parseConfig(JSON.stringify(raw.sync.config)) : null;
      if (cfg) sync = { ledger: raw.sync.ledger, config: cfg };
    }
    return { ok: true, data: body, savedAt: raw.savedAt, sync: sync };
  };

  /* Ask, then swap in the backup. Keeps what was there so it can be undone. */
  backup.restoreText = function (text) {
    var r = backup.read(text);
    if (!r.ok) { dd.ui.toast(r.title, 5000); dd.errors.record("backup.restore", r.type); return Promise.resolve(r); }
    var when = r.savedAt && !isNaN(Date.parse(r.savedAt)) ? new Date(r.savedAt).toLocaleString() : "an earlier date";
    var p = dd.getProgram(), thing = p.dataLabel || "numbers";
    return dd.ui.confirm("Restore the backup from " + when + "?",
      "Your " + thing + " on this device will be replaced with the backup." + (dd.sync && dd.sync.isOn() ? " Your other devices will get it too." : "") + " You can undo this straight after.",
      "Yes, restore it", "No, keep what I have").then(function (yes) {
      if (!yes) return { ok: false, type: "cancelled" };
      var before = JSON.stringify(dd.getData()), wasExample = dd.isExample();
      if (!dd.replaceData(r.data, { example: false, source: "restore" })) { var f = dd.errors.friendly("backup_bad"); dd.ui.toast(f.title, 5000); return { ok: false, type: "backup_bad" }; }
      last.restored = new Date().toLocaleTimeString();
      // Live sync isn't on here but the backup knows the buyer's database: reconnect (this device was
      // probably cleared). Anything newer in the database comes back too. On a device that already
      // syncs somewhere, nothing changes: the restored data goes to that database as usual.
      if (r.sync && !dd.sync.isOn()) {
        dd.sync.join(r.sync.ledger, r.sync.config).then(function (j) {
          last.restored += j.ok ? " · live sync reconnected" : " · live sync not reconnected (" + j.type + ")";
          if (j.ok) dd.ui.toast("Live sync is back on. Anything newer from your other devices comes in too.", 4500);
          else dd.ui.notice("sync", "Your backup was restored, but live sync couldn't reconnect. " + j.title + " " + j.help, "warn");
        });
      }
      dd.ui.notice("restore", "Restored the backup from " + when + ".", "info", [
        { label: "Undo", onClick: function () { dd.replaceData(JSON.parse(before), { example: wasExample, source: "restore-undo" }); dd.ui.clearNotice("restore"); dd.ui.toast("Put back the way it was."); } },
        { label: "OK", primary: true, onClick: function () { dd.ui.clearNotice("restore"); } }
      ]);
      return { ok: true };
    });
  };

  /* Open the file picker, then restore. */
  backup.pick = function () {
    var input = document.createElement("input");
    input.type = "file"; input.accept = ".json,application/json"; input.style.display = "none";
    input.addEventListener("change", function () {
      var f = input.files && input.files[0]; input.remove();
      if (!f) return;
      if (f.size > 5 * 1024 * 1024) { var x = dd.errors.friendly("backup_bad"); dd.ui.toast(x.title, 5000); return; }
      f.text().then(backup.restoreText, function (e) { dd.errors.record("backup.file", e); dd.ui.toast("That file couldn't be opened.", 4000); });
    });
    document.body.appendChild(input); input.click();
  };

  /* ---------- "Backup & new versions" (footer, sync sheet) ----------
     Oran, 2026-10-07: make backing up obvious, and say plainly how data reaches a new version:
     same web address = it just stays; live sync on = it's already safe in their own Firebase;
     otherwise download a backup and restore it in the new version. */
  function lastKey() { return dd.store.programKey(dd.getProgram().id, "backup_at"); }
  backup.lastMade = function () { var t = dd.store.get(lastKey()); return t && !isNaN(Date.parse(t)) ? new Date(t) : null; };
  function synced() { return !!(dd.sync && dd.sync.status && dd.sync.status().kind === "ok"); }

  backup.open = function () {
    var p = dd.getProgram(), thing = p.dataLabel || "numbers", on = synced(), last = backup.lastMade();
    var sh = dd.ui.sheet(dd.menu.headHtml({ title: "Backup & new versions", icon: "💾" }) +
      (on ? '<p class="dd-status show ok"><b>✓ Your ' + esc(thing) + ' is backed up live</b> in your own Firebase database (live sync). A new version of ' + esc(p.name) + ' picks it all up by itself.</p>'
          : '<p class="dd-status show warn"><b>Your ' + esc(thing) + ' is saved on this device only.</b> Download a backup now and then, and always before you move to a new version.</p>') +
      '<h3 class="dd-sub">Keep a copy</h3>' +
      '<p class="dd-note">A backup is a small file you keep (your Documents folder, a USB stick or your email). Last backup on this device: <b>' +
        (last ? esc(last.toLocaleDateString()) : "never") + '</b>.</p>' +
      (on ? '<p class="dd-note">With live sync on, the backup also holds your live sync address, so restoring it on a new or cleared device reconnects everything. <b>Keep it private</b>: anyone with the file could open your ' + esc(thing) + '.</p>' : "") +
      '<p class="dd-note"><b>Careful when clearing your browser:</b> clearing "cookies and site data" (or "history and website data") removes your ' + esc(thing) + ', your access code and your live sync address from this device. ' +
        (on ? 'Your live copy stays safe in your own Firebase; restore a recent backup to reconnect.' : 'Download a backup first.') + '</p>' +
      '<div class="dd-btnrow"><button class="dd-btn" data-down>⬇ Download a backup</button><button class="dd-btn ghost" data-up>Restore from a backup</button></div>' +
      '<h3 class="dd-sub">Moving to a new version?</h3>' +
      '<ol class="dd-home-steps">' +
        '<li><b>Same place, same name:</b> upload the new file over the old one, keeping its file name. Your ' + esc(thing) + ' just stays. This is the easiest way.</li>' +
        '<li><b>Live sync on:</b> ' + (on ? "you're all set. Open the new version, turn on live sync there, and everything comes across."
            : 'turn it on first (setup step 4), and the new version gets everything from your own database.') + '</li>' +
        '<li><b>Neither:</b> tap <b>Download a backup</b> here. Then, in the new version, tap <b>💾 Backup &amp; new versions</b> at the bottom and <b>Restore from a backup</b>.</li>' +
      '</ol>' +
      '<p class="dd-note">The new version always comes from the same link you were given when you bought it.</p>' +
      (dd.move ? '<p class="dd-note">Switching between the DigiDoughnut version and your own copy? <button class="dd-linkbtn" data-move style="padding:0">Move to another copy</button> takes your ' + esc(thing) + ' with you.</p>' : "") +
      '<div class="dd-btnrow">' + (!on && dd.sync && dd.setup ? '<button class="dd-btn ghost" data-sync>Set up live sync</button>' : "") +
        '<button class="dd-btn ghost" data-close>Close</button></div>');
    sh.querySelector("[data-close]").addEventListener("click", dd.ui.closeSheet);
    sh.querySelector("[data-down]").addEventListener("click", function () { backup.download(); });
    sh.querySelector("[data-up]").addEventListener("click", function () { dd.ui.closeSheet(); backup.pick(); });
    var mv = sh.querySelector("[data-move]"); if (mv) mv.addEventListener("click", function () { dd.move.open(); });
    var sy = sh.querySelector("[data-sync]"); if (sy) sy.addEventListener("click", function () { dd.ui.closeSheet(); dd.setup.open("sync"); });
  };

  /* A gentle monthly nudge when the data lives on this device only and hasn't been backed up. */
  var NUDGE_MS = 30 * 24 * 3600 * 1000;
  backup.nudge = function () {
    var p = dd.getProgram(); if (!p || dd.isExample() || synced() || (dd.sync && dd.sync.isOn && dd.sync.isOn())) return;
    var k = dd.store.programKey(p.id, "backup_nudge"), snooze = Number(dd.store.get(k)) || 0, last = backup.lastMade();
    if (!snooze) { dd.store.set(k, String(Date.now())); return; }   // first visit with real data: start the clock, don't nag
    if (Date.now() - snooze < NUDGE_MS || (last && Date.now() - last.getTime() < NUDGE_MS)) return;
    var thing = p.dataLabel || "numbers";
    dd.ui.notice("backup", "Your " + thing + " is only on this device, and it's been a while since your last backup.", "info", [
      { label: "Download a backup", primary: true, onClick: function () { dd.ui.clearNotice("backup"); backup.download(); } },
      { label: "Later", onClick: function () { dd.store.set(k, String(Date.now())); dd.ui.clearNotice("backup"); } }
    ]);
  };
  dd.on("ready", function () { setTimeout(backup.nudge, 3000); });

  if (dd.menu) dd.menu.add({ id: "backup", icon: "💾", label: "Backup & new versions", order: 40,
    note: function () { return synced() ? "Backed up live in your own Firebase" : "Saved on this device only"; },
    run: function () { backup.open(); } });

  if (dd.diag) dd.diag.addSection("Backup", function () { return ["Backup downloaded this visit: " + last.made + " · restored this visit: " + last.restored]; });
})();

/* ---- dd.move.js ---- */
/* ===== DigiDoughnut Platform · dd.move — where it lives, and moving between copies (7.2, 7.3) =====
   A buyer can have the same program in several places: the DigiDoughnut version
   (DD_BUILD.home), their own copy (GitHub, tiiny.host, their own website) or a file on their
   computer. Each place keeps its own data in that browser. They can switch at any time and take
   their data with them (Oran, 2026-10-07).

   Moving reuses the setup-carrying link the host wizards already make:
     dd.pair.makeLink({base, includeCode:true, maxLink:60000})
   code + data + live sync, after the "#", so no server sees it. Example data never travels
   (rule 10). With live sync on, the other copy joins the same database (anything already there is
   combined, never thrown away). Too big for a link: download a backup, restore it over there.

   Receiving (rule 15): a copy that already holds the buyer's own data, and it's different, asks
   "Replace what's here with the <dataLabel> from your other copy?" (Replace / Keep mine), with

/* ===== DigiDoughnut Platform · dd.agent — connect your own AI agent (Muse and the like) =====

                   data and tools are JSON text (Firebase drops empty lists and mangles arrays).
                   Written by the buyer's devices whenever the data changes.
     inbox/<id>    instructions the agent drops in: {tool, args, at}. The program carries them
                   out with its OWN tools (the same ones DigiBot uses), so every check still applies.
     done/<id>     the result for the agent: {ok, message, tool, at} or {waiting:true, …}.

   - An instruction waits in the inbox until the program is open somewhere (any of the buyer's
     devices, or the agent's own browser via the agent link). The agent is told so.
   - Big changes (tools with `confirm`) wait for the buyer's Yes on their OWN device. A copy opened
     from the agent link never shows the question.
   - The buyer is told plainly: anyone with the instructions can read and change their data.
     "Disconnect my agent" moves the program to a new secret address (dd.sync.newAddress).

    if (!a || !b) return false;
    return ["v", "program", "name", "example", "summary", "data", "tools"].every(function (k) { return a[k] === b[k]; });
  }
  function scheduleView(ms) { clearTimeout(viewTimer); viewTimer = setTimeout(writeView, ms == null ? 800 : ms); }
  function writeView() {
    viewTimer = null;
    var h = dd.sync.handle(); if (!h) return;
    // Only keep a view when an agent is actually connected: none of this device's business otherwise.
    if (!remoteView && !agent.connected() && !agent.isAgentDevice()) return;
    var v = agent.view();
    if (sameView(remoteView, v)) return;
    // The agent's own browser only fills a missing view: the buyer's devices keep it up to date,
    // so two copies never take turns rewriting it.
    if (agent.isAgentDevice() && remoteView) return;
    // Never more than one write every 3 seconds, whatever happens.
    var wait = 3000 - (Date.now() - lastViewAt);
    if (wait > 0) { scheduleView(wait); return; }
    lastViewAt = Date.now(); diag.views++;
    v.updatedAt = TS;
    h.fb.D.update(h.fb.D.ref(h.db, h.path + "/agent"), { view: v }).catch(function (e) { fail("view", e); });
  }

  /* ---------- the inbox ---------- */
  var lastAgent = null;
  function listen() {
    unlisten();
    var h = dd.sync.handle(); if (!h || !agent.available()) return;
    me = me || dd.ui.uid("dev");
    unsub = h.fb.D.onValue(h.fb.D.ref(h.db, h.path + "/agent"), function (snap) { onAgent(snap.val()); }, function (e) { fail("listening", e); });
  }
  function unlisten() { if (unsub) try { unsub(); } catch (e) {} unsub = null; }

  function onAgent(v) {
    lastAgent = v = v || {};
    remoteView = v.view || null;
    /* PLATFORM CHANGE (2026-10-13, Oran's test): instructions copied on ANOTHER device show up here as the
       agent's view in the shared database. Then setup step 5 is done on this device too. */
    if (remoteView && !agent.connected() && !agent.isAgentDevice()) {
      dd.store.setJSON(key("agent"), { madeAt: new Date().toISOString(), elsewhere: true });
      if (dd.setup) dd.setup.paint();
    }
    if (!sameView(remoteView, agent.view())) scheduleView(viewTimer ? undefined : 200);
    var inbox = v.inbox && typeof v.inbox === "object" ? v.inbox : {}, done = v.done && typeof v.done === "object" ? v.done : {}, next = true;
    // Oldest first by the server's time; agents may choose their own ids (PUT), so the id alone isn't an order.
    var ids = Object.keys(inbox).sort(function (a, b) {
      var ta = Number(inbox[a] && inbox[a].at) || 0, tb = Number(inbox[b] && inbox[b].at) || 0;
      return ta - tb || (a < b ? -1 : a > b ? 1 : 0);
    });
    // A retried instruction whose result is already there was done once: drop it, never do it twice.
    var dup = {};
    ids = ids.filter(function (id) {
      var d = done[id], item = inbox[id];
      if (d && !d.waiting && !(item && item.claim && item.claim.by === me)) { dup["inbox/" + id] = null; return false; }
      return true;
    });
    if (Object.keys(dup).length) { var hd = dd.sync.handle(); if (hd) hd.fb.D.update(hd.fb.D.ref(hd.db, hd.path + "/agent"), dup).catch(function () {}); }
    // Instructions run one at a time, oldest first, across ALL open devices, so they land in the
    // order the agent sent them. A fresh claim by another device means: that one is on it, wait.
    ids.forEach(function (id) {
      var item = inbox[id];
      if (!item || typeof item !== "object") return;
      if (item.state === "waiting") { if (!agent.isAgentDevice() && !busy[id]) ask(id, item); return; }
      if (!next) return;
      next = false;
      var c = item.claim, takenElsewhere = c && c.by !== me && Date.now() - (Number(c.at) || 0) < CLAIM_MS;
      if (!busy[id] && !takenElsewhere) process(id, item);
    });
    // Questions answered elsewhere (or withdrawn) disappear here too.
    var gone = false;
    Object.keys(asked).forEach(function (id) { if (!inbox[id] || inbox[id].state !== "waiting") { delete asked[id]; gone = true; dd.ui.clearNotice("agentask-" + id); } });
    if (gone) dd.emit("agent:asks", agent.waiting());
    prune(v.done);
  }

  /* One device takes an instruction at a time (a transaction), so it's only done once. */
  function claim(id, approving) {
    var h = dd.sync.handle(); if (!h) return Promise.resolve(false);
    return h.fb.D.runTransaction(h.fb.D.ref(h.db, h.path + "/agent/inbox/" + id), function (cur) {
      if (!cur || typeof cur !== "object") return;
      if (cur.state === "waiting" && !approving) return;
      var c = cur.claim;
      if (c && c.by !== me && Date.now() - (Number(c.at) || 0) < CLAIM_MS) return;
      cur.claim = { by: me, at: Date.now() };
      return cur;
    }).then(function (r) { return !!(r && r.committed); }, function (e) { fail("claiming", e); return false; });
  }

  /* Done with an instruction: look over the inbox again (a parked question shows straight away). */
  function release(id) { delete busy[id]; setTimeout(function () { if (lastAgent) onAgent(lastAgent); }, 0); }

  function findTool(name) { return (program.tools || []).filter(function (t) { return t.name === name; })[0]; }
  function actionNames() { return (program.tools || []).map(function (t) { return t.name; }).join(", "); }

  /* Check the agent's inputs against the tool's own description; tidy the obvious ones. */
  function checkArgs(t, args) {
    if (JSON.stringify(args).length > MAX_ARGS) return "The inputs are too long.";
    var params = t.params || {}, keys = Object.keys(params);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i], s = params[k] || {}, v = args[k];
      if (v === undefined || v === null || v === "") { if (!s.optional) return "The input '" + k + "' is missing."; delete args[k]; continue; }
      var type = s.type || "string";
      if (type === "string") { if (typeof v === "number" || typeof v === "boolean") args[k] = String(v); else if (typeof v !== "string") return "The input '" + k + "' should be text."; }
      else if (type === "boolean") { if (v === "true" || v === "false") args[k] = v === "true"; else if (typeof v !== "boolean") return "The input '" + k + "' should be true or false."; }
      else if (type === "number" || type === "integer") { var num = Number(v); if (typeof v === "boolean" || isNaN(num)) return "The input '" + k + "' should be a number."; args[k] = num; }
      if (s.enum && s.enum.indexOf(args[k]) < 0) return "The input '" + k + "' should be one of: " + s.enum.join(", ") + ".";
    }
    return null;
  }

  function process(id, item) {
    busy[id] = 1;
    claim(id, false).then(function (ok) {
      if (!ok) { delete busy[id]; return; }
      var t = findTool(item.tool), args = item.args && typeof item.args === "object" && !Array.isArray(item.args) ? JSON.parse(JSON.stringify(item.args)) : {};
      if (!t) return finish(id, { ok: false, tool: String(item.tool || ""), message: "There's no action called '" + String(item.tool || "") + "'. The actions are: " + actionNames() + "." });
      var bad = checkArgs(t, args);
      if (bad) return finish(id, { ok: false, tool: t.name, message: bad + " Not done." });
      var q = null;
      try { q = typeof t.confirm === "function" ? t.confirm(args, dd.ctx()) : t.confirm; } catch (e) { dd.errors.record("confirm:" + t.name, e); }
      if (q) return park(id, t, args, typeof q === "string" ? q : "Do you want to go ahead?");
      return run(id, t, args);
    }).catch(function (e) { fail("running", e); delete busy[id]; });
  }

  /* Big change: leave it in the inbox, waiting for the buyer's Yes on their own device. */
  function park(id, t, args, question) {
    var h = dd.sync.handle(); if (!h) { delete busy[id]; return; }
    var u = {};
    u["inbox/" + id + "/state"] = "waiting"; u["inbox/" + id + "/question"] = question; u["inbox/" + id + "/args"] = args; u["inbox/" + id + "/claim"] = null;
    u["done/" + id] = { ok: false, waiting: true, tool: t.name, message: "Waiting: this is a big change, so the person has to tap Yes on their own device first. The question shown: " + question, at: TS };
    diag.waiting++; diag.last = new Date().toLocaleTimeString() + " · " + t.name + " waits for Yes";
    return h.fb.D.update(h.fb.D.ref(h.db, h.path + "/agent"), u).then(function () { release(id); }, function (e) { fail("parking", e); delete busy[id]; });
  }

  function run(id, t, args) {
    var note = "";
    if (dd.isExample()) {   // example data never travels: take the examples out first, keep anything the buyer added
      dd.replaceData(dd.withoutExamples(dd.getData()), { example: false, source: "agent" });
      note = " (The program was showing example items, so those were removed first.)";
    }
    var before = JSON.stringify(dd.getData());
    return Promise.resolve().then(function () { return t.run(args, dd.ctx()); }).then(function (res) {
      res = res || {};
      var changed = JSON.stringify(dd.getData()) !== before;
      if (changed) remember(before, res.message || t.name);
      return finish(id, { ok: !!res.ok, tool: t.name, message: (res.message || (res.ok ? "Done." : "That didn't work.")) + note });
    }, function (e) {
      dd.errors.record("agent tool:" + t.name, e);
      return finish(id, { ok: false, tool: t.name, message: "That didn't work." });
    });
  }

  function finish(id, res) {
    var h = dd.sync.handle(); if (!h) { delete busy[id]; return; }
    res.at = TS;
    if (res.ok) diag.ran++; else diag.refused++;
    diag.last = new Date().toLocaleTimeString() + " · " + (res.tool || "?") + " · " + (res.ok ? "done" : "not done");
    var u = {}; u["inbox/" + id] = null; u["done/" + id] = res;
    // The view goes in the SAME write, so once the agent sees the result, the view already shows it.
    var v = agent.view(); v.updatedAt = TS; u.view = v; lastViewAt = Date.now(); diag.views++;
    return h.fb.D.update(h.fb.D.ref(h.db, h.path + "/agent"), u).then(function () { release(id); }, function (e) { fail("answering", e); delete busy[id]; });
  }

  /* The buyer sees what their agent changed on this device, and can put it back. */
  function remember(before, line) {
    if (agent.isAgentDevice()) return;
    if (!undoBefore) undoBefore = before;
    undoLines.push(dd.ui.plain(line)); if (undoLines.length > 3) undoLines.shift();
    dd.ui.notice("agent-undo", "Your AI agent made a change: " + undoLines.join(" · "), "info", [
      { label: "Undo", onClick: function () {
          var b = undoBefore; undoBefore = null; undoLines = []; dd.ui.clearNotice("agent-undo");
          try { if (dd.replaceData(JSON.parse(b), { source: "agent-undo" })) dd.ui.toast("Put back the way it was."); } catch (e) { dd.errors.record("agent.undo", e); }
        } },
      { label: "OK", primary: true, onClick: function () { undoBefore = null; undoLines = []; dd.ui.clearNotice("agent-undo"); } }
    ]);
  }

  /* The Yes / No question for a big change, on the buyer's own device only. */
  function ask(id, item) {
    if (asked[id]) return;
    var t = findTool(item.tool); if (!t) return;
    asked[id] = { id: id, question: item.question || "Do you want to go ahead?", yes: t.yesLabel || "Yes, do it" };
    dd.ui.notice("agentask-" + id, "Your AI agent asks: " + (item.question || "Do you want to go ahead?"), "warn", [
      { label: t.yesLabel || "Yes, do it", primary: true, onClick: function () { answer(id, true); } },
      { label: "No, leave it", onClick: function () { answer(id, false); } }
    ]);
    dd.emit("agent:asks", agent.waiting());
  }
  /* The agent's big changes waiting for the buyer's answer (DigiBot shows them too). */
  agent.waiting = function () { return Object.keys(asked).sort().map(function (id) { return asked[id]; }); };
  agent.answer = function (id, yes) { answer(id, yes); };
  function answer(id, yes) {
    if (busy[id]) return;
    busy[id] = 1; dd.ui.clearNotice("agentask-" + id); delete asked[id];
    dd.emit("agent:asks", agent.waiting());
    claim(id, true).then(function (ok) {
      if (!ok) { delete busy[id]; dd.ui.toast("That was already answered on another device."); return; }
      var item = (lastAgent && lastAgent.inbox && lastAgent.inbox[id]) || {}, t = findTool(item.tool);
      if (!yes || !t) return finish(id, { ok: false, declined: true, tool: item.tool, message: "The person tapped No, so nothing was changed." }).then(function () { dd.ui.toast("Okay, nothing was changed."); });
      var args = item.args && typeof item.args === "object" ? item.args : {};
      return run(id, t, args);
    });
  }

  /* Results older than a week are cleared away (one small write, any device). */
  function prune(done) {
    if (!done || typeof done !== "object") return;
    var h = dd.sync.handle(); if (!h) return;
    var cut = Date.now() - DONE_KEEP_MS, u = {}, n = 0;
    Object.keys(done).forEach(function (id) { var r = done[id]; if (r && typeof r.at === "number" && r.at < cut && n < 50) { u["done/" + id] = null; n++; } });
    if (n) h.fb.D.update(h.fb.D.ref(h.db, h.path + "/agent"), u).catch(function () {});
  }

  function fail(where, e) {
    diag.error = new Date().toLocaleTimeString() + " · " + where + " · " + dd.errors.scrub(String((e && (e.code || e.message)) || e)).slice(0, 160);
    dd.errors.record("agent " + where, e);
  }

  /* ---------- the instructions the buyer pastes into their agent ---------- */
  agent.brief = function () {
    var cfg = dd.sync.config(), led = dd.sync.ledger();
    if (!cfg || !led) return "";
    var base = String(cfg.databaseURL).replace(/\/+$/, "") + "/sync/" + program.id + "/" + led + "/agent";
    var L = label(), lines = [];
    lines.push('You can use my "' + program.name + '" app for me. It is a DigiDoughnut program that keeps my ' + L + '.');
    if (program.knowledge) lines.push("About it: " + program.knowledge);
    lines.push("", "It is reached through my own private Firebase Realtime Database, using its REST API.",
      "", "1. SIGN IN (do this once, then keep the refresh token):",
      "   POST https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + cfg.apiKey,
      '   Body (JSON): {"returnSecureToken": true}',
      '   Use "idToken" from the answer as TOKEN below. It lasts 1 hour. To get a new one:',
      "   POST https://securetoken.googleapis.com/v1/token?key=" + cfg.apiKey,
      "   Body (form): grant_type=refresh_token&refresh_token=<your refreshToken>   (use \"id_token\" from the answer)",
      "", "   BASE = " + base,
      "   Add ?auth=TOKEN to every address below.",
      "", "2. READ MY " + L.toUpperCase() + ":",
      "   GET BASE/view.json?auth=TOKEN",
      '   "summary" is plain text. "data" is all my data as JSON text. "tools" lists the actions as JSON text.',
      '   "updatedAt" is when it last changed (milliseconds). If "example" is true, I haven\'t started my own data yet.',
      "", "3. MAKE A CHANGE (one instruction per change):",
      "   PUT BASE/inbox/<your own id>.json?auth=TOKEN",
      '   Body (JSON): {"tool": "<action name>", "args": { <inputs> }, "at": {".sv": "timestamp"}}',
      "   Make up a new id for each change (letters, digits, - and _, up to 64). Sending the same id again is safe:",
      "   if a call times out, just repeat it, and the change still happens only once.",
      '   (POST BASE/inbox.json with the same body also works, and answers {"name": "<id>"}, but a retried POST can add it twice.)',
      "   Where an action takes an item's id, use the ids from the view's data.",
      "   The app carries it out the next time it is open on any of my devices, so it may not happen straight away.",
      "   To make it happen now, open this link in your web browser and leave it open for about 15 seconds:",
      "   " + agent.link(),
      "", "4. CHECK THE RESULT:",
      "   GET BASE/done/<id>.json?auth=TOKEN",
      "   Instead of asking again and again, you can wait for it: send the same GET with the header",
      "   Accept: text/event-stream and Firebase streams the result to you the moment it's written.",
      "   When a result is there, the view (step 2) already shows the change.",
      "   - null: not done yet (the app isn't open anywhere). Tell me it will happen when I next open the app.",
      '   - "ok": true: done; "message" says what changed.',
      '   - "ok": false: not done; "message" says why.',
      '   - "waiting": true: a big change. It waits until I tap Yes on my own device. Tell me to do that.',
      "", "ACTIONS:");
    toolList().forEach(function (t) {
      var ins = Object.keys(t.inputs).map(function (k) { var i = t.inputs[k]; return k + " (" + (i.type === "string" ? "text" : i.type) + (i.required ? ", required" : ", optional") + ")" + (i.description ? ": " + i.description : ""); });
      lines.push("- " + t.name + ": " + t.description + (t.needsYes ? " (Big change: waits for my Yes.)" : ""),
                 "    args: " + (ins.length ? ins.join("; ") : "none, send {}"));
    });
    lines.push("", "RULES:",
      "- Read the view before changing things, and never make up items or numbers.",
      "- Only use the addresses above. Don't change anything else in the database.",
      "- Keep these instructions private: anyone who has them can read and change my " + L + ".");
    return lines.join("\n");
  };

  /* ---------- the sheet behind setup step 5 ---------- */
  agent.openSheet = function () {
    if (!(dd.sync.isOn() && dd.sync.config())) {
      var s0 = dd.ui.sheet(dd.menu.headHtml({ title: "Connect your AI agent", icon: "🤖" }) + '<p>Your agent reaches ' + esc(program.name) + ' through live sync, so turn that on first (setup step 4).</p>' +
        '<div class="dd-btnrow"><button class="dd-btn" data-sync>Set up live sync</button><button class="dd-btn ghost" data-close>Close</button></div>');
      s0.querySelector("[data-close]").addEventListener("click", dd.ui.closeSheet);
      s0.querySelector("[data-sync]").addEventListener("click", function () { dd.ui.closeSheet(); dd.setup.open("sync"); });
      return;
    }
    var L = label(), conn = agent.connected();
    var sh = dd.ui.sheet(dd.menu.headHtml({ title: "Connect your AI agent", icon: "🤖" }) +
      '<p>Your own AI agent, like Muse, can read your ' + esc(L) + ' and make changes for you. It goes through your own Firebase database: DigiDoughnut never sees any of it.</p>' +
      '<ol class="dd-home-steps"><li>Tap <b>Copy instructions for my agent</b>.</li><li>Paste them into a chat with your agent, then ask for what you want, for example <i>"Add bread to my list."</i></li></ol>' +
      '<p class="dd-status show warn"><b>Keep the instructions private.</b> Anyone who has them can read and change your ' + esc(L) + '. ' +
        'To cut your agent off at any time, tap <b>Disconnect my agent</b>: your ' + esc(L) + ' moves to a new private address, and your other devices need one more scan with Send to my phone.</p>' +
      '<p class="dd-note">Changes your agent asks for happen the next time ' + esc(program.name) + ' is open on any of your devices, or straight away if your agent opens its link. ' +
        'Big changes, like clearing everything, wait until you tap Yes on your own device. Whatever your agent reads also goes to the company that runs it (for Muse, that\'s Meta).</p>' +
      '<div class="dd-btnrow"><button class="dd-btn" data-copy>📋 Copy instructions for my agent</button>' +
        (conn ? '<button class="dd-btn ghost" data-off>Disconnect my agent</button>' : "") +
        '<button class="dd-btn ghost" data-close>Close</button></div>' +
      '<details class="dd-wiz-more"><summary>See the instructions</summary><pre id="dd-agent-brief"></pre></details>');
    var brief = agent.brief();
    sh.querySelector("#dd-agent-brief").textContent = brief;
    sh.querySelector("[data-close]").addEventListener("click", dd.ui.closeSheet);
    sh.querySelector("[data-copy]").addEventListener("click", function (e) {
      var b = e.currentTarget;
      /* PLATFORM CHANGE (2026-10-13, Oran's test): saved the moment the button is tapped, not after the
         clipboard answers (on some phones it never does), and step 5 is ticked straight away. */
      dd.store.setJSON(key("agent"), { madeAt: new Date().toISOString() });
      if (unsub) scheduleView(0);   // the agent's first look is ready straight away (and tells your other devices)
      diag.made = new Date().toLocaleTimeString();
      if (dd.setup) dd.setup.paint();
      dd.ui.toast("Saved: your agent is set up (setup step 5 ✓).", 3000);
      copy(brief, sh.querySelector("#dd-agent-brief")).then(function (ok) {
        b.textContent = ok ? "✓ Copied. Paste it into your agent." : "Select the instructions below and copy them";
        if (!ok) sh.querySelector("details").open = true;
        if (dd.setup) dd.setup.paint();
      });
    });
    var off = sh.querySelector("[data-off]");
    if (off) off.addEventListener("click", function () { agent.disconnect(); });
  };
  function copy(text, pre) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(function () { return true; }, fallback);
    return Promise.resolve(fallback());
    function fallback() {
      try { var r = document.createRange(); r.selectNodeContents(pre); var s = getSelection(); s.removeAllRanges(); s.addRange(r); return document.execCommand("copy"); } catch (e) { return false; }
    }
  }

  agent.disconnect = function () {
    var L = label();
    return dd.ui.confirm("Disconnect your AI agent?",
      "Your " + L + " moves to a new private address that your agent doesn't know. Everything here is kept. Your other devices stop syncing until you scan Send to my phone on them once more.",
      "Yes, disconnect", "No, keep it connected", true).then(function (yes) {
      if (!yes) return false;
      return dd.sync.newAddress().then(function (r) {
        if (!r.ok) { dd.ui.toast(r.title, 5000); return false; }
        dd.store.remove(key("agent"));
        if (dd.setup) dd.setup.paint();
        dd.ui.toast("Disconnected. Your agent can't reach your " + L + " any more.", 4500);
        if (dd.pair && !dd.env.isPhone) setTimeout(dd.pair.open, 400);
        return true;
      });
    });
  };

  /* ---------- start ---------- */
  agent.attach = function (p) {
    program = p;
    if (!agent.available()) return;
    dd.on("sync:changed", function (ev) { if (ev && ev.on && !ev.problem) listen(); else unlisten(); });
    dd.on("change", function () { if (unsub) scheduleView(); });
    deviceNotice();
  };

  if (dd.diag) dd.diag.addSection("AI agent", function () {
    if (!program || !agent.available()) return ["Not available in this program."];
    return ["Instructions copied: " + (agent.connected() ? "yes (" + (dd.store.getJSON(key("agent")) || {}).madeAt + ")" : "no") +
              " · this is the agent's browser: " + (agent.isAgentDevice() ? "yes" : "no") + " · agent link this visit: " + diag.link + " · listening: " + (unsub ? "yes" : "no"),
            "Instructions done: " + diag.ran + " · not done: " + diag.refused + " · waiting for Yes: " + diag.waiting + " · last: " + diag.last + " · view updates sent: " + diag.views,
            "Last agent problem: " + diag.error];
  });
})();

</script>
<script>
/* ===== PROGRAM-SPECIFIC code =====
   Intake (working name, was ByteBot): an AI food tracker. Version notes are in DD_PROGRAM below.

   HOW TO BUILD A NEW APP ON THIS TEMPLATE (kept from the starter)
   Only three places in this file belong to the app. Everything else is the shared platform:
     1. The "PROGRAM-SPECIFIC styles" at the end of the <style> block.
     2. The "PROGRAM-SPECIFIC markup" inside <main id="dd-app">.
     3. This script: one DD_PROGRAM object (the contract below) plus the app's own functions.
   Also change the <title>, the theme-color and apple-mobile-web-app-title meta tags, and the
   <noscript> line near the top to the new app's name.

   The DD_PROGRAM contract
   Required:
     id             lowercase letters and digits; names the app's storage ("dd_<id>_data_v1"). Never change it once sold.
     name, version  shown in the menu, footer and About.
     schemaVersion  bump it whenever the data's shape changes, and handle the old shape in migrate().
     emptyData()    a fresh, empty data object.
     exampleData()  what a first-time buyer sees. Items in lists need FIXED ids (examples are recognised by id).
     validateData(d) true when d is safe to use. Ignore keys you don't know (the platform keeps d.brand).
     migrate(d, fromVersion) upgrade older data (0 = data saved before envelopes).
     render(ctx)    draw the screen from ctx.data. Called after every change.
   Optional:
     mount(ctx)     wire up buttons once, at start.
     tagline, icon, accent, accent2, dataLabel ("items", "shop numbers"…), exampleNotice

     dropped. Only the foods, grams and numbers are saved.

function ikOpenGauge(k) {
  var d = dd.getData(), day = IK_UI.day || ikToday(), es = ikEntriesOn(d, day), t = ikTotals(es, d), g = IK_GBY[k], name = dd.helper ? dd.helper.name() : "DigiBot";
  var title = g ? g.label.replace("{name}", name) : "Gauge", body = "";
  var line = function (key) { var nt = ikNt(key), tg = ikTarget(d, key), v = key === "netcarb" ? Math.max(0, t.v.carb - t.v.fibre) : t.v[key];
    return '<div class="ik-row" style="justify-content:space-between;padding:4px 0"><span>' + ikEsc(nt.label) + "</span><b>" + ikNum(v, nt.dp) + " " + nt.unit + (tg ? ' <span class="ik-small">/ ' + ikNum(tg, nt.dp) + (nt.kind === "limit" ? " max" : "") + "</span>" : "") + "</b></div>"; };
  if (k === "lastmeal") {
    var fs = ikFastState(d), w = ikWindows(d, ikToday(), 7);
    body = "<p>" + (fs.none ? "Nothing logged yet." : "You last ate " + ikEsc(ikEntryName(fs.last.e, d)) + " at " + ikNiceTime(fs.last.e.time) + (fs.last.e.day === ikToday() ? "" : " on " + ikEsc(ikLongDate(fs.last.e.day))) + ". That's " + ikHM(fs.since) + " ago.") + "</p>" +
      '<p class="ik-small">Time counts from when you finished eating: the photo time plus about ' + IK_FINISH_MIN + " minutes. Water, black coffee, plain tea and supplements don't count as eating, so if that's all you log, Intake knows you're fasting. No need to start a fast.</p>" +
      (w.days ? "<p>Last 7 days: eating window " + ikHM(w.feed) + (w.fast != null ? ", fasting " + ikHM(w.fast) : "") + " on average.</p>" : "");
  } else if (k === "balance" || k === "bsl") {
    var dm = ikDayMeals(d, day);
    body = es.filter(function (e) { return e.kind !== "supplement"; }).map(function (e) {
      var m = ikMealStatsM(e, d);
      return '<div class="ik-adv"><div class="ik-row"><span class="ik-grow">' + ikEsc(ikEntryName(e, d)) + "</span>" + (m.score != null ? '<span class="ik-bal ' + ikBalCls(m.score) + '">' + m.score + "</span>" : "") + "</div><p>" +
        "Blood sugar load " + ikNum(m.load, 0) + " (" + ikLoadWord(m.load).toLowerCase() + ")" + (m.spike ? " · ⚠ likely spike" : "") + (m.score != null ? ". " + ikEsc(ikBalTip(m)) : "") + "</p></div>";
    }).join("") || "<p>Nothing logged yet.</p>";
    body += '<p><b>Today:</b> balance ' + (dm.balance == null ? "–" : dm.balance + "/100") + " · blood sugar load " + ikNum(dm.load, 0) + " (" + ikLoadWord(dm.load, true).toLowerCase() + ").</p>" +
      '<p class="ik-small">Meal balance: up to 35 points for protein, 30 for fibre and 35 for going easy on blood sugar. Blood sugar load is an estimate from net carbs, softened by the fibre, protein and fat eaten with them: under 80 a day is low, over 120 high. A glucose meter measures the real thing.</p>';
  } else if (k === "ketosis") {
    var kz = ikKetosis(d);
    body = kz ? "<p><b>" + ikEsc(kz.level) + ".</b> " + (kz.adapted ? "Your net carbs have been under 30 g a day for " + kz.lowDays + "+ days, so your body is probably using fat for fuel." :
      "You've gone " + ikHM(kz.H * 3600000) + " since eating, with " + ikNum(kz.L, 0) + " g of net carbs in the day before. Ketosis usually starts around " + Math.round(kz.T) + " h after a meal like that" + (kz.inFor > 0 ? ", so about " + ikHM(kz.inFor * 3600000) + " so far." : ".")) + "</p>" : "<p>Log a meal to start.</p>";
    body += '<p class="ik-small">A rough estimate from time and carbs, not a measurement. A blood or breath ketone meter tells you for sure.</p>';
  } else if (k === "fastwin") {
    var by = ikEventsByDay(d);
    body = ikDaysBack(ikAddDays(ikToday(), -1), 7).reverse().map(function (dk) {
      var xs = by[dk]; if (!xs) return '<div class="ik-row" style="justify-content:space-between;padding:4px 0"><span>' + ikEsc(ikShortDate(dk)) + '</span><span class="ik-small">nothing eaten logged</span></div>';
      return '<div class="ik-row" style="justify-content:space-between;padding:4px 0"><span>' + ikEsc(ikShortDate(dk)) + "</span><b>" + ikNiceTime(xs[0].e.time) + " – " + ikNiceTime(xs[xs.length - 1].e.time) + ' <span class="ik-small">· ' + ikHM(xs[xs.length - 1].end - xs[0].start) + "</span></b></div>";
    }).join("") + '<p class="ik-small">Eating window: first bite to last bite (photo time plus about ' + IK_FINISH_MIN + " minutes to finish). Fasting window: from the last bite of one day to the first bite of the next.</p>";
  } else if (k === "monthfast") {
    var mf = ikMonthFast(d);
    body = "<p>" + (mf.skip ? mf.msg : mf.ongoing ? "You're on day " + (Math.floor(mf.hrs / 24) + 1) + " (" + ikHM(mf.hrs * 3600000) + ")." : mf.last ? "Your last 3-day fast ended " + Math.round(mf.daysAgo) + " days ago." : "No 3-day fast logged yet.") +
      (mf.due ? " You haven't fasted in a while. Consider a fast." : "") + "</p>" +
      '<p class="ik-small">A fast is found on its own: 60 hours or more with only water, coffee or tea logged. Drink plenty of water, and stop if you feel faint or unwell. Long fasts aren\'t for everyone: talk to your doctor first if you have diabetes, take medicine, are underweight, or have had an eating disorder.</p>';
  } else {
    var conds = IK_GCOND[k] || [], keys = { netcarb: ["netcarb", "carb", "fibre"], nak: ["na", "k"], kidney: ["na", "k", "p", "protein"], preg: ["folate", "fe", "caffeine"], ironc: ["fe", "vitC"], cad: ["ca", "vitD"], vitk: ["vitK"], gout: ["alcohol"] }[k] || [];
    conds.forEach(function (c) { var x = IK_CONDS.concat(IK_MEDS).filter(function (y) { return y.k === c; })[0]; if (x && (ikCond(d, c) || ikMed(d, c))) body += "<p>" + ikEsc(x.advice) + "</p>"; });
    body += keys.map(line).join("");
    var fl = ikDayFlags(d, es).filter(function (x) { return conds.indexOf(x.f.cond) >= 0 || (k === "kidney" && x.f.cond === "kidney"); });
    fl.forEach(function (x) { body += '<div class="ik-warn' + (x.f.lvl === "warn" ? "" : " soft") + '">' + (x.f.lvl === "warn" ? "⚠️ " : "💡 ") + ikEsc(x.f.text) + "</div>"; });
    body += '<p class="ik-small">A reference, not medical advice. Your doctor, pharmacist or dietitian knows your situation best.</p>';
  }
  var sh = dd.ui.sheet('<div class="ik-sheettop"><h2>' + ikEsc(title) + '</h2><button class="ik-x" data-close aria-label="Close">✕</button></div><div class="ik-card">' + body + "</div>" +
    '<div class="ik-quick"><button class="ik-btn soft" data-askg>💬 Ask ' + ikEsc(name) + '</button><button class="ik-btn soft" data-gs>🎛️ Home screen &amp; health</button></div>');
  sh.classList.add("ik-sheet");
  sh.querySelector("[data-close]").addEventListener("click", dd.ui.closeSheet);
  sh.querySelector("[data-gs]").addEventListener("click", function () { ikOpenGauges(); });
  sh.querySelector("[data-askg]").addEventListener("click", function () { dd.ui.closeSheet(); dd.helper.ask("Explain my " + title.toLowerCase() + " gauge today in plain words, and give me one easy idea."); });
}

/* ---------- settings: Home screen & health ---------- */
function ikOpenGauges() {
  var sh = dd.ui.sheet("", { sticky: false }); sh.classList.add("ik-sheet");
  var row = function (attr, on, title, note) {
    return '<label class="ik-tog"><span class="ik-grow"><b>' + ikEsc(title) + "</b>" + (note ? '<span class="ik-small">' + ikEsc(note) + "</span>" : "") + '</span><input type="checkbox" class="ik-sw" ' + attr + (on ? " checked" : "") + ' aria-label="' + ikEsc(title) + '"></label>';
  };
  function paint() {
    var d = dd.getData(), s = ikSet(d), f = ikFastCfg(d), p = s.profile || {}, hidden = s.hidden || {}, name = dd.helper ? dd.helper.name() : "DigiBot", h = "";
    h += '<div class="ik-sheettop"><h2>Home screen &amp; health</h2><button class="ik-x" data-close aria-label="Close">✕</button></div>' +
      '<p class="ik-small" style="margin-top:0">Your home screen works like a dashboard for your body. Turn on what applies to you: each adds its own gauges and warnings. You can hide any gauge at the bottom.</p>';
    h += '<h3 class="ik-sechead">Fasting</h3><div class="ik-card">' +
      row('data-fast="track"', f.track, "Track intermittent fasting", "Eating and fasting windows, a fasting goal and a ketosis estimate. If you only log water, coffee or tea, Intake knows you're fasting.") +
      (f.track ? '<label class="ik-tog"><span class="ik-grow"><b>Fasting goal</b></span><select class="ik-input" data-goal style="width:auto;min-height:38px">' +
        [12, 14, 16, 18, 20, 24].map(function (n) { return '<option value="' + n + '"' + (ikFastGoal(d) === n ? " selected" : "") + ">" + n + " hours (" + n + ":" + (24 - n > 0 ? 24 - n : 0) + ")</option>"; }).join("") + "</select></label>" : "") +
      row('data-fast="monthly"', f.monthly, "3-day fast every month", "A reminder when it's been over a month since your last 3-day fast.") + "</div>";
    h += '<h3 class="ik-sechead">Health conditions</h3><div class="ik-card">' + IK_CONDS.map(function (c) {
      if (c.k === "pregnancy" && p.sex === "m") return "";
      return row('data-cond="' + c.k + '"', ikCond(d, c.k), c.label, c.note);
    }).join("") + "</div>";
    h += '<h3 class="ik-sechead">Medicines I take</h3><div class="ik-card">' + IK_MEDS.map(function (m) { return row('data-med="' + m.k + '"', ikMed(d, m.k), m.label, m.note); }).join("") + "</div>";
    var groups = {};
    IK_GAUGES.forEach(function (g) { if (ikAvail(d, g.id)) (groups[g.group] = groups[g.group] || []).push(g); });
    h += '<h3 class="ik-sechead">On my home screen</h3><div class="ik-card">' + ["Everyday", "Macros", "Fasting", "Health"].map(function (gr) {
      if (!groups[gr]) return "";
      return '<div class="ik-ngroup" style="margin:6px 0 0">' + gr + "</div>" + groups[gr].map(function (g) {
        if (g.id === "m_protein" && ikHideKcal(d)) return "";
        return row('data-g="' + g.id + '"', !hidden[g.id], g.label.replace("{name}", name), "");
      }).join("");
    }).join("") + "</div>";
    h += '<p class="ik-small">Health settings stay on your devices. Intake is a reference, not medical advice: your doctor, pharmacist or dietitian knows your situation best.</p>';
    sh.innerHTML = h;
    sh.querySelector("[data-close]").addEventListener("click", dd.ui.closeSheet);
    var set = function (fn) { dd.update(function (dt) { dt.settings = Object.assign({}, dt.settings); fn(dt.settings); }); paint(); };
    sh.querySelectorAll("[data-fast]").forEach(function (c) { c.addEventListener("change", function () { var k = c.getAttribute("data-fast"); set(function (st) { st.fasting = Object.assign({}, st.fasting); st.fasting[k] = c.checked; }); }); });
    var gs = sh.querySelector("[data-goal]"); if (gs) gs.addEventListener("change", function () { set(function (st) { st.fasting = Object.assign({}, st.fasting, { goal: +gs.value }); }); });
    sh.querySelectorAll("[data-cond]").forEach(function (c) { c.addEventListener("change", function () {
      var k = c.getAttribute("data-cond");
      set(function (st) {
        if (k === "pregnancy") { st.profile = Object.assign({}, st.profile, { pregnant: c.checked }); return; }
        st.conditions = Object.assign({}, st.conditions); if (c.checked) st.conditions[k] = true; else delete st.conditions[k];
      });
    }); });
    sh.querySelectorAll("[data-med]").forEach(function (c) { c.addEventListener("change", function () {
      var k = c.getAttribute("data-med"); set(function (st) { st.meds = Object.assign({}, st.meds); if (c.checked) st.meds[k] = true; else delete st.meds[k]; });
    }); });
    sh.querySelectorAll("[data-g]").forEach(function (c) { c.addEventListener("change", function () {
      var k = c.getAttribute("data-g"); set(function (st) { st.hidden = Object.assign({}, st.hidden); if (c.checked) delete st.hidden[k]; else st.hidden[k] = true; });
    }); });
  }
  paint();
}

/* ---------- Today ---------- */
function ikRenderToday(ctx) {
  var d = ctx.data, day = IK_UI.day || ikToday(), isToday = day === ikToday();
  var es = ikEntriesOn(d, day).slice().sort(function (a, b) { return String(a.time).localeCompare(String(b.time)); });
  var t = ikTotals(es, d), name = dd.helper ? dd.helper.name() : "DigiBot", hide = ikHideKcal(d);
  var p = d.settings.profile || {};
  var h = '<div class="ik-head"><div class="ik-grow"><div class="ik-eyebrow">' + ikEsc(ikLongDate(day)) + '</div><h1 class="ik-h1">' + ikEsc(ikDayName(day).replace(/^(\w+), .*/, "$1")) + "</h1></div>" +
    '<div class="ik-daynav"><button data-day="-1" aria-label="Day before">‹</button><button data-day="1" aria-label="Next day"' + (isToday ? " disabled" : "") + ">›</button></div></div>";
  if (!ikProfileReady(p)) {
    h += '<div class="ik-card ik-setup"><b>Make the targets yours</b><p class="ik-small" style="margin:4px 0 10px">Right now your targets are Canada\'s Daily Values. Add your age, height, weight and how active you are for amounts made for you. About a minute.</p>' +
      '<button class="ik-btn" data-act="profile">Set my targets</button></div>';
  } else if (!ikCook(d).set) {   // V4
    h += '<div class="ik-card ik-setup"><b>How do you cook?</b><p class="ik-small" style="margin:4px 0 10px">Food tables count home cooking with no salt and no oil. Tell Intake how much you salt and what oil you use, and your sodium and fat numbers get closer to real. About 30 seconds.</p>' +
      '<div class="ik-quick" style="margin:0"><button class="ik-btn" data-act="cooking">Set how I cook</button><button class="ik-btn ghost" data-act="cookdefault">Light salt, a little oil</button></div></div>';
  }
  if (!isToday && !es.length && ikFirstDay(d) && day >= ikFirstDay(d)) {   // V4: a past day with nothing logged
    var fk = ikFillMap(d)[day], av = ikAvgDay(d);
    h += fk ? '<div class="ik-card ik-setup"><b>' + (fk === "fast" ? "Marked as a fasting day" : "Filled with your average day") + '</b><p class="ik-small" style="margin:4px 0 10px">' +
        (fk === "fast" ? "It counts as zero in your trends, and toward fasting." : "Trends count it as your usual day" + (av ? ", from the " + av.avgOf + " days you logged recently" : "") + ".") + " Snap or add food here and the real food counts instead.</p>" +
        '<button class="ik-btn ghost" data-fill="clear" data-scope="day">Undo</button></div>'
      : '<div class="ik-card ik-setup"><b>Nothing logged this day</b><p class="ik-small" style="margin:4px 0 10px">Left blank, it\'s skipped in your averages. Did you fast, or eat about like usual?</p>' +
        '<div class="ik-quick" style="margin:0"><button class="ik-btn" data-fill="fast" data-scope="day">I was fasting</button>' +
        (av ? '<button class="ik-btn ghost" data-fill="avg" data-scope="day">Fill with my average</button>' : '<span class="ik-small">Log 3 days to fill with your average.</span>') + "</div></div>";
  }
  /* Oran, 2026-10-13 (V2): the top of Today is one big energy ring, then a ring and a small 7-day graph for
     every macro (fats, carbs, sugars and the rest), then drinks, then vitamins and minerals. The food list
     comes after. With calories hidden, protein takes the big ring. */
  var week = ikDaySeries(d, ikDaysBack(day, 7));
  h += '<div class="ik-todaygrid"><div>';
  /* V3 (2026-10-13): the instrument cluster. Warnings first, then gauges for the health settings the person
     turned on, then the everyday body gauges, the macros, drinks and vitamins. Any of them can be hidden. */
  if (ikShow(d, "hero")) h += ikHeroRing(d, t, week, day);
  if (ikShow(d, "alerts")) h += ikAlertsCard(d, es);
  h += ikHealthCluster(d, t, week, day, es);
  h += ikBodyCluster(d, t, day, isToday);
  var macros = ikMacroDefs(d).filter(function (m) { return ikShow(d, "m_" + m.k); });
  if (macros.length) h += '<div class="ik-macros">' + macros.map(function (m) { return ikMacroTile(d, t, week, m, day); }).join("") + "</div>";
  if (ikShow(d, "drinks")) h += ikWaterTile(d, t, week, day);
  if (ikShow(d, "vitmin")) {
    var vit = ikMetCount(d, t, IK_VITS), min = ikMetCount(d, t, IK_MINS);
    h += '<div class="ik-minis ik-minis2">' +
      '<button class="ik-mini" data-act="nutrients"><div class="ik-t">Vitamins on target</div><div class="ik-n">' + vit + "<span> of " + IK_VITS.length + '</span></div><div class="ik-bar" style="background:var(--ik-vit-soft)"><i style="width:' + Math.round(vit / IK_VITS.length * 100) + '%;background:var(--ik-vit)"></i></div></button>' +
      '<button class="ik-mini" data-act="nutrients"><div class="ik-t">Minerals on target</div><div class="ik-n">' + min + "<span> of " + IK_MINS.length + '</span></div><div class="ik-bar" style="background:var(--ik-min-soft)"><i style="width:' + Math.round(min / IK_MINS.length * 100) + '%;background:var(--ik-min)"></i></div></button></div>';
  }
  if (ikShow(d, "tip")) {
    var tip = ikTopTip(d, day);
    h += '<section class="ik-tip"><svg class="ik-tipring" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="var(--ik-vit)" stroke-width="7"/></svg>' +
      '<div class="ik-tiptext"><b>' + ikEsc(name) + ":</b> " + ikEsc(tip.text) + (tip.k ? '<br><button class="ik-link" data-ask="tip" data-k="' + ikEsc(tip.k) + '">Ask ' + ikEsc(name) + " about this</button>" : "") + "</div></section>";
  }
  h += '<button class="ik-link ik-customize" data-act="gauges">🎛️ Choose what shows here</button>';
  h += "</div><div>";
  // the food list, grouped by part of day; drinks and supplements together at the end
  var groups = { morning: [], afternoon: [], evening: [], other: [] };
  es.forEach(function (e) { (e.kind === "drink" || e.kind === "supplement" ? groups.other : groups[e.part] || groups.afternoon).push(e); });
  var listHtml = "";
  ["morning", "afternoon", "evening", "other"].forEach(function (g) {
    if (!groups[g].length) return;
    listHtml += '<div class="ik-group">' + (g === "other" ? "Drinks &amp; supplements" : IK_PARTS[g]) + "</div>";
    groups[g].forEach(function (e) {
      var et = ikTotals([e], d), icon = e.kind === "drink" ? "drink" : e.kind === "supplement" ? "supplement" : e.part;
      var right = hide ? ikNum(et.v.protein, 0) + "<span> g protein</span>" : ikNum(et.v.kcal, 0) + "<span> kcal</span>";
      listHtml += '<button class="ik-entry" data-entry="' + ikEsc(e.id) + '"><span class="ik-ico ' + icon + '" aria-hidden="true">' + (IK_PART_ICON[icon] || "🍽️") + "</span>" +
        '<span class="ik-grow"><span class="ik-ewhen">' + IK_PARTS[e.part] + " · " + ikNiceTime(e.time) + '</span><br><span class="ik-ename">' + ikEsc(ikEntryName(e, d)) + "</span>" + (et.est ? '<span class="ik-est">estimated</span>' : "") +
        (e.note ? '<br><span class="ik-enote">' + ikEsc(e.note) + "</span>" : "") + ikEntryBadges(e, d) + '</span><span class="ik-ekcal">' + right + "</span></button>";
    });
  });
  /* V4 (Oran, 2026-10-13): one tap for the things you have all the time (a glass of water, the usual coffee). */
  var usual = ikUsual(d, "common").slice(0, 4);
  if (usual.length) h += '<div class="ik-sechead">Add again</div><div class="ik-chips" style="margin:0 0 14px">' + usual.map(function (u) {
    return '<button class="ik-chip" data-again="' + ikEsc(u.sig) + '">＋ ' + ikEsc(u.name) + "</button>"; }).join("") +
    '<button class="ik-chip" data-act="again">More…</button></div>';
  h += '<h2 class="ik-h2" style="margin-top:4px">Food' + (es.length ? "" : "") + "</h2>";
  h += '<section class="ik-list">' + (listHtml || '<div class="ik-empty">Nothing logged ' + (isToday ? "yet today" : "on this day") + '.<br>Tap the camera to snap your food, or add it by typing.</div>') + "</section>";
  h += '<div class="ik-quick"><button class="ik-btn" data-act="photo">📷 Snap my food</button><button class="ik-btn ghost" data-act="again">⚡ Add again</button><button class="ik-btn ghost" data-act="add">＋ Add by typing</button>' +
    '<button class="ik-btn ghost" data-act="forgot">🕐 Forgot a meal?</button><button class="ik-btn ghost" data-act="supp">💊 Supplement</button></div>';
  h += "</div></div>";
  // every nutrient, folded away
  h += '<details class="ik-card ik-more" id="ikAllN"' + (IK_UI.openAll ? " open" : "") + '><summary>Every nutrient ' + (isToday ? "today" : "this day") + "</summary>" + ikNutrientList(d, t, 1) + "</details>";
  ctx.ui.$("ikToday").innerHTML = h;
}
/* All nutrients against targets. days = how many days the totals cover (averages for spans). */
function ikNutrientList(d, t, days) {
  days = days || 1; var out = '<div class="ik-nlist">', lastG = "";
  IK_N.forEach(function (n) {
    if (n.k === "kcal" && ikHideKcal(d)) return;
    if (n.g !== lastG) { out += '<div class="ik-ngroup">' + ikEsc(n.g) + "</div>"; lastG = n.g; }
    var v = t.v[n.k] / days, tg = n.kind === "info" && n.k !== "fat" ? null : ikTarget(d, n.k), allMissing = t.items > 0 && t.miss[n.k] >= t.items, someMissing = t.miss[n.k] > 0;
    if (n.k === "added") allMissing = true;
    var pct = tg ? v / tg * 100 : null, cls = "", note = "";
    if (n.kind === "limit" && pct > 100) cls = "ik-hi"; else if (n.kind === "target" && t.items && pct != null && pct < 50) cls = "ik-low";
    var val = allMissing ? '<span class="ik-nm">not measured</span>' : "<b class=\"" + cls + "\">" + ikNum(v, n.dp) + " " + n.unit + "</b>" + (tg ? ' <span class="ik-small">/ ' + ikNum(tg, n.dp) + (n.kind === "limit" ? " max" : "") + "</span>" : "");
    if (!allMissing && someMissing && t.items) note = '<div class="ik-small">Not measured for ' + t.miss[n.k] + " of " + t.items + " foods.</div>";
    if (n.k === "alcohol" && v > 0) note += '<div class="ik-small">' + ikNum(v / IK_EDITION.standardDrinkG, 1) + " standard drinks" + (days > 1 ? " a day on average" : "") + ".</div>";
    var color = n.g === "Vitamins" ? "var(--ik-vit)" : n.g === "Minerals" ? "var(--ik-min)" : n.k === "protein" ? "var(--ik-protein)" : n.k === "fibre" ? "var(--ik-fibre)" : n.k === "kcal" ? "var(--ik-energy)" : "var(--ik-fat)";
    if (cls === "ik-hi") color = "var(--ik-high)";
    out += '<div class="ik-nrow"><div class="ik-row"><span>' + ikEsc(n.label) + "</span><span>" + val + "</span></div>" +
      (tg && !allMissing ? '<div class="ik-bar"><i style="width:' + Math.min(100, Math.max(0, pct || 0)).toFixed(0) + "%;background:" + color + '"></i></div>' : "") + note + "</div>";
  });
  return out + '</div><p class="ik-small" style="margin-top:12px">"Not measured" means the food table has no value for that food, so it isn\'t counted as zero. Added sugars aren\'t listed separately in the Canadian Nutrient File.</p>';
}

/* ---------- Trends ---------- */
function ikSpanDays(span, end) {

/* ---------- the food list the AI picks from (ids only: code does the numbers) ---------- */
function ikFoodListForAI(d) {
  var lines = IK_FOODLIST.map(function (f) { return f.key + ": " + f.label; });
  (d.recipes || []).forEach(function (r) { lines.push("r:" + r.id + ": " + r.name + " (the person's own recipe)"); });
  (d.customFoods || []).forEach(function (c) { if (c.kind !== "supplement") lines.push("c:" + c.id + ": " + c.name + " (the person's own food)"); });
  return lines.join("\n");
}
/* An id from the AI (or a word from the buyer) -> a ref we know, or null. */
function ikRefFor(match, d) {
  var m = String(match || "").trim(); if (!m || m === "none") return null;
  if (/^t:/.test(m)) m = m.slice(2);
  if (IK_FOODS[m]) return "t:" + m;
  if (/^[rc]:/.test(m) && ikResolve(m, d)) return m;
  if (/^s:/.test(m) && ikResolve(m, d)) return m;
  return null;
}
/* Words -> best matches from everything the buyer can log. */
function ikSearch(q, d, limit) {
  q = String(q || "").toLowerCase().trim(); if (!q) return [];
  var words = q.split(/[\s,]+/).filter(Boolean), out = [];
  function score(label) {
    var l = label.toLowerCase(), s = 0;
    for (var i = 0; i < words.length; i++) { var w = words[i].replace(/s$/, ""); if (l.indexOf(w) < 0) return 0; s += l.indexOf(w) === 0 ? 3 : 1; }
    return s + (l.indexOf(q) === 0 ? 5 : 0) - l.length / 100;
  }
  (d.recipes || []).forEach(function (r) { var s = score(r.name); if (s) out.push({ ref: "r:" + r.id, label: r.name, sub: "My recipe", s: s + 2 }); });
  (d.customFoods || []).forEach(function (c) { var s = score(c.name); if (s) out.push({ ref: "c:" + c.id, label: c.name, sub: c.kind === "supplement" ? "My supplement" : "My food", s: s + 2 }); });
  IK_FOODLIST.forEach(function (f) { var s = score(f.label); if (s) out.push({ ref: "t:" + f.key, label: f.label, sub: f.kind === "drink" ? "Drink" : "", s: s }); });
  Object.keys(IK_SUPPS).forEach(function (k) { var s = score(IK_SUPPS[k].label + " supplement vitamin"); if (s) out.push({ ref: "s:" + k, label: IK_SUPPS[k].label, sub: "Supplement (typical)", s: s }); });
  return out.sort(function (a, b) { return b.s - a.s; }).slice(0, limit || 12);
}
function ikPer100FromEstimate(o) {
  var p = {}; IK_N.forEach(function (n) { p[n.k] = null; });
  var map = { kcal: "kcal_per_100g", protein: "protein_per_100g", fat: "fat_per_100g", carb: "carb_per_100g", fibre: "fibre_per_100g", sugar: "sugar_per_100g", na: "sodium_mg_per_100g", sat: "sat_fat_per_100g" };
  Object.keys(map).forEach(function (k) { var v = Number(o[map[k]]); if (isFinite(v) && v >= 0 && o[map[k]] != null) p[k] = v; });
  return p;
}
/* A recipe's nutrients per 100 g, from its ingredients (code counts). */
function ikRecipeFrom(name, ingredients, d) {
  var total = 0, sum = {}, miss = {}, plants = {};
  IK_N.forEach(function (n) { sum[n.k] = 0; miss[n.k] = false; });
  ingredients.forEach(function (ing) {
    total += Number(ing.g) || 0;
    var x = ikItemNutrients(ing, d), r = ikResolve(ing.ref, d);
    Object.keys(x.v).forEach(function (k) { sum[k] += x.v[k]; });
    Object.keys(x.miss).forEach(function (k) { miss[k] = true; });
    if (r && r.food && r.plant) plants[r.food.key] = 1;
  });
  var per100 = {};
  IK_N.forEach(function (n) { per100[n.k] = miss[n.k] || !total ? null : +(sum[n.k] / total * 100).toPrecision(4); });
  return { name: name, per100: per100, totalG: Math.round(total), ingredients: ingredients.map(function (i) { return { ref: i.ref, g: Math.round(i.g), name: i.name || "" }; }), plants: Object.keys(plants) };
}

/* ---------- Add by typing ---------- */

  sh.classList.add("ik-sheet");

  function list() {
    chosen = null; amt.innerHTML = "";
